<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paris-Abenteuer – Französisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  body{min-height:100vh;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;

    background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 40% 70%,#ffe9a8,transparent),radial-gradient(1px 1px at 85% 55%,#fff,transparent),
    radial-gradient(1px 1px at 25% 88%,#fff,transparent),radial-gradient(1px 1px at 60% 40%,#cfe0ff,transparent),
    radial-gradient(1.5px 1.5px at 92% 85%,#fff,transparent),radial-gradient(1px 1px at 5% 50%,#fff,transparent)}
  main{position:relative;max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .flag{display:flex;width:34px;height:24px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 2px rgba(217,168,60,.6)}
  .flag i{flex:1}.flag i:nth-child(1){background:#2b5ca8}.flag i:nth-child(2){background:#f4f1ea}.flag i:nth-child(3){background:#d13b3b}
  h1{font-family:'Cinzel',serif;color:var(--gold2);font-size:24px;margin:0;line-height:1.1}
  .sub{display:block;font-size:12.5px;opacity:.75}
  .hud{display:flex;flex-wrap:wrap;gap:6px}
  .badge{background:rgba(0,0,0,.35);border:1px solid rgba(217,168,60,.45);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800}
  .badge.warnb{border-color:#e89a3c;color:#ffd39a}
  .btn{font-family:'Cinzel',serif;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:11px 18px;cursor:pointer;
    background:linear-gradient(#f6d27a,#d9a83c);color:#2a1d07;box-shadow:0 4px 0 #8a6420;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6420}
  .btn.ghost{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(217,168,60,.5);box-shadow:none}
  .btn.blue{background:linear-gradient(#5d8fd6,#2f5fa6);color:#fff;box-shadow:0 4px 0 #1d3f73}
  .btn:disabled{opacity:.5;cursor:default}
  .btnRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

  .card{background:var(--card);border:1px solid rgba(217,168,60,.3);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .center{text-align:center}
  .sectionTitle{font-family:'Cinzel',serif;color:var(--gold2);font-size:21px;margin:16px 0 6px}
  .hint-sm{font-size:13.5px;opacity:.8;line-height:1.5}
  .muted{opacity:.6}

  .mapWrap{position:relative;width:100%;max-width:560px;margin:8px auto;aspect-ratio:100/130;border-radius:14px;overflow:hidden;
    border:8px solid #2b1d12;box-shadow:0 10px 34px rgba(0,0,0,.55)}
  .mapSvg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
  .pinB{position:relative;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;
    background:radial-gradient(circle at 35% 30%,#fff3cf,#e2b75a);border:2px solid #7a5420;box-shadow:0 3px 8px rgba(0,0,0,.45)}
  .pin.boss .pinB{width:46px;height:46px;font-size:25px;border-color:#a3241c}
  .pin.done .pinB{background:radial-gradient(circle at 35% 30%,#e3f4dd,#7fb377);border-color:#2e6a2e}
  .pin.locked{cursor:default}
  .pin.locked .pinB{background:#b8ad99;filter:grayscale(1);opacity:.75;font-size:15px}
  .pin.cur .pinB{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,69,58,.7)}50%{box-shadow:0 0 0 10px rgba(196,69,58,0)}}
  .chk{position:absolute;right:-5px;bottom:-4px;background:#2e6a2e;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;
    display:flex;align-items:center;justify-content:center;font-weight:900}
  .pinL{margin-top:2px;font-size:10.5px;font-weight:800;color:#3a2a14;background:rgba(246,236,211,.92);border-radius:6px;padding:1px 5px;white-space:nowrap}
  /* Kampf */
  .foe{display:flex;align-items:center;gap:12px}
  .foeIcon{font-size:44px;line-height:1}
  .foeName{font-family:'Cinzel',serif;color:var(--gold2);font-size:18px}
  .hpbar{height:12px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;margin:8px 0 4px}
  .hpbar>div{height:100%;background:linear-gradient(90deg,#e0564a,#f09a5c);transition:width .4s}
  .dots{display:flex;gap:5px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
  .dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.15)}
  .dot.on{background:var(--gold2)}.dot.t2.on{background:#f09a5c}.dot.t3.on{background:#e0564a}
  .qLabel{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;text-align:center}
  .qText{font-size:23px;font-weight:800;text-align:center;margin:8px 0 12px;line-height:1.35}
  .qText.fr{color:#cfe0ff}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .opt{background:rgba(0,0,0,.3);border:1px solid rgba(217,168,60,.45);color:var(--ink);border-radius:12px;padding:13px 8px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
  .opt.correct{background:rgba(90,154,90,.4);border-color:#7fc27f}
  .opt.wrong{background:rgba(192,69,58,.4);border-color:#e57d72}
  .fillIn{display:block;width:100%;max-width:560px;margin:0 auto;font-size:19px;padding:12px 14px;border-radius:12px;border:2px solid rgba(217,168,60,.55);
    background:rgba(0,0,0,.35);color:var(--ink);font-family:inherit;font-weight:700;text-align:center}
  .fillIn.correct{border-color:#7fc27f}.fillIn.wrong{border-color:#e57d72}
  .accBar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
  .acc{min-width:38px;padding:7px 8px;border-radius:9px;border:1px solid rgba(207,224,255,.5);background:rgba(59,111,182,.25);color:#e8f0ff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .line{min-height:54px;border:2px dashed rgba(217,168,60,.5);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;background:rgba(0,0,0,.2)}
  .lineHint{font-size:13px;opacity:.6}
  .bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
  .tile{font-family:inherit;font-size:16.5px;font-weight:800;padding:8px 12px;border-radius:10px;border:1px solid rgba(217,168,60,.6);
    background:linear-gradient(#fff6dc,#ecd39a);color:#2a1d07;cursor:pointer}
  .tile.on{background:linear-gradient(#dfeaff,#a9c4ec);border-color:#5d8fd6}
  .tile.ghost{opacity:.2;cursor:default}
  .fb{margin:12px auto 0;max-width:600px;padding:14px 16px;border-radius:14px;border:2px solid;text-align:center}
  .fb.ok{background:rgba(90,154,90,.18);border-color:rgba(90,154,90,.75)}
  .fb.no{background:rgba(192,69,58,.18);border-color:rgba(192,69,58,.75)}
  .fbTitle{font-family:'Cinzel',serif;font-size:18px;font-weight:700;margin-bottom:6px}
  .fb.ok .fbTitle{color:#a8e0a8}.fb.no .fbTitle{color:#ffab9e}
  .fbLine{font-size:15.5px;line-height:1.55;margin:5px 0}
  .fbWord{font-weight:800;color:var(--gold2);font-size:18px}
  .fbWord mark{background:rgba(240,154,92,.35);color:#ffe0b8;border-radius:4px;padding:0 3px}
  .yours{text-decoration:line-through;opacity:.85}
  .yours mark.extra{background:rgba(224,86,74,.35);color:#ffd2cc;border-radius:4px;padding:0 3px;text-decoration:line-through}
  .fbLine.sub{opacity:.85;font-size:14px}
  .fbLine.ex{background:rgba(0,0,0,.22);border-radius:10px;padding:8px 10px;font-size:14.5px}
  .fbLine.ex .fr,.frTxt{color:#cfe0ff;font-weight:700}
  .fbLine.note{background:rgba(59,111,182,.18);border:1px solid rgba(93,143,214,.45);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left}
  .fbLine.warn{color:#ffd39a;font-weight:700}
  .fbLine.small{font-size:13px;opacity:.85}
  .atk{color:var(--gold2);font-weight:800;margin-top:8px}

  .stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
  .stamp{text-align:center;padding:12px 6px;border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

  .stamp.locked .e{font-family:'Cinzel',serif;color:rgba(217,168,60,.6)}
  .fact{background:rgba(0,0,0,.25);border:1px solid rgba(217,168,60,.3);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px;line-height:1.5;text-align:left}
  .fact.new{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(243,210,122,.25)}
  .fact.locked{opacity:.5;text-align:center;font-family:'Cinzel',serif}
  .factT{font-family:'Cinzel',serif;color:var(--gold2);font-size:13px;margin-bottom:3px}
  .bigStamp{font-size:64px;margin:6px 0}

  .evRow{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
  .evBar{height:12px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
  .evBar>div{height:100%}.evBar .g{background:#6fbf6f}.evBar .y{background:#e8c25a}.evBar .r{background:#e0564a}.evBar .muted{background:#888}
  .evV{font-weight:800;white-space:nowrap}
  .discBox{margin-top:10px;font-size:13px}.discBox .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
  .discNote{background:rgba(111,191,111,.18);border:1px solid rgba(111,191,111,.5);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:14px}
  .seenRow{margin:10px 0}.seenRow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
  .seenBar{height:10px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden}.seenBar>div{height:100%;background:#6fa8e8}

  .weakItem{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
  .spkRow{display:flex;justify-content:center;gap:8px;margin:6px 0 2px}
  .spk{font-family:inherit;font-weight:800;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid rgba(217,168,60,.6);background:rgba(0,0,0,.3);color:var(--ink);cursor:pointer}
  .spk:active,.spk.playing{background:linear-gradient(#f6d27a,#d9a83c);color:#2a1d07}
  .spk.sm{padding:3px 9px;font-size:13px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{font-family:inherit;font-weight:800;font-size:14px;padding:9px 13px;border-radius:10px;border:1px solid rgba(217,168,60,.5);background:rgba(0,0,0,.3);color:var(--ink);cursor:pointer}
  .seg button.on{background:linear-gradient(#f6d27a,#d9a83c);color:#2a1d07}
  textarea.stateBox{width:100%;height:110px;margin-top:8px;font-size:11px;border-radius:8px;padding:8px;background:rgba(0,0,0,.4);color:var(--ink);border:1px solid rgba(217,168,60,.4)}
  #msg{display:none;margin-top:10px;padding:12px 14px;border:1px solid;border-radius:12px;background:rgba(0,0,0,.25);font-size:14px;line-height:1.5}
  @media (max-width:380px){ .pinB{width:32px;height:32px;font-size:17px} .pin.boss .pinB{width:40px;height:40px;font-size:21px} .pinL{font-size:9.5px;padding:1px 3px} }
  @media (max-width:520px){ h1{font-size:20px} .qText{font-size:20px} .opts{grid-template-columns:1fr} .evRow{grid-template-columns:1fr;gap:3px} }
</style>

   Nutzt die eingebaute Sprachausgabe des Geräts (Web Speech API, Französisch fr-FR) – keine Audiodateien, funktioniert offline,

const TTS = {ok: (typeof window!=="undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window), voice:null};
function ttsPickVoice(){
  if(!TTS.ok) return null;
  let vs = []; try{ vs = speechSynthesis.getVoices() || []; }catch(e){}
  const fr = vs.filter(v=>/^fr([-_]|$)/i.test(v.lang||""));
  if(!fr.length){ TTS.voice = null; return null; }
  const score = v => (/fr[-_]FR/i.test(v.lang)?10:0) + (/premium|enhanced|erweitert|siri/i.test(v.name)?6:0) + (/thomas|amélie|amelie|audrey|google/i.test(v.name)?3:0) + (v.localService?1:0);
  fr.sort((a,b)=>score(b)-score(a)); TTS.voice = fr[0]; return TTS.voice;
}
if(TTS.ok){ try{ ttsPickVoice(); speechSynthesis.addEventListener("voiceschanged", ttsPickVoice); }catch(e){} }
function ttsClean(s){
  return String(s).replace(/\s*\(?\s*qn\s*\/\s*qc\s*\)?/gi," quelqu'un ou quelque chose").replace(/\bqn\b/gi,"quelqu'un").replace(/\bqc\b/gi,"quelque chose")
    .replace(/\s*…\s*/g,", ").replace(/\s*\/\s*/g,", ").replace(/;/g,",").replace(/\s+/g," ").replace(/^[–-]\s*/,"").replace(/\s+[–-]\s+/g,". ").trim();
}

  if(!TTS.ok || !text) return;

    if(!hit.length && SANCHOR[sn.id]) hit = SANCHOR[sn.id].map(id=>VIDX[id]).filter(i=>i!==undefined);
    if(hit.length) SPOS[sn.id] = {lo:Math.min.apply(null,hit), hi:Math.max.apply(null,hit)};
  });
})();
function inPages(it){
  const P = S.pages, pg = PAGE[it.id];
  if(!pg || pg<P.from || pg>P.to) return false;
  const pos = it.kind==="v" ? (VIDX[it.id]!==undefined ? {lo:VIDX[it.id],hi:VIDX[it.id]} : null) : (SPOS[it.id]||null);
  if(pg===P.from && P.fromWord){ if(!pos || pos.lo < VIDX[P.fromWord]) return false; }
  if(pg===P.to && P.toWord){ if(!pos || pos.hi > VIDX[P.toWord]) return false; }
  return true;
}
function inScope(k,it){ return k==="pages" ? inPages(it) : SCOPES[k].tags.includes(it.tag); }
function scopeLabel(){
  if(S.scope!=="pages") return SCOPES[S.scope].label;
  const P=S.pages, w=id=>{ const v=VOCAB[VIDX[id]]; return v ? "„"+first(v.fr)+"“" : ""; };
  let t = P.from===P.to ? "S. "+P.from : "S. "+P.from+"–"+P.to;
  if(P.fromWord) t += " ab "+w(P.fromWord);
  if(P.toWord) t += " bis "+w(P.toWord);
  return t + (P.kinds==="v" ? " · nur Vokabeln" : P.kinds==="s" ? " · nur Sätze" : "");
}

const QV = () => VOCAB.filter(v=>!isLocked(v) && !v.info);
const QS = () => SENTS.filter(s=>!isLocked(s));

/* ---------- Spielstand ---------- */
function defaultState(){
  return {started:false, scope:"all", mode:"normal", node:0, xp:0, maxStreak:0, answered:0,
          stats:{}, tstats:{}, defeated:[], facts:[], weak:{}, stage:{}, tfail:{}, seen:{}, rd:{}, rounds:{}, miss:{}, discOrder:"book",
          pages:{from:184, to:185, fromWord:"", toWord:"", kinds:"both"},
          map:0, m2:{node:0, defeated:[]}, m3:{node:0, defeated:[]}, tts:{auto:"after", slow:false}};
}
let S = defaultState();
function normalizeState(){
  const d = defaultState();
  Object.keys(d).forEach(k=>{
    const ok = S[k]!==undefined && S[k]!==null && typeof S[k]===typeof d[k] && Array.isArray(S[k])===Array.isArray(d[k]);
    if(!ok) S[k]=d[k];
  });
  if(!SCOPES[S.scope]) S.scope="all";
  { const P = S.pages, d0 = d.pages;
    P.from = PAGES.includes(+P.from) ? +P.from : d0.from; P.to = PAGES.includes(+P.to) ? +P.to : d0.to;
    if(P.from > P.to){ const t=P.from; P.from=P.to; P.to=t; }
    ["fromWord","toWord"].forEach(k=>{ const pgx = k==="fromWord" ? P.from : P.to;
      const v = VOCAB[VIDX[P[k]]]; if(typeof P[k]!=="string" || !v || v.info || isLocked(v) || PAGE[v.id]!==pgx) P[k]=""; });
    if(P.from===P.to && P.fromWord && P.toWord && VIDX[P.fromWord] > VIDX[P.toWord]) P.fromWord="";
    if(!["both","v","s"].includes(P.kinds)) P.kinds="both"; }
  if(!["normal","exam","discover"].includes(S.mode)) S.mode="normal";
  S.node = Math.max(0, Math.min(NODES.length-1, parseInt(S.node)||0));
  S.xp = Number(S.xp)||0; S.maxStreak = Number(S.maxStreak)||0; S.answered = Number(S.answered)||0;
  S.defeated = S.defeated.filter(i=>Number.isInteger(i) && i>=0 && i<NODES.length);
  if(typeof S.m2!=="object" || !S.m2 || Array.isArray(S.m2)) S.m2 = {node:0, defeated:[]};
  if(!Array.isArray(S.m2.defeated)) S.m2.defeated = [];
  S.m2.defeated = S.m2.defeated.filter(i=>Number.isInteger(i) && i>=0 && i<NODES2.length);
  S.m2.node = Math.max(0, Math.min(NODES2.length-1, parseInt(S.m2.node)||0));
  if(typeof S.m3!=="object" || !S.m3 || Array.isArray(S.m3)) S.m3 = {node:0, defeated:[]};
  if(!Array.isArray(S.m3.defeated)) S.m3.defeated = [];
  S.m3.defeated = S.m3.defeated.filter(i=>Number.isInteger(i) && i>=0 && i<NODES3.length);
  S.m3.node = Math.max(0, Math.min(NODES3.length-1, parseInt(S.m3.node)||0));
  S.map = (S.map===1 || S.map===2) && mapUnlocked(S.map) ? S.map : 0;
  if(typeof S.tts!=="object" || !S.tts || Array.isArray(S.tts)) S.tts = {auto:"after", slow:false};
  if(!["off","after","both"].includes(S.tts.auto)) S.tts.auto = "after";
  S.tts.slow = S.tts.slow===true;
  S.facts = S.facts.filter(i=>Number.isInteger(i) && i>=0 && i<FACTS.length);
  S.facts = S.facts.filter(i=>{ const m = factMap(i); return m<1 || mapUnlocked(m) || PRof(m).defeated.length>0; });
  Object.keys(S.weak).forEach(id=>{ if(!ITEM[id] || !Number.isFinite(S.weak[id])) delete S.weak[id]; });
  /* "gesehen"-Zähler: nur gültige IDs; was schon als Wackelkandidat vorkommt, wurde garantiert schon gefragt */
  Object.keys(S.seen).forEach(id=>{ if(!ITEM[id] || !(S.seen[id]>0)) delete S.seen[id]; });
  Object.keys(S.weak).forEach(id=>{ if(!S.seen[id]) S.seen[id]=1; });
  /* Entdecker-Runden: pro Bereich eine Rundennummer; rd[bereich][id] = Runde, in der die Aufgabe zuletzt beantwortet wurde.
     Neu angelegte Bereiche übernehmen einmalig, was schon als "gesehen" bekannt ist (Runde 1). */
  Object.keys(S.miss).forEach(id=>{ if(!ITEM[id] || !(S.miss[id]>0)) delete S.miss[id]; });
  Object.keys(S.weak).forEach(id=>{ if(!S.miss[id]) S.miss[id]=1; });
  Object.keys(SCOPES).forEach(k=>{
    if(!(S.rounds[k]>=1)) S.rounds[k]=1;
    if(typeof S.rd[k]!=="object" || !S.rd[k] || Array.isArray(S.rd[k])){
      S.rd[k]={};
      if(S.rounds[k]===1) Object.keys(S.seen).forEach(id=>{ if(ITEM[id] && k!=="pages" && inScope(k,ITEM[id])) S.rd[k][id]=1; });
    }
    Object.keys(S.rd[k]).forEach(id=>{ if(!ITEM[id]) delete S.rd[k][id]; });
  });
  if(!["book","mix"].includes(S.discOrder)) S.discOrder="book";
}

/* ---------- Hilfsfunktionen ---------- */
const app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function alts(s){ return String(s).split(";").map(x=>x.trim()).filter(Boolean); }
function first(s){ return alts(s)[0]; }
function bump(obj, key, ok){ obj[key]=obj[key]||{a:0,c:0}; obj[key].a++; if(ok) obj[key].c++; }

/* Normalisierung: Groß-/Kleinschreibung und Satzzeichen zählen nicht – Akzente schon (streng). */
function normFr(s){
  return String(s||"").toLocaleLowerCase("fr")
    .replace(/œ/g,"oe").replace(/æ/g,"ae")      /* „oe“ und „œ“ gelten als gleich (Tastatur!) – sœur = soeur */
    .replace(/\(?\s*\bqn\s*\/\s*qc\b\s*\)?/g," ").replace(/\b(qn|qc)\b/g," ")   /* Platzhalter „qn/qc“ (= jemand/etwas) muss nicht getippt werden; mit oder ohne gilt als richtig */
    .replace(/[’‘`´]/g,"'")
    .replace(/[«»"“”„]/g," ")
    .replace(/[–—]/g," ")
    .replace(/(^|\s)-(?=\s|$)/g," ")
    .replace(/[.,!?;:…()]/g," ")
    .replace(/'\s+/g,"'")
    .replace(/\s+/g," ").trim();
}
function normDe(s){
  return String(s||"").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[’‘`´']/g,"")
    .replace(/[«»"“”„]/g," ")
    .replace(/[–—-]/g," ")
    .replace(/[.,!?;:…()]/g," ")
    .replace(/\s+/g," ").trim();
}
function stripAcc(s){ return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

/* ---------- Auswahl der nächsten Aufgabe ---------- */
let bag = {v:[], s:[]}, recent = [];
function resetBags(){ bag = {v:[], s:[]}; recent = []; }
function poolV(){ if(S.scope==="pages") return S.pages.kinds==="s" ? [] : QV().filter(inPages); const t=SCOPES[S.scope].tags; return QV().filter(v=>t.includes(v.tag)); }
function poolS(){ if(S.scope==="pages") return S.pages.kinds==="v" ? [] : QS().filter(inPages); const t=SCOPES[S.scope].tags; return QS().filter(s=>t.includes(s.tag)); }
/* ---------- Modus "Neu entdecken" ----------
   Fragt zuerst nur Aufgaben, die in der aktuellen Runde noch nicht beantwortet wurden (Runde 1 = noch nie gesehen).
   Vokabeln und Sätze werden im Verhältnis ihrer Restmenge gemischt, damit beide gleichzeitig fertig werden.
   Runde 1 nach Buchreihenfolge (oder gemischt), ab Runde 2 nach Priorität: oft falsche zuerst.
   Die Wiederholung falscher Aufgaben (S.weak) läuft in nextItem() weiter wie immer. */
let roundNotice = "";
function discoverRemaining(){
  const r = S.rounds[S.scope], rd = S.rd[S.scope];
  return {v: poolV().filter(x=>rd[x.id]!==r), s: poolS().filter(x=>rd[x.id]!==r)};
}
function discoverStats(){
  const r = S.rounds[S.scope], rd = S.rd[S.scope], all = poolV().concat(poolS());
  return {round:r, done: all.filter(x=>rd[x.id]===r).length, total: all.length};
}
function completeRound(){
  const st = discoverStats(), r = S.rounds[S.scope];
  S.xp += 100;
  S.rounds[S.scope] = r + 1;
  roundNotice = `🎉 Runde ${r} geschafft! Alle ${st.total} Aufgaben dieses Bereichs hast du entdeckt (+100 XP). Runde ${r+1} beginnt – zuerst kommen die kniffligen.`;
  saveState();
}
function discoverPick(){
  let rem = discoverRemaining();
  if(!rem.v.length && !rem.s.length){ completeRound(); rem = discoverRemaining(); }
  const kind = !rem.v.length ? "s" : !rem.s.length ? "v" : (Math.random() < rem.s.length/(rem.s.length+rem.v.length) ? "s" : "v");
  let list = rem[kind];
  const round = S.rounds[S.scope];
  if(round > 1){
    const key = {}; list.forEach(x=>key[x.id]=Math.random());
    list = list.slice().sort((a,b)=>((S.miss[b.id]||0)-(S.miss[a.id]||0)) || (key[a.id]-key[b.id]));
  } else if(S.discOrder==="mix"){
    list = shuffle(list);
  }
  return list.find(x=>!recent.includes(x.id)) || list[0];
}
function nextItem(){
  let pv = poolV(), ps = poolS();
  if(!pv.length && !ps.length){ pv = QV(); ps = QS(); }   /* leere Auswahl: nie ohne Aufgabe dastehen */
  const allowed = new Set([...(S.mode==="exam" && ps.length ? [] : pv), ...ps].map(x=>x.id));
  /* Falsch beantwortete Aufgaben kommen bevorzugt wieder dran, bis sie 2× in Folge richtig waren */
  const due = Object.keys(S.weak).filter(id=>allowed.has(id) && !recent.includes(id));
  let item = null;
  if(due.length && Math.random() < 0.5){
    item = ITEM[rnd(due)];
  } else if(S.mode==="discover"){
    item = discoverPick();
  } else {
    const kind = !ps.length ? "v" : (S.mode==="exam" || !pv.length) ? "s" : (Math.random() < 0.65 ? "s" : "v");
    const pool = kind==="s" ? ps : pv;
    if(!bag[kind].length) bag[kind] = shuffle(pool.map(x=>x.id));
    let id = bag[kind].pop(), guard = 0;
    while(recent.includes(id) && bag[kind].length && guard++ < 6){ bag[kind].unshift(id); id = bag[kind].pop(); }
    item = ITEM[id];
  }
  recent.push(item.id); if(recent.length > 8) recent.shift();
  return item;
}

/* ---------- Multiple Choice: Ablenker aus derselben Wortart ---------- */
function vgroup(v){
  if(/^cp(3\d|4\d|50)$/.test(v.id)) return "num";
  if(/^(le|la|les) |^l'/i.test(v.fr)) return "noun";
  return "other";
}
function mcOptions(v, field){
  const correct = first(v[field]);
  const okAlts = alts(v[field]).map(x=>x.toLowerCase());
  const g = vgroup(v);
  const vDe = alts(v.de).map(s=>s.toLowerCase()), vFr = alts(v.fr).map(s=>s.toLowerCase());
  const usable = x => x.id!==v.id && x.fr!==v.fr && x.de!==v.de
    && !alts(x.de).some(s=>vDe.includes(s.toLowerCase())) && !alts(x.fr).some(s=>vFr.includes(s.toLowerCase()));
  let cand = QV().filter(x=>usable(x) && vgroup(x)===g).map(x=>first(x[field]));
  cand = [...new Set(cand)].filter(c=>!okAlts.includes(c.toLowerCase()));
  if(cand.length < 3){
    const more = QV().filter(usable).map(x=>first(x[field])).filter(c=>!okAlts.includes(c.toLowerCase()) && !cand.includes(c));
    cand = [...new Set(cand.concat(more))];
  }
  return {opts: shuffle([correct, ...shuffle(cand).slice(0,3)]), correct};
}

/* ---------- Satzbausteine mit gezielten Ablenkern ---------- */
const CONF_FR = {"à":["en","dans"],"en":["à","dans"],"dans":["à","en"],"le":["la","les"],"la":["le","les"],"les":["le","la"],
  "suis":["es","est"],"es":["suis","est"],"est":["et","es"],"et":["est"],"sommes":["sont","êtes"],"êtes":["est","sommes"],
  "sont":["sommes","est"],"ou":["où"],"où":["ou"],"moi":["toi"],"toi":["moi"],"il":["elle"],"elle":["il"],"ils":["elles"],
  "elles":["ils"],"l'ami":["l'amie"],"l'amie":["l'ami"],"aime":["aimes"],"aimes":["aime"],"habite":["habites"],"habites":["habite"],
  "c'est":["sont"],"de":["à"],"j'ai":["je"],"je":["tu"],"tu":["je"]};
const CONF_DE = {"ich":["du"],"du":["ich"],"er":["sie"],"sie":["er"],"in":["aus"],"aus":["in"],"der":["die","das"],"die":["der","das"],
  "das":["der","die"],"und":["oder"],"oder":["und"],"bin":["bist","ist"],"ist":["bist","sind"],"sind":["seid","ist"],"mag":["magst"],
  "magst":["mag"],"wohne":["wohnst"],"wohnst":["wohne"],"wo":["wie"],"wie":["wo"]};
function tokens(s){
  return String(s).replace(/[–—]/g," ").split(/\s+/)
    .map(t=>t.replace(/^[«"„“(]+/,"").replace(/[.,!?;:…»"“”)]+$/,""))
    .filter(t=>t && t!=="-");
}
function tileSet(answer, lang){
  const toks = tokens(answer);
  const have = new Set(toks.map(t=>t.toLowerCase()));
  const conf = lang==="fr" ? CONF_FR : CONF_DE;
  let d = [];
  shuffle(toks).forEach(t=>{ (conf[t.toLowerCase()]||[]).forEach(c=>{ if(!have.has(c) && !d.includes(c)) d.push(c); }); });
  d = shuffle(d).slice(0,2);
  if(d.length < 2){
    const src = QS().map(s=> lang==="fr" ? s.frAlts[0] : s.deAlts[0]).flatMap(tokens);
    const extra = shuffle([...new Set(src)]).filter(t=>!have.has(t.toLowerCase()) && !d.includes(t));
    d = d.concat(extra.slice(0, 2-d.length));
  }
  return shuffle(toks.concat(d)).map(t=>({t, used:false}));
}

/* ---------- Antwort prüfen ---------- */
function checkAnswer(given, accepted, lang){
  const N = lang==="fr" ? normFr : normDe;
  const g = N(given);
  if(accepted.some(a=>N(a)===g)) return {ok:true, best:accepted.find(a=>N(a)===g)};
  if(lang==="fr"){
    const acc = accepted.find(a=>stripAcc(N(a))===stripAcc(g));
    if(acc) return {ok:false, why:"accent", best:acc};
  }
  const gt = g.split(" ");
  let best = accepted[0], score = -1;
  accepted.forEach(a=>{ const sc = N(a).split(" ").filter(t=>gt.includes(t)).length; if(sc>score){ score=sc; best=a; } });
  return {ok:false, why:null, best};
}
/* markiert in der richtigen Lösung alle Wörter, die in der eigenen Antwort fehlen oder anders sind */
function highlight(correct, given, lang){
  const N = lang==="fr" ? normFr : normDe;
  const gt = N(given).split(" ");
  return String(correct).split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part)) return part;
    const n = N(part);
    if(!n || gt.includes(n)) return esc(part);
    return `<mark>${esc(part)}</mark>`;
  }).join("");
}
/* markiert in der eigenen Antwort alle Wörter, die in der Lösung nicht vorkommen (z. B. ein überflüssiges „à la“) */
function markExtra(given, correct, lang){
  const N = lang==="fr" ? normFr : normDe;
  const ct = N(correct).split(" ");
  return String(given).split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part)) return part;
    const n = N(part);
    if(!n || ct.includes(n)) return esc(part);
    return `<mark class="extra">${esc(part)}</mark>`;
  }).join("");
}
function genderInfo(word){
  const w = word.toLowerCase();
  if(w.startsWith("le ")) return "männlich (le)";
  if(w.startsWith("la ")) return "weiblich (la)";
  if(w.startsWith("les ")) return "Mehrzahl (les)";
  if(w.startsWith("l'")) return "vor einem Vokal werden le und la zu l' – das Geschlecht musst du dir extra merken";
  return "";
}

function mapSVG(){

  const route = `<polyline points="${pts}" fill="none" stroke="#a33" stroke-width=".55" stroke-dasharray="1.3 1.2" opacity=".5"/>
    <polyline points="${donePts}" fill="none" stroke="#c4453a" stroke-width=".9" stroke-linejoin="round" opacity=".9"/>`;
  const defs = `<defs>
      <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="#cdb88e" stroke-width=".15"/></pattern>
      <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="62%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#3b2a12" stop-opacity=".38"/></radialGradient>
    </defs>`;
  const compass = (cx,cy)=>`<g transform="translate(${cx} ${cy})" fill="#5a4320" font-size="2.6" text-anchor="middle">
      <circle r="5" fill="none" stroke="#7a5a35" stroke-width=".35"/>
      <path d="M0,-4.6 L1.1,0 L0,4.6 L-1.1,0 Z" fill="#c4453a"/><path d="M-4.6,0 L0,1.1 L4.6,0 L0,-1.1 Z" fill="#7a5a35"/>
      <text y="-6">N</text></g>`;

    if(battle.q==="vDF_mc"){ const m = mcOptions(it,"fr"); battle.opts=m.opts; battle.correct=m.correct; }
  } else {
    battle.dir = S.mode==="exam" ? "df" : (Math.random() < 0.5 ? "fd" : "df");   /* Klassenarbeit: nur Deutsch→Französisch */

function insertChar(i){
  const inp = document.getElementById("typeIn"); if(!inp || inp.disabled) return;
  const c = ACCENTS[i];
  const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? inp.value.length;
  inp.value = inp.value.slice(0,s) + c + inp.value.slice(e);
  inp.focus(); const p = s + c.length; try{ inp.setSelectionRange(p,p); }catch(err){}
}
function renderTiles(){
  const line = document.getElementById("line"), bank = document.getElementById("bank");
  if(!line || !bank) return;
  line.innerHTML = battle.picked.length
    ? battle.picked.map((ti,j)=>`<button class="tile on" onclick="unpick(${j})">${esc(battle.tiles[ti].t)}</button>`).join("")
    : `<span class="lineHint">Tippe die Bausteine in der richtigen Reihenfolge an …</span>`;
  bank.innerHTML = battle.tiles.map((t,i)=> t.used ? `<span class="tile ghost">${esc(t.t)}</span>`
    : `<button class="tile" onclick="pick(${i})">${esc(t.t)}</button>`).join("");
}
function pick(i){ if(!battle || battle.answered) return; const t = battle.tiles[i]; if(!t || t.used) return; t.used = true; battle.picked.push(i); renderTiles(); }
function unpick(j){ if(!battle || battle.answered) return; const i = battle.picked[j]; if(i==null) return; battle.tiles[i].used = false; battle.picked.splice(j,1); renderTiles(); }
function resetTiles(){ if(!battle || battle.answered) return; battle.tiles.forEach(t=>t.used=false); battle.picked = []; renderTiles(); }

function answerMC(i){
  if(!battle || battle.answered) return;
  battle.answered = true;
  const chosen = battle.opts[i], ok = chosen===battle.correct;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(battle.opts[j]===battle.correct) b.classList.add("correct"); else if(j===i) b.classList.add("wrong");
  });
  resolve(ok, ok?null:chosen, {ok, best:battle.correct});
}
function checkTiles(){
  if(!battle || battle.answered || !battle.picked.length) return;
  const given = battle.picked.map(i=>battle.tiles[i].t).join(" ");
  const fd = battle.dir==="fd";
  const r = checkAnswer(given, fd ? battle.item.deAlts : battle.item.frAlts, fd ? "de" : "fr");
  battle.answered = true;
  resolve(r.ok, r.ok?null:given, r);
}
function checkType(){
  if(!battle || battle.answered) return;
  const inp = document.getElementById("typeIn"); if(!inp) return;
  const given = inp.value; if(!given.trim()) return;
  const it = battle.item; let r;
  if(battle.q==="vDF_type"){
    const acc = alts(it.fr);
    r = checkAnswer(given, acc, "fr");
    if(!r.ok && r.why!=="accent"){
      /* richtiges Wort, aber falscher oder fehlender Artikel? */
      const g = normFr(given).replace(/^(le |la |les |l'|un |une )/,"");
      for(const a of acc){
        const m = a.match(/^(le |la |les |l')(.+)$/i);
        if(m && (normFr(m[2])===g || stripAcc(normFr(m[2]))===stripAcc(g))){ r = {ok:false, why:"article", best:a}; break; }
      }
    }
  } else {
    const fd = battle.dir==="fd";
    r = checkAnswer(given, fd ? it.deAlts : it.frAlts, fd ? "de" : "fr");
  }
  battle.answered = true;
  inp.disabled = true; inp.classList.add(r.ok ? "correct" : "wrong");
  resolve(r.ok, r.ok?null:given, r);
}

function resolve(ok, given, r){
  const it = battle.item;
  const tkey = it.kind==="v" ? (battle.q==="vFD" ? "vFD" : "vDF") : (battle.dir==="fd" ? "sFD" : "sDF");
  bump(S.stats, it.tag, ok); bump(S.tstats, tkey, ok);
  S.answered++;
  S.seen[it.id] = (S.seen[it.id]||0) + 1;
  Object.keys(SCOPES).forEach(k=>{ if(inScope(k,it)) S.rd[k][it.id] = S.rounds[k]; });
  if(!ok) S.miss[it.id] = (S.miss[it.id]||0) + 1;
  const notes = [];
  /* Wiederholungs-Logik: falsche Aufgaben merken, bis sie 2× in Folge richtig waren */
  if(ok){
    if(S.weak[it.id]!=null){
      S.weak[it.id]++;
      if(S.weak[it.id] >= 2){ delete S.weak[it.id]; notes.push("✅ Gemeistert! Diese Aufgabe kommt jetzt wieder normal dran."); }
      else notes.push("🔁 Noch einmal richtig, dann sitzt es!");
    }
  } else {
    S.weak[it.id] = 0;
    notes.push("🔁 Diese Aufgabe kommt bald wieder – bis du sie zweimal in Folge richtig hast.");
  }
  /* Gerüst: erst Bausteine, dann selbst tippen; nach 2 Tipp-Fehlern in Folge wieder Bausteine */
  if(it.kind==="s"){
    const key = it.id+":"+battle.dir;
    if(battle.q==="sTiles" && ok){ S.stage[key]=1; S.tfail[key]=0; notes.push("⬆️ Gut gebaut! Nächstes Mal tippst du diesen Satz selbst."); }
    if(battle.q==="sType"){
      if(ok) S.tfail[key]=0;
      else { S.tfail[key]=(S.tfail[key]||0)+1; if(S.tfail[key]>=2){ S.stage[key]=0; S.tfail[key]=0; notes.push("🧱 Nächstes Mal hilft dir bei diesem Satz wieder der Baukasten."); } }
    }
  }
  let attack = null;
  if(ok){
    battle.streak++; if(battle.streak > S.maxStreak) S.maxStreak = battle.streak;
    let dmg = battle.q==="sType" ? 14 : battle.q==="sTiles" ? 10 : battle.q==="vDF_type" ? 9 : 7;
    dmg = Math.max(1, Math.round(dmg * (MAPS[battle.map].dmgMul || 1)));
    let label = ATTACKS[battle.q];
    if(battle.streak % 15===0){ dmg += ri(60,80); label = "🗼 Eiffel-Blitz (15er-Serie!)"; }
    else if(battle.streak % 10===0){ dmg += ri(30,45); label = "🎺 Trompeten-Fanfare (10er-Serie!)"; }
    else if(battle.streak % 5===0){ dmg += ri(15,25); label = "🥐 Croissant-Wirbel (5er-Serie!)"; }
    battle.foeHP = Math.max(0, battle.foeHP - dmg);
    S.xp += it.kind==="s" ? 10 : 5;
    attack = `${label}: −${dmg} KP`;
  } else {
    battle.streak = 0;
    const fn = MAPS[battle.map].nodes[battle.node];
    if(fn.heal && battle.foeHP > 0 && battle.foeHP < battle.foeMax){
      const before = battle.foeHP;
      battle.foeHP = Math.min(battle.foeMax, battle.foeHP + fn.heal);
      attack = `🩹 ${esc(fn.foe)} erholt sich: +${battle.foeHP - before} KP`;
    }
  }
  saveState();
  showFeedback(ok, given, r||{}, notes, attack);
}

function showFeedback(ok, given, r, notes, attack){
  const it = battle.item, box = document.getElementById("feedback");
  if(!box){ continueBattle(); return; }
  const typed = ["vDF_type","sType","sTiles"].includes(battle.q);
  let body = "";
  if(it.kind==="v"){
    const shown = battle.q==="vFD" ? battle.correct : (r.best || first(it.fr));
    const lang = battle.q==="vFD" ? "de" : "fr";
    const disp = (!ok && typed && given) ? highlight(shown, given, lang) : esc(shown);
    body += `<div class="fbLine">${ok?"":"Richtig ist: "}<span class="fbWord">${disp}</span></div>`;
    body += `<div class="fbLine sub"><span class="frTxt">${esc(alts(it.fr).join(" / "))}</span> = ${esc(it.de.replace(/;/g,","))}</div>`;
    if(it.exFr) body += `<div class="fbLine ex"><span class="fr">${esc(it.exFr)}</span><br>${esc(it.exDe||"")}</div>`;
  } else {
    const fd = battle.dir==="fd", acc = fd ? it.deAlts : it.frAlts;
    const shown = ok ? (r.best || acc[0]) : (r.best || acc[0]);
    const disp = (!ok && given) ? highlight(shown, given, fd?"de":"fr") : esc(shown);
    body += `<div class="fbLine">${ok?"":"Richtig ist: "}<span class="fbWord">${disp}</span></div>`;
    const others = acc.filter(a=>a!==shown).slice(0,2);
    if(others.length) body += `<div class="fbLine small">Auch richtig: ${others.map(esc).join(" · ")}</div>`;
    body += `<div class="fbLine ex"><span class="fr">${esc(it.frAlts[0])}</span><br>${esc(it.deAlts[0])}</div>`;
    if(it.note) body += `<div class="fbLine note">💡 ${esc(it.note)}</div>`;
  }
  let warn = "";
  if(!ok && r.why==="accent") warn = `<div class="fbLine warn">✏️ Fast! Nur die <b>Akzente</b> stimmen nicht – im Französischen zählen sie. Schau dir die markierten Wörter an.</div>`;
  if(!ok && r.why==="article") warn = `<div class="fbLine warn">✏️ Das Wort stimmt, aber der <b>Artikel</b> fehlt oder ist falsch. Lerne Nomen immer mit Artikel: ${esc(r.best)} – ${esc(genderInfo(r.best))}.</div>`;
  let yourDisp = esc(given||"");
  if(!ok && given && typed){
    const lang = it.kind==="v" ? "fr" : (battle.dir==="fd" ? "de" : "fr");
    const ref = it.kind==="v" ? (r.best || first(it.fr)) : (r.best || (battle.dir==="fd" ? it.deAlts[0] : it.frAlts[0]));
    yourDisp = markExtra(given, ref, lang);
  }
  const wrongLine = (!ok && given) ? `<div class="fbLine">Deine Antwort: <span class="yours">${yourDisp}</span></div>` : "";
  const done = battle.foeHP <= 0;
  const spk = TTS.ok ? `<div class="fbLine small" style="margin-top:6px">Aussprache üben:</div>` + spkBtns(it.id,"","Französisch")
      + ((it.kind==="v" && it.exFr) ? `<div class="spkRow"><button class="spk" type="button" onclick="say('${it.id}',false,'ex')">🔊 Beispielsatz</button><button class="spk" type="button" onclick="say('${it.id}',true,'ex')">🐢 langsam</button></div>` : "") : "";
  box.innerHTML = `<div class="fb ${ok?"ok":"no"}">
    <div class="fbTitle">${ok?"✓ Richtig ! Très bien !":"✗ Leider falsch"}</div>
    ${wrongLine}${warn}${body}${spk}
    ${attack ? `<div class="fbLine atk">${attack}</div>` : ""}
    ${!ok ? `<div class="fbLine small">Die Serie beginnt wieder bei 0.</div>` : ""}
    ${notes.map(t=>`<div class="fbLine small">${t}</div>`).join("")}
    <div class="btnRow center"><button class="btn" id="nextBtn" onclick="continueBattle()">${done?"Sieg ansehen →":"Weiter →"}</button></div>
  </div>`;
  const hf = document.getElementById("hpFill"), ht = document.getElementById("hpTxt");
  if(hf) hf.style.width = (battle.foeHP/battle.foeMax*100)+"%";
  if(ht) ht.textContent = `${battle.foeHP} / ${battle.foeMax} KP`;
  /* Fokus erst im nächsten Tick: sonst löst der Enter-Tastendruck, der die Antwort
     abgeschickt hat, sofort auch den Weiter-Button aus (bekannter Stolperstein). */
  autoSpeak("answer");
  setTimeout(()=>{ const b = document.getElementById("nextBtn"); if(b){ try{ b.focus(); b.scrollIntoView({block:"nearest", behavior:"smooth"}); }catch(e){} } }, 0);
}
function continueBattle(){
  if(!battle) return;
  if(battle.foeHP <= 0){ win(); return; }
  newQuestion();
}
function flee(){ battle = null; showMap(); }

function unlockFacts(n, mapIdx){
  const rg = FACT_RANGES[mapIdx] || FACT_RANGES[0];
  const pool = FACTS.map((_,i)=>i).filter(i=>!S.facts.includes(i) && i>=rg[0] && i<rg[1]);
  const got = shuffle(pool).slice(0,n);
  got.forEach(i=>S.facts.push(i));
  return got;
}
function win(){
  const mi = battle.map, M = MAPS[mi], nodes = M.nodes, P = PRof(mi);
  const i = battle.node, n = nodes[i];
  const firstWin = !P.defeated.includes(i);
  if(firstWin) P.defeated.push(i);
  if(i===P.node && P.node < nodes.length-1) P.node++;
  S.xp += 30;
  const got = unlockFacts(firstWin ? 2 : 1, mi);
  saveState();
  battle = null;
  const allDone = P.defeated.length===nodes.length;
  const nm = mi+1, newMap = n.boss && mi<2 && mapUnlocked(nm) && !PRof(nm).defeated.length;
  app.innerHTML = header() + `<div class="card center">
    <div class="bigStamp">${n.icon}</div>
    <h2 style="font-family:Cinzel,serif;color:var(--gold2);margin:4px 0">${n.boss ? M.winBoss : "Station geschafft !"}</h2>
    <p>${n.foeIcon} <b>${esc(n.foe)}</b> <span class="muted">(${esc(n.foeDe)})</span> ist besiegt. <b>+30 XP</b>${firstWin?" und ein neuer Stempel für dein Reisetagebuch":""}.</p>
    ${got.map(fi=>`<div class="fact new"><div class="factT">📜 Neuer Frankreich-Fakt</div>${esc(FACTS[fi])}</div>`).join("")}
    ${!got.length ? `<p class="hint-sm">Du kennst schon alle Fakten – Chapeau !</p>` : ""}
    ${allDone && n.boss ? `<p><b>Félicitations !</b> Du hast alle Stationen geschafft. Übe weiter, damit die Sätze richtig sitzen.</p>` : ""}
    ${newMap ? `<p><b>${MAPS[nm].icon} Neue Karte freigeschaltet: ${esc(MAPS[nm].title.replace("Deine Reise durch ","").replace(/^die /,"die "))}!</b> Dort warten neue Gegner und neue Fakten${nm===2?" – und sie sind deutlich stärker":""}.</p>` : ""}
    <div class="btnRow center">${newMap ? `<button class="btn" onclick="switchMap(${nm})">${MAPS[nm].icon} Zur neuen Karte</button>` : ""}<button class="btn ${newMap?"ghost":""}" onclick="showMap()">🗺️ Zur Karte</button>
      <button class="btn ghost" onclick="enterNode(${i})">⚔️ Nochmal hier üben</button>
      <button class="btn ghost" onclick="showCarnet()">📔 Reisetagebuch</button></div>
  </div>`;
  window.scrollTo(0,0);
}

function bar(label, st){
  if(!st || !st.a) return `<div class="evRow"><div>${label}</div><div class="evBar"></div><div class="evV muted">noch keine Daten</div></div>`;
  const p = Math.round(st.c/st.a*100);
  const cls = st.a < 3 ? "muted" : p>=85 ? "g" : p>=60 ? "y" : "r";
  return `<div class="evRow"><div>${label}</div><div class="evBar"><div class="${cls}" style="width:${p}%"></div></div><div class="evV">${p} % <span class="muted">(${st.c}/${st.a})</span></div></div>`;
}
function showEval(){
  battle = null;
  const weakIds = Object.keys(S.weak).filter(id=>ITEM[id]);
  const weakHTML = weakIds.length ? weakIds.slice(0,20).map(id=>{
    const it = ITEM[id];
    const fr = it.kind==="v" ? alts(it.fr).join(" / ") : it.frAlts[0];
    const de = it.kind==="v" ? it.de.replace(/;/g,",") : it.deAlts[0];

  }).join("") + (weakIds.length>20 ? `<div class="hint-sm">… und ${weakIds.length-20} weitere</div>` : "")
    : `<div class="hint-sm">Gerade nichts offen – très bien !</div>`;
  const seenHTML = Object.keys(TAGS).filter(t=>!LOCKED.includes(t)).map(t=>{
    const vs = QV().filter(v=>v.tag===t), ss = QS().filter(x=>x.tag===t);
    const all = vs.concat(ss), seen = all.filter(x=>S.seen[x.id]).length;
    if(!all.length) return "";
    const pct = Math.round(seen/all.length*100);
    const unseen = all.filter(x=>!S.seen[x.id]);
    const line = x => x.kind==="v" ? `${esc(alts(x.fr).join(" / "))} <span class="muted">– ${esc(x.de.replace(/;/g,","))}</span>` : `${esc(x.frAlts[0])} <span class="muted">– ${esc(x.deAlts[0])}</span>`;
    return `<div class="seenRow"><div class="top"><span>${esc(TAGS[t])}</span><span><b>${seen}</b> von ${all.length} <span class="muted">(${vs.filter(v=>S.seen[v.id]).length}/${vs.length} Vokabeln · ${ss.filter(x=>S.seen[x.id]).length}/${ss.length} Sätze)</span></span></div>
      <div class="seenBar"><div style="width:${pct}%"></div></div>
      ${unseen.length ? `<details class="unseen"><summary>Noch nicht gesehen (${unseen.length})</summary>${unseen.map(x=>`<div class="weakItem">${line(x)}</div>`).join("")}</details>` : `<div class="hint-sm">Alles mindestens einmal gesehen ✓</div>`}</div>`;
  }).join("");
  app.innerHTML = header() + nav() + `
    <div class="sectionTitle">📊 Auswertung</div>

      <div class="hint-sm">Grün ab 85 % · Gelb 60–84 % · Rot unter 60 % · grau = weniger als 3 Antworten</div>
      <div class="sectionTitle" style="font-size:16px">Nach Buchteil</div>
      ${Object.keys(TAGS).filter(t=>!LOCKED.includes(t)).map(t=>bar(TAGS[t], S.stats[t])).join("")}
      ${(LOCKED.length||LOCKED_IDS.length) ? `<div class="hint-sm" style="margin-top:6px">🔒 Noch nicht dran: ${esc(LOCKED_LABEL)}</div>` : ""}
      <div class="sectionTitle" style="font-size:16px">👀 Schon gesehen – nach Buchteil</div>
      <div class="hint-sm">Zeigt, wie viel vom Stoff Lukas schon mindestens einmal beantwortet hat. Die Zählung beginnt mit dieser Version; frühere Antworten sind nur bei den aktuellen Wackelkandidaten bekannt.</div>
      ${seenHTML}
      <div class="hint-sm" style="margin-top:10px">🔍 Entdecker-Runde im Bereich <b>${esc(scopeLabel())}</b>: Runde <b>${discoverStats().round}</b> – <b>${discoverStats().done}</b> von ${discoverStats().total} Aufgaben dran.</div>
      <div class="sectionTitle" style="font-size:16px">Nach Aufgabenart</div>
      ${bar("Sätze Französisch → Deutsch", S.tstats.sFD)}
      ${bar("Sätze Deutsch → Französisch", S.tstats.sDF)}
      ${bar("Vokabeln Französisch → Deutsch", S.tstats.vFD)}
      ${bar("Vokabeln Deutsch → Französisch", S.tstats.vDF)}

      <div class="seg">${Object.keys(SCOPES).map(k=>`<button class="${S.scope===k?"on":""}" onclick="setScope('${k}')">${esc(SCOPES[k].label)}</button>`).join("")}</div>
      ${S.scope==="pages" ? pagesPanel() : ""}
      <div class="hint-sm" style="margin-top:8px">Im aktuellen Bereich: <b>${ns} Sätze</b> und <b>${nv} Vokabeln</b>.${(ns+nv)===0 ? ' <b style="color:#f09a5c">Keine Aufgaben in dieser Auswahl – bitte ändern.</b>' : ''}</div>
      ${S.scope==="pages" ? `<div class="btnRow" style="margin-top:10px"><button class="btn" onclick="enterNode(Math.min(PR().node,CM().length-1))">▶ Jetzt mit dieser Auswahl üben</button></div>` : ""}
      ${(LOCKED.length||LOCKED_IDS.length) ? `<div class="hint-sm" style="margin-top:6px">🔒 Schon im Katalog, aber noch nicht dran (${esc(LOCKED_LABEL)}): ${ls} Sätze und ${lv} Vokabeln – sie werden erst abgefragt, wenn sie im Unterricht behandelt wurden.</div>` : ""}
    </div>
    <div class="card">
      <b>🔊 Aussprache</b>
      ${TTS.ok ? `
      <div class="hint-sm" style="margin:4px 0 8px">Neben den französischen Wörtern und Sätzen gibt es 🔊-Knöpfe (🐢 = langsam). Zusätzlich kann das Gerät automatisch vorlesen:</div>
      <div class="seg">
        <button class="${S.tts.auto==="off"?"on":""}" onclick="setTts({auto:'off'})">Nur per Knopf</button>
        <button class="${S.tts.auto==="after"?"on":""}" onclick="setTts({auto:'after'})">Nach der Antwort</button>
        <button class="${S.tts.auto==="both"?"on":""}" onclick="setTts({auto:'both'})">Bei Frage und Antwort</button></div>
      <div class="seg" style="margin-top:6px">
        <button class="${!S.tts.slow?"on":""}" onclick="setTts({slow:false})">Automatisch: normal</button>
        <button class="${S.tts.slow?"on":""}" onclick="setTts({slow:true})">Automatisch: langsam</button>
        <button onclick="speakFr('Bonjour ! Je m\\'appelle Lukas. Et toi ?', false)">▶ Test</button></div>
      <div class="hint-sm" style="margin-top:8px">${TTS.voice ? "Stimme: "+esc(TTS.voice.name)+" ("+esc(TTS.voice.lang)+")" : "⚠ Auf diesem Gerät wurde keine französische Stimme gefunden. iPad: Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Französisch laden. Danach die Seite neu öffnen."}
      Kein Ton? Dann den Stumm-Schalter / die Lautstärke prüfen.</div>`
      : `<div class="hint-sm" style="margin-top:6px">Dieser Browser unterstützt keine Sprachausgabe.</div>`}
    </div>
    <div class="card">
      <b>Modus</b>
      <div class="seg" style="margin-top:8px">
        <button class="${S.mode==="normal"?"on":""}" onclick="setMode('normal')">Normal (⅔ Sätze, ⅓ Vokabeln)</button>
        <button class="${S.mode==="exam"?"on":""}" onclick="setMode('exam')">Klassenarbeit (nur Sätze)</button>
        <button class="${S.mode==="discover"?"on":""}" onclick="setMode('discover')">🔍 Neu entdecken</button></div>
      <div class="hint-sm" style="margin-top:8px">Im Klassenarbeits-Modus kommen nur ganze Sätze dran – immer vom Deutschen ins Französische, so wird auch in der Arbeit geprüft.</div>
      <div class="hint-sm" style="margin-top:6px"><b>Neu entdecken:</b> Es kommen nur Aufgaben dran, die in dieser Runde noch nicht beantwortet wurden – Vokabeln und Sätze gemischt, bis alles einmal dran war (+100 XP). Danach startet die nächste Runde mit den kniffligen Aufgaben zuerst. Falsch beantwortete Aufgaben kommen weiter häufiger wieder, bis sie zweimal in Folge richtig sind.</div>
      ${S.mode==="discover" ? `<div style="margin-top:10px"><b>Reihenfolge in Runde 1</b>
        <div class="seg" style="margin-top:6px"><button class="${S.discOrder==="book"?"on":""}" onclick="setOrder('book')">Nach Buchseite</button>
        <button class="${S.discOrder==="mix"?"on":""}" onclick="setOrder('mix')">Gemischt</button></div>
        <div class="hint-sm" style="margin-top:6px">${(()=>{ const d=discoverStats(); return `Runde ${d.round} in diesem Bereich: <b>${d.done}</b> von <b>${d.total}</b> Aufgaben entdeckt.`; })()}</div></div>` : ""}
    </div>
    <div class="card">
      <b>Spielstand sichern & übertragen</b>
      <div class="hint-sm" style="margin:4px 0 8px">Der Fortschritt wird automatisch auf diesem Gerät gespeichert (getrennt vom Englisch-Abenteuer).
      <b>📤 Teilen / Sichern</b> ist auf dem iPad der zuverlässigste Weg, <b>📋 Text anzeigen</b> klappt immer.</div>
      <div class="btnRow">
        <button class="btn ghost" onclick="exportOrShare()">📤 Teilen / Sichern</button>
        <button class="btn ghost" onclick="exportFile()">💾 Als Datei laden</button>
        <button class="btn ghost" onclick="importFile()">📥 Datei laden</button>
        <button class="btn ghost" onclick="showStateText()">📋 Text anzeigen</button></div>
      <div id="msg"></div>
    </div>
${mbCard()}    <div class="card">
      <b>Neu anfangen</b>
      <div class="hint-sm" style="margin:4px 0 8px">Löscht den kompletten Französisch-Spielstand auf diesem Gerät.</div>
      <div class="btnRow" id="resetRow"><button class="btn ghost" onclick="askReset()">🗑️ Spielstand zurücksetzen</button></div>
    </div>`;
  window.scrollTo(0,0);
}
function askReset(){
  const r = document.getElementById("resetRow"); if(!r) return;
  r.innerHTML = `<span class="hint-sm" style="align-self:center">Wirklich alles löschen?</span>
    <button class="btn" onclick="doReset()">Ja, löschen</button><button class="btn ghost" onclick="showSettings()">Abbrechen</button>`;
}
function doReset(){ S = defaultState(); resetBags(); saveState(); showStart(); }
function fileName(){ return "Paris-Abenteuer_Spielstand_" + new Date().toISOString().slice(0,10) + ".json"; }
async function exportOrShare(){
  try{
    const file = new File([JSON.stringify(S,null,1)], fileName(), {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:fileName()});
      msg('✅ Wähle im Teilen-Menü <b>„In Dateien sichern“</b>.', true); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){ msg("Abgebrochen – es wurde nichts gespeichert.", false); return; } }
  exportFile();
}
function exportFile(){
  try{
    const blob = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    msg('✅ Download gestartet: <b>'+fileName()+'</b> – zu finden unter <b>Dateien → Downloads</b>.', true);
  }catch(e){ msg('⚠ Der Download hat nicht geklappt. Nutze bitte <b>„📋 Text anzeigen“</b>.', false); }
}
function applyImport(data){
  if(typeof data!=="object" || data===null) throw 0;
  S = Object.assign(defaultState(), data); normalizeState(); resetBags(); saveState();
}
function importFile(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{ applyImport(JSON.parse(rd.result)); showSettings(); msg('✅ Spielstand geladen: <b>'+S.xp+' XP</b>, '+S.defeated.length+' Stempel, '+S.facts.length+' Fakten.', true); }
      catch(e){ msg('⚠ Diese Datei ist kein gültiger Spielstand.', false); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function showStateText(){
  msg('📋 Kopiere diesen Text und sichere ihn z. B. in einer Notiz. Zum Wiederherstellen hier einfügen und „Übernehmen“ tippen.'
    + '<textarea id="stateBox" class="stateBox"></textarea>'
    + '<div class="btnRow"><button class="btn ghost" onclick="copyStateText()">📋 Kopieren</button><button class="btn ghost" onclick="pasteStateText()">✔ Übernehmen</button></div>', true);
  const b = document.getElementById("stateBox"); if(b) b.value = JSON.stringify(S);
}
function copyStateText(){
  const b = document.getElementById("stateBox"); if(!b) return;
  b.select(); try{ b.setSelectionRange(0, 999999); }catch(e){}
  try{ navigator.clipboard.writeText(b.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
}
function pasteStateText(){
  const b = document.getElementById("stateBox"); if(!b) return;
  try{ applyImport(JSON.parse(b.value)); showSettings(); msg('✅ Spielstand übernommen: <b>'+S.xp+' XP</b>, '+S.defeated.length+' Stempel.', true); }
  catch(e){ msg('⚠ Der eingefügte Text ist kein gültiger Spielstand.', false); }
}

/* ---------- Start ---------- */
loadState();
showMap();
</script>
<script>
/* =========================================================
   GESAMTSICHERUNG – alle Lern-Apps auf einmal sichern / zurückspielen
   Identischer Block in allen vier Apps. Liest und schreibt nur die bekannten Speicherschlüssel
   (gleicher Ordner = gleicher Browser-Speicher). Ändert nichts an den einzelnen Spielständen,
   solange man nicht ausdrücklich "einspielen" wählt.
   ========================================================= */
const MB_FORMAT = "lernwelt-gesamtsicherung";
const MB_APPS = [
  ["englisch-abenteuer-v4","🇬🇧 Englisch-Abenteuer"],
  ["mittelerde-reise-v1","⚔️ Mittelerde-Reise"],
  ["paris-abenteuer-v1","🇫🇷 Paris-Abenteuer"],
  ["faecher-v1","🌍 Fächer (Lernstand)"],
  ["faecher-packs-v1","🌍 Fächer (eigene Themenpakete)"]
];
function mbStore(){ try{ return window.localStorage; }catch(e){ return null; } }
function mbMsg(html, ok){
  const b = document.getElementById("mbMsg"); if(!b) return;
  b.style.display = "block"; b.style.borderColor = ok ? "rgba(90,154,90,.7)" : "rgba(192,69,58,.7)"; b.innerHTML = html;
}
function mbFileName(){ return "Lernwelt_Gesamtsicherung_" + new Date().toISOString().slice(0,10) + ".json"; }
function mbInfo(key, raw){
  try{ const o = JSON.parse(raw); if(key==="faecher-packs-v1") return Array.isArray(o) ? o.length+" Paket(e)" : "";
       return (o && typeof o.xp==="number") ? o.xp+" XP" : ""; }catch(e){ return ""; }
}
function mbCollect(){
  const ls = mbStore(), data = {}, found = [], missing = [];
  MB_APPS.forEach(a=>{
    let v = null; try{ v = ls ? ls.getItem(a[0]) : null; }catch(e){}
    if(v){ data[a[0]] = v; found.push(a[1] + (mbInfo(a[0],v) ? " (" + mbInfo(a[0],v) + ")" : "")); }
    else if(a[0]!=="faecher-packs-v1") missing.push(a[1]);
  });
  return {obj:{format:MB_FORMAT, version:1, created:new Date().toISOString(), data}, found, missing};
}
function mbSummary(c){
  return "<b>Enthalten:</b> " + (c.found.length ? c.found.join(" · ") : "nichts")
    + (c.missing.length ? '<br><span style="opacity:.85">Noch kein Spielstand vorhanden: ' + c.missing.join(", ") + '</span>' : "");
}
async function mbShare(){
  const c = mbCollect();
  if(!c.found.length){ mbMsg("⚠ Es gibt noch keinen Spielstand zum Sichern.", false); return; }
  const txt = JSON.stringify(c.obj);
  try{
    const file = new File([txt], mbFileName(), {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:mbFileName()});
      mbMsg('✅ Wähle im Teilen-Menü <b>„In Dateien sichern“</b>.<br>' + mbSummary(c), true); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){ mbMsg("Abgebrochen – es wurde nichts gespeichert.", false); return; } }
  mbDownload();
}
function mbDownload(){
  const c = mbCollect();
  if(!c.found.length){ mbMsg("⚠ Es gibt noch keinen Spielstand zum Sichern.", false); return; }
  try{
    const blob = new Blob([JSON.stringify(c.obj)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = mbFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    mbMsg('✅ Download gestartet: <b>' + mbFileName() + '</b> – zu finden unter <b>Dateien → Downloads</b>.<br>' + mbSummary(c), true);
  }catch(e){ mbMsg('⚠ Der Download hat nicht geklappt. Nutze bitte <b>„📋 Als Text“</b>.', false); }
}
function mbShowText(){
  const c = mbCollect();
  mbMsg('📋 Kopiere diesen Text und sichere ihn z. B. in einer Notiz. Zum Wiederherstellen hier einfügen und „Übernehmen“ tippen.<br>' + mbSummary(c), true);
  const t = document.getElementById("mbText"); if(!t) return;
  t.innerHTML = '<textarea id="mbBox" style="width:100%;height:110px;margin-top:8px;font-size:11px;border-radius:8px;padding:8px;background:rgba(0,0,0,.4);color:inherit;border:1px solid rgba(200,200,200,.4)"></textarea>'
    + '<div class="btnRow" style="margin:8px 0 0"><button class="btn ghost" onclick="mbCopy()">📋 Kopieren</button><button class="btn ghost" onclick="mbApplyText()">✔ Übernehmen</button></div>';
  const bx = document.getElementById("mbBox"); if(bx) bx.value = c.found.length ? JSON.stringify(c.obj) : "";
}
function mbCopy(){
  const b = document.getElementById("mbBox"); if(!b) return;
  b.select(); try{ b.setSelectionRange(0, 999999); }catch(e){}
  try{ navigator.clipboard.writeText(b.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
}
function mbApplyText(){ const b = document.getElementById("mbBox"); if(b) mbRestore(b.value); }
function mbPickFile(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>mbRestore(String(rd.result)); rd.readAsText(f); };
  inp.click();
}
function mbRestore(text){
  let o; try{ o = JSON.parse(text); }catch(e){ o = null; }
  if(!o || o.format!==MB_FORMAT || typeof o.data!=="object" || !o.data){ mbMsg("⚠ Das ist keine Gesamtsicherung. (Einzelne Spielstände lädst du in der jeweiligen App.)", false); return; }
  const ok = [];
  MB_APPS.forEach(a=>{ const v = o.data[a[0]]; if(typeof v!=="string") return;
    try{ const p = JSON.parse(v); if(p && typeof p==="object") ok.push([a[0], a[1], v]); }catch(e){} });
  if(!ok.length){ mbMsg("⚠ In dieser Datei steckt kein gültiger Spielstand.", false); return; }
  const d = o.created ? new Date(o.created) : null, ds = d && !isNaN(d) ? d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : "unbekanntem Datum";
  const list = ok.map(x=>x[1] + (mbInfo(x[0],x[2]) ? " (" + mbInfo(x[0],x[2]) + ")" : "")).join("\n");
  if(!window.confirm("Gesamtsicherung vom " + ds + " einspielen?\n\n" + list + "\n\nDer aktuelle Stand dieser Apps wird ersetzt.")){ mbMsg("Abgebrochen – nichts wurde verändert.", false); return; }
  const ls = mbStore(); if(!ls){ mbMsg("⚠ Der Browser erlaubt kein Speichern.", false); return; }
  try{ ok.forEach(x=>ls.setItem(x[0], x[2])); }catch(e){ mbMsg("⚠ Speichern hat nicht geklappt.", false); return; }
  mbMsg("✅ Eingespielt: " + list.replace(/\n/g," · ") + "<br>Die Seite lädt gleich neu …", true);
  setTimeout(()=>location.reload(), 900);
}
function mbCard(){
  return '<div id="mbCard" style="margin:14px 0;padding:16px;border:1px solid rgba(200,200,200,.35);border-radius:16px;background:rgba(0,0,0,.22)">'
    + '<b style="font-size:17px">🗄️ Gesamtsicherung – alle Apps auf einmal</b>'
    + '<div class="hint-sm" style="margin:6px 0 10px">Sichert Englisch, Mittelerde, Paris und Fächer gemeinsam in <b>einer Datei</b> (gleicher Speicher auf diesem Gerät). '
    + 'Zum Wiederherstellen oder für ein neues Gerät: <b>einspielen</b> – dabei wird der Stand der Apps ersetzt.</div>'
    + '<div class="btnRow"><button class="btn ghost" onclick="mbShare()">📤 Alles sichern</button>'
    + '<button class="btn ghost" onclick="mbDownload()">💾 Als Datei laden</button>'
    + '<button class="btn ghost" onclick="mbPickFile()">📥 Gesamtsicherung einspielen</button>'
    + '<button class="btn ghost" onclick="mbShowText()">📋 Als Text</button></div>'
    + '<div id="mbMsg" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid;border-radius:12px;background:rgba(0,0,0,.25);font-size:13.5px;line-height:1.5"></div><div id="mbText"></div></div>';
}
</script>
</body>
