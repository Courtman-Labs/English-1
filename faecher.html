<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fächer – Lernwelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d9a83c;--gold2:#f3d27a;--ink:#f5ecd8;--ok:#5aa65a;--bad:#c9503f;--card:rgba(14,28,24,.88);
        --acc:#7cc576;--acc2:#b9e6a0;--bg1:#12382a;--bg2:#07140f}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-size:16px;
    background:radial-gradient(ellipse at top,var(--bg1) 0%,var(--bg2) 72%);background-attachment:fixed}
  main{position:relative;max-width:880px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom))}
  header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{font-size:34px;line-height:1}
  h1{font-family:'Cinzel',serif;color:var(--acc2);font-size:24px;margin:0;line-height:1.1}
  .sub{display:block;font-size:12.5px;opacity:.75}
  .hud{display:flex;flex-wrap:wrap;gap:6px}
  .badge{background:rgba(0,0,0,.35);border:1px solid rgba(124,197,118,.5);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:800;white-space:nowrap}
  .badge.warnb{border-color:#e89a3c;color:#ffd39a}
  .btn{font-family:'Cinzel',serif;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:12px 18px;cursor:pointer;min-height:44px;
    background:linear-gradient(#a6dd8e,#5fae58);color:#0d2412;box-shadow:0 4px 0 #2f6a2c;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2f6a2c}
  .btn.ghost{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid rgba(124,197,118,.5);box-shadow:none}
  .btn.gold{background:linear-gradient(#f6d27a,#d9a83c);color:#2a1d07;box-shadow:0 4px 0 #8a6420}
  .btn.small{padding:8px 12px;font-size:13px;min-height:38px}
  .btn:disabled{opacity:.45;cursor:default}
  .btnRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .btnRow.center{justify-content:center}
  .card{background:var(--card);border:1px solid rgba(124,197,118,.32);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .center{text-align:center}
  .sectionTitle{font-family:'Cinzel',serif;color:var(--acc2);font-size:20px;margin:18px 0 6px}
  .hint-sm{font-size:14px;opacity:.82;line-height:1.5}
  .muted{opacity:.62}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .tile{background:var(--card);border:1px solid rgba(124,197,118,.32);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
  .tile h3{margin:0;font-size:17px;font-family:'Cinzel',serif;color:var(--acc2)}
  .tile .ic{font-size:30px}
  a.tile{color:var(--ink);text-decoration:none}
  .bar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#7cc576,#c9e86f)}
  .bar.thin{height:6px}
  .stars{letter-spacing:2px;font-size:15px}
  .pill{display:inline-block;background:rgba(124,197,118,.2);border:1px solid rgba(124,197,118,.5);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800}
  .pill.warn{background:rgba(232,154,60,.2);border-color:#e89a3c;color:#ffd39a}
  /* Aufgabe */
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
  .qtype{font-size:12.5px;opacity:.75;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
  .qtext{font-size:18.5px;line-height:1.5;margin:6px 0 12px}
  .qtext b{color:var(--acc2)}
  .opts{display:grid;gap:9px}
  .opt{display:block;width:100%;text-align:left;font:inherit;font-size:16.5px;line-height:1.4;color:var(--ink);background:rgba(255,255,255,.07);
    border:2px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
  .opt.sel{border-color:var(--acc);background:rgba(124,197,118,.18)}
  .opt.ok{border-color:#5fc25f;background:rgba(80,180,80,.28)}
  .opt.bad{border-color:#e0604f;background:rgba(220,80,60,.28)}
  .opt:disabled{cursor:default;opacity:1}
  .tfRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input.txt,textarea.txt{width:100%;font:inherit;font-size:17px;color:var(--ink);background:rgba(0,0,0,.35);border:2px solid rgba(124,197,118,.5);border-radius:12px;padding:12px;outline:none}
  textarea.txt{min-height:130px;resize:vertical;line-height:1.5}
  input.txt:focus,textarea.txt:focus{border-color:var(--acc2)}
  .gap{display:inline-block;min-width:92px;border-bottom:3px solid var(--acc);padding:1px 8px;margin:0 3px;text-align:center;cursor:pointer;font-weight:800;color:var(--acc2);min-height:28px}
  .gap.ok{border-color:#5fc25f;color:#b6f0b6}.gap.bad{border-color:#e0604f;color:#ffb3a8}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:42px}
  .chip.used{opacity:.25;pointer-events:none}
  .ordList{list-style:none;margin:8px 0;padding:0;display:grid;gap:8px;counter-reset:o}
  .ordList li{counter-increment:o;background:rgba(124,197,118,.14);border:2px solid rgba(124,197,118,.5);border-radius:12px;padding:10px 12px 10px 44px;position:relative;cursor:pointer;min-height:46px}
  .ordList li::before{content:counter(o);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--acc);color:#0d2412;font-weight:900;display:flex;align-items:center;justify-content:center}
  .ordList li.ok{border-color:#5fc25f}.ordList li.bad{border-color:#e0604f;background:rgba(220,80,60,.2)}
  .ordList li.empty{border-style:dashed;opacity:.35;cursor:default}
  .mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mtc{display:grid;gap:8px;align-content:start}
  .mti{font:inherit;font-size:15.5px;text-align:left;color:var(--ink);background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;cursor:pointer;position:relative;min-height:48px;line-height:1.35}
  .mti.sel{border-color:var(--gold2);background:rgba(243,210,122,.2)}
  .mti .nb{position:absolute;right:8px;top:8px;min-width:24px;height:24px;border-radius:50%;color:#0d2412;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
  .mti.ok{border-color:#5fc25f}.mti.bad{border-color:#e0604f}
  .fb{border-radius:14px;padding:12px 14px;margin-top:14px;line-height:1.55;font-size:16px}
  .fb.ok{background:rgba(80,180,80,.2);border:1px solid #5fc25f}
  .fb.bad{background:rgba(220,80,60,.2);border:1px solid #e0604f}
  .fb.hyper{background:rgba(243,210,122,.18);border:1px solid var(--gold2)}
  .fb h4{margin:0 0 4px;font-size:17px}
  .conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .conf .btn{padding:10px 6px;font-size:13.5px;flex-direction:column;gap:2px;line-height:1.2}
  .conf .btn.c0{background:linear-gradient(#e9d9b0,#c9b07a);box-shadow:0 4px 0 #7c6a3a;color:#2a1d07}
  .conf .btn.c1{background:linear-gradient(#a9d9a0,#6fb667);box-shadow:0 4px 0 #3a7a35}
  .conf .btn.c2{background:linear-gradient(#7fd0c2,#3f9f93);box-shadow:0 4px 0 #1f6a60;color:#05231f}
  .fig{background:#f4efe0;border-radius:12px;padding:6px;margin:6px 0 12px;border:1px solid rgba(0,0,0,.2)}
  .fig svg{display:block;width:100%;height:auto;max-height:340px}
  .fig .cap{font-size:12px;color:#4a4430;text-align:center;padding:2px 0 0}
  .pts{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}
  .pts label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.07);cursor:pointer;line-height:1.4}
  .pts input{width:22px;height:22px;margin-top:2px;accent-color:#7cc576;flex:none}
  .muster{background:rgba(243,210,122,.12);border-left:4px solid var(--gold2);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0;line-height:1.55}
  .progTop{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:10px}
  .progTop>i{display:block;height:100%;background:linear-gradient(90deg,#7cc576,#e6d36f)}
  .fact{text-align:center;padding:22px 16px}
  .fact .big{font-size:48px}
  .fact p{font-size:18px;line-height:1.55;margin:10px 0}
  table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
  table.tb td,table.tb th{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
  .cardTxt ul{margin:6px 0 6px 18px;padding:0;line-height:1.55}
  .cardTxt li{margin:3px 0}
  .cardTxt h4{margin:14px 0 4px;color:var(--acc2);font-family:'Cinzel',serif;font-size:16px}
  .merk{background:rgba(124,197,118,.16);border:1px dashed var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:800}
  textarea.big{width:100%;min-height:150px;font:13px/1.4 monospace;color:var(--ink);background:rgba(0,0,0,.4);border:1px solid rgba(124,197,118,.5);border-radius:10px;padding:10px}
  label.row{display:flex;align-items:center;gap:10px;margin:8px 0}
  input[type=date],select{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:2px solid rgba(124,197,118,.5);background:rgba(0,0,0,.35);color:var(--ink)}
  .seg{display:inline-flex;border:2px solid rgba(124,197,118,.5);border-radius:12px;overflow:hidden}
  .seg button{font:inherit;font-weight:800;color:var(--ink);background:transparent;border:none;padding:9px 14px;cursor:pointer;min-height:42px}
  .seg button.on{background:rgba(124,197,118,.35)}
  .backRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
  .stat{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin:4px 0}
  .noteBox{font-size:13.5px;line-height:1.5;opacity:.85;border-left:3px solid var(--acc);padding-left:10px;margin:10px 0}
  @media(max-width:560px){.mt{grid-template-columns:1fr}.qtext{font-size:17.5px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ======================================================================
   Fächer – Lernwelt: Hub + gemeinsame Lern-Engine für Sachfächer
   Inhalte liegen als "Themenpakete" vor (siehe BUILTIN weiter unten)
   ====================================================================== */
const KEY="faecher-v1", PKEY="faecher-packs-v1";
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const H=s=>esc(s).replace(/&lt;(\/?)(b|i|br)&gt;/g,"<$1$2>");   // nur <b>, <i>, <br> erlaubt
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dayNum(d){d=d||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function dayStr(n){return new Date(n*864e5).toISOString().slice(0,10);}
function nz(s){return String(s).toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/[^a-z0-9]/g,"");}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[];for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}return p[n];}

/* ---------- Bilder (SVG) – schematisch nachgezeichnet, helles Papier-Panel ---------- */
const FIG=(function(){
  const wrap=(vb,inner,cap)=>`<div class="fig"><svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial,sans-serif">${inner}</svg>${cap?`<div class="cap">${cap}</div>`:""}</div>`;
  const T=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" font-size="${o.s||11}" fill="${o.c||'#2a2a22'}" text-anchor="${o.a||'start'}" font-weight="${o.w||600}"${o.h?' stroke="#f4efe0" stroke-width="3" paint-order="stroke"':''}>${s}</text>`;};
  const arrowDefs=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b5ca8"/></marker><marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d2691e"/></marker></defs>`;
  return {
  stock(m){ m=m||"full";
    const K=[[0,262],[5,230],[10,198],[40,110],[70,28]];
    const y=h=>{for(let i=0;i<K.length-1;i++){if(h<=K[i+1][0]){const a=K[i],b=K[i+1];return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0]);}}return K[K.length-1][1];};
    const x0=70,x1=340;
    const L=[["Urwaldriesen","Dachgeschoss",40,70,"#4f9a3e","A"],["Baumschicht","Obergeschoss",10,40,"#74b250","B"],["Strauchschicht","Mittelgeschoss",5,10,"#9bc96d","C"],["Krautschicht","Erdgeschoss",0,5,"#c0db8c","D"]];
    let s=`<rect x="0" y="0" width="360" height="300" fill="#f4efe0"/>`;
    L.forEach(l=>{const t=y(l[3]),b=y(l[2]);s+=`<rect x="${x0}" y="${t}" width="${x1-x0}" height="${b-t}" fill="${l[4]}"/>`;
      const cy=(t+b)/2;
      if(m==="letters"){s+=`<circle cx="${(x0+x1)/2}" cy="${cy}" r="13" fill="#fff" stroke="#333"/>`+T((x0+x1)/2,cy+5,l[5],{a:"middle",w:800,s:15});}
      else s+=T(x1-6,cy+4,`${l[0]} (${l[1]})`,{a:"end",c:(l[3]-l[2]>=30)?"#fff":"#1d3a12",w:800,s:(l[3]-l[2]>=30)?12.5:11});});
    s+=`<line x1="${x0}" y1="${y(70)}" x2="${x0}" y2="${y(0)}" stroke="#333" stroke-width="2"/>`;
    [0,5,10,40,70].forEach((h,i)=>{s+=`<line x1="${x0-5}" y1="${y(h)}" x2="${x1}" y2="${y(h)}" stroke="#333" stroke-width="1" stroke-dasharray="${h===0?'':'3 3'}"/>`;
      s+= m==="nums" ? T(x0-10,y(h)+4,"("+(i+1)+")",{a:"end",w:800,c:"#c4453a",s:13}) : T(x0-10,y(h)+4,h+" m",{a:"end",w:800,s:12});});
    s+=T(8,14,"Höhe (m)",{w:800,s:11});
    s+=T((x0+x1)/2,y(0)+16,"Boden",{a:"middle",w:800,s:11,c:"#5b3b1b"});
    s+=`<text x="${x0+10}" y="${y(60)}" font-size="20">🦜</text><text x="${x0+40}" y="${y(68)}" font-size="18">🐦</text><text x="${x0+44}" y="${y(46)}" font-size="20">🦥</text>`;
    s+=`<text x="${x0+12}" y="${y(24)}" font-size="20">🐒</text><text x="${x0+70}" y="${y(3.5)}" font-size="15">🐜</text><text x="${x0+12}" y="${y(3.5)}" font-size="15">🐗</text>`;
    return wrap("0 0 360 290",s,m==="full"?"Stockwerkbau des tropischen Regenwaldes (schematisch, Höhen nicht maßstabsgetreu, nach Schulbuch S. 95)":"Stockwerkbau (schematisch)");},
  klima(hl){
    const P=[255,250,260,255,190,100,60,40,55,125,150,215], M="JFMAMJJASOND", x0=48,w=24, base=200, k=0.62;
    let s=`<rect width="360" height="245" fill="#f4efe0"/>`;
    for(let v=0;v<=260;v+=40){const y=base-v*k;s+=`<line x1="${x0}" y1="${y}" x2="${x0+12*w}" y2="${y}" stroke="#d8d0b8"/>`+T(x0+12*w+4,y+4,v,{s:10});}
    P.forEach((v,i)=>{const h=v*k;s+=`<rect x="${x0+i*w+3}" y="${base-h}" width="${w-6}" height="${h}" fill="${hl===i?'#c4453a':'#7fb2d9'}"/>`+T(x0+i*w+w/2,base+13,M[i],{a:"middle",w:800,s:11});});
    const yT=base-54*k;
    s+=`<line x1="${x0}" y1="${yT}" x2="${x0+12*w}" y2="${yT}" stroke="#a3243c" stroke-width="2.5"/>`;
    s+=T(x0+4,yT-5,"Temperatur: ca. 27 °C (fast gleich)",{c:"#a3243c",w:800,s:10.5,h:1});
    [0,10,20,30].forEach(t=>{s+=T(x0-6,base-t*2*k+4,t,{a:"end",s:10,c:"#a3243c"});});
    s+=T(4,base-62*k-12,"°C",{s:10,c:"#a3243c",w:800})+T(x0+12*w+4,base-270*k,"mm",{s:10,w:800});
    s+=T(x0,16,"Manaus (Brasilien) · T = 26,9 °C · N = 1897 mm",{w:800,s:11.5});
    s+=T(x0,232,"Balken: Niederschlag (mm) · rote Linie: Temperatur (°C)",{s:10,c:"#555"});
    return wrap("0 0 360 245",s,"Klimadiagramm Manaus (nachgezeichnet, Werte ungefähr)");},
  tag(m){
    const T0=[[4,20],[6,20],[8,22],[10,25],[12,28],[14,30],[15,31],[16,30],[18,26],[20,23]];
    const X=h=>40+(h-4)*(300/16), Y=t=>200-(t-15)*(150/20);
    let s=`<rect width="360" height="250" fill="#f4efe0"/><rect x="40" y="30" width="300" height="170" fill="#e6efe0"/>`;
    for(let t=15;t<=35;t+=5)s+=`<line x1="40" y1="${Y(t)}" x2="340" y2="${Y(t)}" stroke="#cfd8c4"/>`+T(34,Y(t)+4,t+"°",{a:"end",s:10});
    for(let h=4;h<=20;h+=2)s+=T(X(h),214,h+"",{a:"middle",s:10});
    s+=T(190,230,"Uhrzeit",{a:"middle",s:10,w:800});
    s+=`<polyline fill="none" stroke="#c4453a" stroke-width="3" points="${T0.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;
    T0.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="#c4453a"/>`;});
    const lab=[[5,"Nebel, Dunst","1",44],[8,"Verdunstung","2",57],[11,"Wolkenbildung","3",44],[15.5,"Gewitter","4",57],[18.5,"Dampfschwaden","5",44]];
    lab.forEach(l=>{ if(m==="mask"){s+=`<circle cx="${X(l[0])}" cy="${l[3]-4}" r="11" fill="#fff" stroke="#333"/>`+T(X(l[0]),l[3],l[2],{a:"middle",w:800,s:13});}
      else s+=T(X(l[0]),l[3],l[1],{a:"middle",s:9.5,w:800,c:"#2b5ca8"});});
    s+=T(X(12),Y(28)-8,"28°",{a:"middle",s:10,c:"#a3243c",w:800})+T(X(15)+8,Y(31)-6,"31°",{s:10,c:"#a3243c",w:800});
    s+=T(40,20,"Tagesverlauf im tropischen Regenwald",{w:800,s:12});
    return wrap("0 0 360 245",s,"Temperatur im Tagesverlauf (4–20 Uhr), nach Schulbuch S. 93");},
  wetter(m){ const q=m==="mask";
    let s=arrowDefs+`<rect width="360" height="250" fill="#f4efe0"/><rect x="0" y="170" width="360" height="80" fill="#b9d6a0"/>`;
    for(let i=0;i<9;i++){const x=40+i*35;s+=`<rect x="${x-3}" y="150" width="6" height="40" fill="#6b4a2b"/><circle cx="${x}" cy="140" r="22" fill="#4f9a3e"/>`;}
    s+=`<ellipse cx="90" cy="58" rx="46" ry="20" fill="#cfd8e6"/><ellipse cx="120" cy="50" rx="34" ry="18" fill="#dfe6f0"/>`;

mc("arten",2,"Wie viele Tier- und Pflanzenarten vermuten Forscher im Regenwald?","bis zu 30 Millionen Tierarten und 100 000 Pflanzenarten",["etwa 3 000 Tierarten und 100 Pflanzenarten","bis zu 30 000 Tierarten und 100 Millionen Pflanzenarten","genau 1 Million Tierarten und 1 Million Pflanzenarten"],"Genau lässt sich die Zahl nur schätzen.");

tf("arten",2,"Das feuchtheiße Klima wirkt wie ein Treibhaus und ermöglicht den Pflanzen ein gleichmäßiges Wachstum das ganze Jahr.",true,"Warm, feucht und gleichbleibend – ideale Bedingungen für Pflanzen.");

cl("arten",2,"Flora und Fauna bilden eine ausgeklügelte ___ , die voneinander ___ ist, sich aber auch gegenseitig ___ und ergänzt.",["Überlebensgemeinschaft","abhängig","schützt"],["Feindschaft","unabhängig","stört"],"Text M3 auf S. 94.",{intro:"Setze die passenden Wörter ein."});
mc("arten",2,"Warum können im Regenwald Bäume derselben Art gleichzeitig Blätter abwerfen, blühen und Früchte tragen?","Es gibt keine Jahreszeiten, das Wachstum ist das ganze Jahr möglich.",["Es ist dort immer Winter.","Die Bäume werden von Menschen gegossen.","Tiere pflanzen die Früchte."],"Ohne Jahreszeiten hat jeder Baum seinen eigenen Rhythmus.");
mc("arten",2,"Warum haben Urwaldriesen keine Jahresringe?","Es gibt keine Jahreszeiten – ihr Alter lässt sich nur schätzen.",["Sie sind zu hoch.","Sie wachsen jedes Jahr neu aus dem Boden.","Sie haben keine Wurzeln."],"Jahresringe entstehen durch den Wechsel von Wachstum im Sommer und Pause im Winter.");
mc("arten",1,"Wie hoch können Urwaldriesen werden?","bis zu 70 m",["bis zu 7 m","bis zu 17 m","bis zu 700 m"],"Die günstigen Wachstumsbedingungen lassen manche Bäume bis 70 m hoch werden.");
tf("arten",2,"Im Regenwald sieht man viele Tiere sofort auf den ersten Blick.",false,"Viele Tiere sind scheu und versteckt.","Viele Tiere sind scheu und leben versteckt im Wurzelwerk, in den Bäumen und unter den Sträuchern.");
mc("arten",2,"Welche Pflanzen sind im Inneren des Regenwaldes besonders häufig (nach deinem Heft und dem Reisebericht)?","Farne, Moose und Lianen",["Kakteen und Gräser","Tannen und Fichten","Getreide und Mais"],"Der Reisebericht nennt Moose, Lianen und Farne.");
mc("arten",2,"Warum ist es im Inneren des Regenwaldes so dämmrig?","Das dichte Blätterdach lässt nur wenig Licht auf den Boden.",["Dort gibt es keine Sonne.","Die Bäume sind schwarz.","Es regnet dort den ganzen Tag ohne Pause."],"Nur etwa 2 % des Lichts kommen unten an.");
op("arten",3,"Beschreibe","Beschreibe das „Innere“ des Regenwaldes (Buch S. 94, Aufgabe 1).",[["Es ist dicht bewachsen: Die Bäume stehen dicht beieinander oder sind miteinander verschlungen.",["dicht","bewachsen","verschlung"]],["Überall ist Dunst und Feuchtigkeit, alles ist grün.",["feucht","dunst","gruen"]],["Es kommt nur wenig Licht auf den Boden.",["licht","dunkel","daemmer"]],["Es gibt viele Farne, Moose und Lianen; man stolpert über Wurzelwerk.",["farn","moos","wurzel","liane"]]],"Das Innere des Regenwaldes ist dicht bewachsen. Die Bäume stehen dicht aneinander oder sind miteinander verschlungen. Überall ist Dunst, alles ist feucht und grün, und es kommt nur wenig Licht auf den Boden. Außerdem gibt es viele Farne, Moose und Lianen.");
op("arten",3,"Erkläre","Erkläre die Besonderheiten des Lebensraumes Regenwald (Buch S. 94, Aufgabe 2).",[["Treibhausklima: sehr feucht und heiß, täglich Regen.",["feucht","heiß","regen","treibhaus"]],["Dadurch wachsen Pflanzen das ganze Jahr gleichmäßig; die Artenvielfalt ist sehr hoch.",["wachstum","artenvielfalt","viele arten"]],["Urwaldriesen werden bis 70 m hoch und haben keine Jahresringe.",["70","urwaldriese","jahresring"]],["Flora und Fauna bilden eine Überlebensgemeinschaft: abhängig voneinander, schützen und ergänzen sich.",["gemeinschaft","abhängig","abhaengig"]]],"Im Regenwald ist es sehr feucht und heiß, es regnet täglich. Das Klima wirkt wie ein Treibhaus, deshalb wachsen die Pflanzen das ganze Jahr gleichmäßig und es gibt eine sehr hohe Artenvielfalt. Manche Bäume werden als Urwaldriesen bis zu 70 m hoch und haben keine Jahresringe. Pflanzen und Tiere bilden eine Überlebensgemeinschaft, die voneinander abhängig ist, sich aber auch schützt und ergänzt.");
op("arten",3,"Begründe","Begründe, warum viele Tiere im Regenwald Spezialisten sind (Buch S. 94, Aufgabe 4).",[["Sie müssen sich vor Fressfeinden schützen (Tarnung, Verstecke).",["fressfeind","schütz","schuetz","versteck"]],["Viele leben hoch oben in den Bäumen und sind daran angepasst (z. B. Faultier, Kolibri, Tukan).",["baeume","bäume","oben","kron","faultier"]],["Jede Art besetzt ihren eigenen Platz: manche leben nur auf Bäumen, nur am Boden oder überall.",["boden","nur auf","nische","ueberall","überall"]]],"Viele Tiere müssen sich im Regenwald spezialisieren, weil sie sich vor Fressfeinden schützen müssen oder weil sie weit oben in den Bäumen leben. Es gibt Tiere, die nur auf Bäumen leben, Tiere, die nur auf dem Boden leben, und Tiere, die überall leben.");

mc("stock",2,"Welches Tier zeigt das Schulbuch in der Baumschicht (10–40 m)?","Kapuzineraffe",["Faultier","Tapir","Vogelspinne"],"Der Kapuzineraffe klettert im Obergeschoss.");
mt("stock",2,"Welches Tier lebt in welcher Schicht?",[["Tukan, Faultier, Kolibri","Urwaldriesen (40–70 m)"],["Kapuzineraffe","Baumschicht (10–40 m)"],["Flachlandtapir, Vogelspinne, Blattameise","Boden / Krautschicht (0–5 m)"]],"Nach der Abbildung M4 auf S. 95.");
mc("stock",2,"Wofür sind Brett- oder Stützwurzeln gut?","Sie geben großen Bäumen die nötige Standfestigkeit.",["Sie speichern Wasser für Tiere.","Sie fangen Sonnenlicht ein.","Sie lassen die Bäume schneller wachsen."],"Der Boden ist dünn, die Bäume sind riesig – sie brauchen breite Wurzeln, damit sie nicht umkippen.");
mc("stock",2,"Was sind Aufsitzerpflanzen?","Pflanzen, die auf anderen Pflanzen sitzen, ohne einen Stamm auszubilden",["Pflanzen, die im Boden wurzeln und sehr groß werden","Pflanzen, die im Wasser schwimmen","Bäume mit Brettwurzeln"],"Sie schaden dem Baum nicht direkt und kommen so höher ans Licht.");
mc("stock",2,"Warum sparen Aufsitzerpflanzen Energie?","Sie bilden keinen eigenen Stamm aus.",["Sie brauchen kein Wasser.","Sie wachsen im Dunkeln.","Sie fressen Insekten."],"Ein Stamm kostet viel Energie – Aufsitzerpflanzen nutzen den Ast des Baumes.");
mc("stock",2,"Was machen Lianen (Schlingpflanzen)?","Sie wachsen an Bäumen entlang dem Licht entgegen.",["Sie wachsen nur am Boden.","Sie schwimmen auf Flüssen.","Sie ernähren sich von Tieren."],"Lianen nutzen die Bäume als Kletterhilfe.");
tf("stock",2,"Lianen können dem Baum schaden: Durch Lichtmangel geht der Baum oft langsam ein, sodass nur die Liane überlebt.",true,"So steht es im Kasten in M4.");
tf("stock",2,"Die meisten Tier- und Pflanzenarten des Regenwaldes leben auf dem Boden.",false,"Es ist umgekehrt.","Die meisten Arten leben nicht auf dem Boden, sondern in den oberen „Stockwerken“.");
mc("stock",2,"Warum spricht man beim Aufbau des Regenwaldes von einem Stockwerkbau? (Buch S. 94, Aufgabe 3b)","Die Pflanzen wachsen in Schichten übereinander wie die Etagen eines Hauses.",["Menschen bauen dort Häuser auf Bäume.","Der Regenwald wächst auf einem Berg.","Jedes Stockwerk entspricht einem Jahr."],"Jede Schicht hat eigene Pflanzen, Tiere und Lichtverhältnisse.");
cl("stock",2,"Das unterste Stockwerk ist die ___ , darüber liegen die ___ , dann die ___ und ganz oben die ___ .",["Krautschicht","Strauchschicht","Baumschicht","Urwaldriesen"],["Moosschicht"],"Von unten nach oben: 0–5 m, 5–10 m, 10–40 m, 40–70 m.",{intro:"Setze die Schichten von unten nach oben ein."});
op("stock",3,"Gib wieder","Gib den Stockwerkbau des tropischen Regenwaldes wieder (Buch S. 94, Aufgabe 3a).",[["Krautschicht: 0–5 m (Erdgeschoss).",["kraut"]],["Strauchschicht: 5–10 m (Mittelgeschoss).",["strauch"]],["Baumschicht: 10–40 m (Obergeschoss).",["baumschicht","baum"]],["Urwaldriesen (Kronenschicht): 40–70 m (Dachgeschoss).",["urwaldriesen","krone","70"]]],"Der Regenwald ist in Stockwerken aufgebaut. Direkt über dem Boden liegt die Krautschicht (0–5 m), darüber die Strauchschicht (5–10 m), dann die Baumschicht (10–40 m) und ganz oben die Urwaldriesen (40–70 m), auch Kronenschicht genannt.");
op("stock",3,"Begründe","Begründe die Angepasstheit der Spezialisten im Stockwerkbau, z. B. von Lianen, Aufsitzerpflanzen und Brettwurzeln (Buch S. 94, Aufgabe 4).",[["Lianen wachsen an Bäumen zum Licht – so kommen sie trotz Dunkelheit am Boden nach oben.",["liane","licht"]],["Aufsitzerpflanzen sparen Energie (kein Stamm) und sitzen höher im Licht.",["aufsitzer","stamm","energie"]],["Brett- oder Stützwurzeln geben hohen Bäumen auf dem dünnen Boden Standfestigkeit.",["brett","stütz","stuetz","standfest"]]],"Weil am Boden fast kein Licht ankommt, sind die Pflanzen angepasst: Lianen wachsen an Bäumen dem Licht entgegen, Aufsitzerpflanzen sitzen ohne eigenen Stamm auf anderen Pflanzen und sparen so Energie, und Brettwurzeln geben den riesigen Bäumen auf dem dünnen Boden Halt.");

/* ============ BEDEUTUNG (12) ============ */
mc("bed",1,"Warum wird der Amazonasregenwald oft „Grüne Lunge“ der Erde genannt?","Seine Pflanzen wandeln Kohlenstoffdioxid in Sauerstoff um.",["Er hat die Form einer Lunge.","Dort atmen besonders viele Menschen.","Er wandelt Sauerstoff in Kohlenstoffdioxid um."],"Pflanzen nehmen Kohlenstoffdioxid auf und geben Sauerstoff ab – das ist die Grundlage des Lebens (Buch S. 92, M4).");
cl("bed",1,"Die Pflanzen im Regenwald wandeln ___ in ___ um.",["Kohlenstoffdioxid","Sauerstoff"],["Stickstoff","Wasserstoff"],"Kohlenstoffdioxid → Sauerstoff. Deshalb „Grüne Lunge“.",{intro:"Setze die passenden Wörter ein."});
mc("bed",2,"Welches Nahrungsmittel stammt laut Schulbuch ursprünglich aus dem Regenwald?","Ananas",["Roggen","Hafer","Spargel"],"Das Buch nennt Mais, Reis, Kartoffeln, Vanille und Ananas.");
tf("bed",2,"Mais, Reis, Kartoffeln, Vanille und Ananas stammen laut Schulbuch ursprünglich aus dem Gebiet der Regenwälder.",true,"So steht es in M4 auf S. 92.");
tf("bed",2,"Im Regenwald gibt es genauso viele Pflanzen- und Tierarten wie in allen anderen Lebensräumen der Erde zusammen.",true,"Darum nennt man ihn „Hotspot der Artenvielfalt“.");
mc("bed",1,"Was bedeutet es, dass der Regenwald ein „Hotspot der Artenvielfalt“ ist?","Er ist ein Ort mit besonders vielen verschiedenen Arten.",["Er ist besonders heiß.","Er ist besonders groß.","Er ist besonders gefährlich."],"Hotspot = Brennpunkt.");
mc("bed",2,"Was passiert, wenn große Waldflächen gerodet werden (Wettermaschine)?","Der Boden trocknet viel schneller aus.",["Es regnet mehr.","Es wird kälter.","Es entsteht mehr Nebel."],"Ohne Pflanzen fehlt die Verdunstung – der Wasserkreislauf bricht ab.");
tf("bed",2,"Viele menschliche Erfindungen haben ihren Ursprung im Regenwald.",true,"Das steht in M4: „Viele menschliche Erfindungen haben hier ihren Ursprung.“");
ty("bed",2,"Die vielen Pflanzen im Regenwald benötigen Wasser, sind aber auch wichtige … (ein Wort)",["Wasserspeicher"],"Pflanzen speichern Wasser und geben es als Wasserdampf wieder ab.");
mc("bed",3,"Welche Aussage erklärt die Bedeutung des Regenwaldes am besten?","Er liefert Sauerstoff, beherbergt die Hälfte aller Arten und liefert Nahrungsmittel und Rohstoffe.",["Er ist nur wichtig, weil dort Holz wächst.","Er hat für Menschen außerhalb der Tropen keine Bedeutung.","Er ist wichtig, weil er das Klima in Deutschland kalt hält."],"Bedeutung hat der Regenwald für die ganze Welt, nicht nur für die Tropen.");
op("bed",3,"Erkläre","Erkläre die Bedeutung des tropischen Regenwaldes (Buch S. 92, Aufgabe 3).",[["„Grüne Lunge“: Pflanzen wandeln Kohlenstoffdioxid in Sauerstoff um.",["lunge","sauerstoff"]],["Hotspot der Artenvielfalt: so viele Arten wie alle anderen Lebensräume zusammen.",["hotspot","artenvielfalt","arten"]],["Ursprung vieler Nahrungsmittel und Gewürze (z. B. Mais, Vanille, Ananas) und menschlicher Erfindungen.",["mais","vanille","ananas","lebensmittel","gewuerz","gewürz","erfindung"]],["Wasserspeicher und „Wettermaschine“.",["wasser","wetter"]]],"Der Regenwald wird „Grüne Lunge“ genannt, weil seine Pflanzen Kohlenstoffdioxid in Sauerstoff umwandeln. Er ist ein Hotspot der Artenvielfalt mit so vielen Arten wie alle anderen Lebensräume zusammen. Viele Nahrungsmittel und Gewürze wie Mais, Vanille oder Ananas stammen ursprünglich von dort, und viele Erfindungen haben dort ihren Ursprung. Außerdem speichert er Wasser und wirkt wie eine Wettermaschine.");
op("bed",3,"Beschreibe","Beschreibe die Wirkung des Regenwaldes auf dich persönlich (Buch S. 92, Aufgabe 2). Hier gibt es keine falsche Antwort – schreibe 3–4 Sätze und nutze Fachwörter.",[["Ich nenne Eindrücke (z. B. dicht, grün, feucht, heiß, dunkel, laut).",["dicht","gruen","feucht","heiss","heiß","warm","dunkel"]],["Ich schreibe, wie ich mich dort fühlen würde, und begründe es.",["weil","fuehl","fühl","wuerde","würde"]],["Ich verwende Fachwörter (z. B. Artenvielfalt, Stockwerkbau, Tropen).",["artenvielfalt","stockwerk","tropen"]]],"Beispiel: Auf mich wirkt der Regenwald dicht, feucht und geheimnisvoll. Ich würde mich dort klein fühlen, weil die Bäume so hoch sind, und ich wäre gespannt, welche Tiere ich entdecke. Gleichzeitig wäre es mir zu heiß und feucht. Faszinierend finde ich die große Artenvielfalt.");

mc("boden",2,"Wo werden die Nährstoffe in Mitteleuropa vor allem gespeichert?","im Boden",["in den Pflanzen","in der Luft","in den Wolken"],"Bei uns ist der Boden der Nährstoffspeicher. Im Regenwald sind es die Pflanzen selbst.");

mc("boden",2,"Wer zersetzt die abgestorbenen Blätter am Boden schnell?","Bakterien und Pilze",["Vögel","Regen und Wind","das Sonnenlicht"],"Bakterien und Pilze wandeln totes Material in Nährstoffe um.");
mc("boden",2,"Warum werden die Blätter im Regenwald so schnell zersetzt?","wegen der hohen Temperaturen und der hohen Luftfeuchtigkeit",["weil es dort so kalt ist","weil kaum Pflanzen dort leben","weil das Licht fehlt"],"Warm und feucht = ideal für Bakterien und Pilze.");
mc("boden",2,"Wie kommen die Nährstoffe wieder zu den Pflanzen?","Die Wurzeln nehmen sie über Pilze gleich wieder auf.",["Tiere tragen sie hoch.","Der Wind bläst sie in die Blätter.","Sie müssen gedüngt werden."],"Nach dem täglichen Regen werden die Nährstoffteilchen von den Wurzeln über Pilze aufgenommen.");
od("boden",2,"Bringe den kurzgeschlossenen Nährstoffkreislauf in die richtige Reihenfolge (Start bei den lebenden Pflanzen).",["Pflanzen nehmen Nährstoffe auf und wachsen","Blätter und Pflanzenteile sterben ab und fallen auf den Boden","Bakterien und Pilze zersetzen das tote Material schnell","Nährstoffe werden frei","Die Wurzeln nehmen die Nährstoffe über Pilze gleich wieder auf"],"Der Kreislauf ist so kurz, dass kaum Nährstoffe im Boden bleiben.");
tf("boden",1,"Der Boden im Regenwald ist sehr fruchtbar – deshalb wachsen dort so viele Pflanzen.",false,"Das ist ein verbreiteter Denkfehler.","Der Boden ist nährstoffarm; die Pflanzen wachsen wegen des kurzgeschlossenen Nährstoffkreislaufs so üppig.");
tf("boden",2,"Im Regenwald werden Nährstoffe lange im Boden gespeichert.",false,"Es geht schnell: zersetzen, aufnehmen.","Sie werden schnell zersetzt und sofort wieder von den Wurzeln aufgenommen.");
mc("boden",2,"Was gehört zu Nummer 3 (ganz unten)?","Ausgangsgestein (Festgestein)",["Humusschicht","nährstoffarmer Boden","Wurzelwerk"],"Ganz unten liegt das feste Gestein, darüber nährstoffarmer Boden und oben der Humus.",{fig:["kreis","mask"]});
mc("boden",2,"Welche Schicht ist mit 1 gekennzeichnet (dünne dunkle Schicht ganz oben)?","Humus",["Ausgangsgestein","nährstoffarmer Boden","Grundwasser"],"Die Humusschicht ist nur wenige Zentimeter dick.",{fig:["kreis","mask"]});
mt("boden",2,"Ordne den Bodenschichten ihre Eigenschaft zu.",[["Humusschicht","dünn, nährstoffreich, aus zersetzten Pflanzenresten"],["nährstoffarmer Boden","darunterliegende, kaum fruchtbare Schicht"],["Ausgangsgestein","festes Gestein ganz unten"]],"Von oben nach unten: Humus – nährstoffarmer Boden – Ausgangsgestein.");
mc("boden",3,"Was passiert, wenn der Regenwald abgeholzt wird? (Abbildung S. 96)","Der Regen wäscht die Nährstoffe aus dem Boden aus.",["Die Nährstoffe vermehren sich.","Der Boden wird fruchtbarer.","Die Humusschicht wird dicker."],"Ohne Pflanzen bleiben die Nährstoffe nicht im Kreislauf – sie werden ausgewaschen.");
tf("boden",2,"Nach einer Rodung werden Nährstoffe vom Regen aus dem Boden ausgewaschen.",true,"Das nennt man Auswaschung.");
ty("boden",2,"Wie nennt man es, wenn Regen die Nährstoffe aus dem Boden spült?",["Auswaschung","Auswaschen"],"Auswaschung der Nährstoffteilchen – in M1 durch blaue Pfeile dargestellt.");
cl("boden",2,"Die Böden im Regenwald sind ___ , trotzdem wachsen dort viele Pflanzen, weil die Nährstoffe in einem ___ Kreislauf bleiben.",["nährstoffarm","kurzgeschlossenen"],["nährstoffreich","langen"],"Das ist die Kernaussage des Textes auf S. 98.",{intro:"Setze die passenden Wörter ein."});
op("boden",3,"Erkläre","Erkläre das Wachstum üppiger Vegetation trotz Nährstoffarmut der Böden (Buch S. 98, Aufgabe 1b).",[["Die Humusschicht ist nur wenige Zentimeter dick, der Boden selbst ist nährstoffarm.",["humus","wenige","naehrstoffarm","nährstoffarm"]],["Abgestorbene Blätter werden durch Hitze und Feuchtigkeit schnell von Bakterien und Pilzen zersetzt.",["bakterien","pilz","zersetz"]],["Die Wurzeln nehmen die frei gewordenen Nährstoffe über Pilze gleich wieder auf.",["wurzel","aufgenommen","aufnehm"]],["Die Nährstoffe sind in den Pflanzen gespeichert – ein kurzgeschlossener Kreislauf.",["kurzgeschlossen","kreislauf","gespeichert"]]],"Der Boden im Regenwald ist nährstoffarm, die Humusschicht ist nur wenige Zentimeter dick. Abgestorbene Blätter werden bei der Hitze und hohen Luftfeuchtigkeit schnell von Bakterien und Pilzen zersetzt. Nach dem täglichen Regen nehmen die Wurzeln die frei gewordenen Nährstoffe über Pilze sofort wieder auf. Die Nährstoffe sind also in den Pflanzen gespeichert und bleiben in einem kurzgeschlossenen Kreislauf. Deshalb wächst der Wald trotz armem Boden so üppig.");
op("boden",3,"Beschreibe","Beschreibe den Nährstoffkreislauf im tropischen Regenwald (Buch S. 98, Aufgabe 1a).",[["Pflanzen nehmen Nährstoffe auf und speichern sie.",["aufnehm","aufgenommen","speicher"]],["Abgestorbene Pflanzenteile fallen auf den Boden.",["abgestorben","fallen","boden"]],["Bakterien und Pilze zersetzen sie schnell.",["bakterien","pilz","zersetz"]],["Die Wurzeln nehmen die Nährstoffe sofort wieder auf – der Kreislauf ist kurzgeschlossen.",["wurzel","wieder","kurz"]]],"Die Pflanzen nehmen Nährstoffe auf und speichern sie. Wenn Blätter und Pflanzenteile absterben, fallen sie auf den Boden und werden von Bakterien und Pilzen schnell zersetzt. Die frei gewordenen Nährstoffe nehmen die Wurzeln über Pilze gleich wieder auf. Deshalb ist der Nährstoffkreislauf kurzgeschlossen.");

/* ============ NUTZUNG: Wanderfeldbau & Agroforst (30) ============ */
ty("nutz",1,"Wie nennt man die Anbauweise, bei der Bauern nach einigen Jahren zu neuen Feldern weiterziehen?",["Wanderfeldbau"],"Wanderfeldbau = shifting cultivation.");
mc("nutz",2,"Wie heißt Wanderfeldbau auf Englisch (Klammer im Buch)?","shifting cultivation",["slash driving","moving farming","field walking"],"„Shifting cultivation“ – wörtlich: verschiebender Anbau.");
od("nutz",1,"Bringe den Ablauf des Wanderfeldbaus in die richtige Reihenfolge.",["Unterholz und Büsche werden mit der Machete abgeschlagen","Das Gebiet wird angezündet (Brandrodung)","Die Asche düngt den Boden; die Felder werden mit der Hacke bearbeitet und bepflanzt","Zwei bis drei Jahre liefern die Felder Nahrung","Die Nährstoffe sind verbraucht – das Feld liegt mindestens sieben Jahre brach"],"Diese Reihenfolge solltest du auswendig aufsagen können – sie wird gern gefragt.");
mc("nutz",1,"Wie nennt man das Abbrennen des Waldes zur Gewinnung von Ackerland?","Brandrodung",["Holzernte","Wiederaufforstung","Aussaat"],"Brand = Feuer, Rodung = Wald beseitigen.");
mc("nutz",1,"Wozu dient die Asche nach der Brandrodung?","Sie düngt die Felder und zerstört Schädlinge.",["Sie schützt vor Regen.","Sie macht den Boden hart.","Sie lockt Tiere an."],"Die Asche enthält Nährstoffe und tötet Schädlinge ab.");
mc("nutz",2,"Warum bleiben beim Wanderfeldbau einige große Bäume stehen?","Sie spenden den Feldern Schatten.",["Sie liefern Dünger.","Sie dienen als Hütte.","Sie schützen vor Wanderern."],"So steht es im Bericht des Bauern (M3).");
mt("nutz",2,"Ordne die Zahlen zu: Welche Zeitspanne gehört wozu?",[["Anbau auf einer Fläche","ca. 2–3 Jahre"],["Erholung (Brache)","mindestens 7 Jahre"],["Haus bleibt am Platz","ca. 15 Jahre"]],"Nach M2 und M3 (S. 96/97).");
ty("nutz",1,"Wie viele Jahre kann eine Fläche beim Wanderfeldbau höchstens bepflanzt werden, bevor die Nährstoffe verbraucht sind? (Zahl)",["3"],"Zwei bis drei Jahre, dann ist Schluss.",{num:true});
ty("nutz",1,"Wie viele Jahre muss sich ein Feld nach dem Anbau mindestens erholen? (Zahl)",["7"],"Mindestens sieben Jahre, damit neue Bäume wachsen und Nährstoffe gespeichert werden.",{num:true});
ty("nutz",1,"Wie nennt man eine Fläche, die zur Erholung unbepflanzt liegen bleibt?",["Brache","Brachfläche","Brachflächen"],"Auf der Brache wächst Sekundärwald.");
mc("nutz",2,"Was wächst auf der Brache nach, während sich der Boden erholt?","Sekundärwald",["Primärwald","Ölpalmen","Wüste"],"Primärwald = ursprünglicher Wald. Sekundärwald = nachgewachsener Wald.");
mt("nutz",2,"Ordne die Fachbegriffe zu.",[["Primärwald","ursprünglicher, nie gerodeter Regenwald"],["Sekundärwald","nachgewachsener Wald auf einer Brache"],["Brache","Fläche, die zur Erholung liegen gelassen wird"],["Subsistenzbauer","Landwirt, der für die Selbstversorgung anbaut"]],"Diese Begriffe stehen auch auf deinem Arbeitsblatt.");
mc("nutz",1,"Was ist ein Subsistenzbauer?","ein Landwirt, der auf Selbstversorgung ausgerichtet ist",["ein Landwirt, der nur für den Weltmarkt produziert","ein Großgrundbesitzer mit Plantagen","ein Forscher im Regenwald"],"Subsistenz = Selbstversorgung: Er baut an, was er und seine Familie essen.");
mc("nutz",1,"Was sind Food Crops?","Grundnahrungsmittel, die überwiegend für die Ernährung der einheimischen Bevölkerung angebaut werden",["Pflanzen, die nur für den Export angebaut werden","Futtermittel für Rinder","Pflanzen, die nur als Brennholz dienen"],"Food Crops = Nahrungspflanzen für die Menschen vor Ort (Gegenteil: Cash Crops).");
mc("nutz",2,"Welche Pflanzen baut der Bauer im Bericht an?","Maniok, Batate (Süßkartoffel) und Yams",["Weizen, Roggen und Gerste","Kaffee, Tee und Kakao","Ölpalmen und Soja"],"Das sind typische Food Crops.");
tf("nutz",2,"Beim Wanderfeldbau kann man dasselbe Feld immer wieder ohne Pause bewirtschaften.",false,"Der Boden ist nach 2–3 Jahren erschöpft.","Nach 2–3 Jahren sind die Nährstoffe verbraucht, die Fläche muss mindestens 7 Jahre brachliegen.");
tf("nutz",2,"Wenn die Brache zu früh wieder genutzt wird, droht Bodenerosion.",true,"Der Boden hat sich noch nicht erholt und wird abgetragen.");
ty("nutz",2,"Wie nennt man die Abtragung von Boden durch Wasser (oder Wind)?",["Bodenerosion","Erosion"],"Erosion = Abtragung. Ohne Pflanzenwurzeln wird die dünne Humusschicht weggespült.");
mc("nutz",2,"Welcher Nachteil gilt für den Wanderfeldbau?","hoher Flächenverbrauch",["hoher Maschineneinsatz","teure Dünger","langfristige Planung nötig"],"Man braucht viel Platz, weil die Felder jahrelang brachliegen.");
mc("nutz",2,"Welchen Vorteil hat der Wanderfeldbau?","kurzfristig hohe Erträge; der Boden erholt sich während der Brache",["langanhaltende Nährstoffversorgung durch Bäume","niedrige Kosten durch Maschinen","Schutz der Humusschicht durch Dauerbewuchs"],"Vorteile (Arbeitsblatt): kurzfristig hohe Erträge; Erholung des Bodens während der Brache.");
mc("nutz",1,"Was versteht man unter Agroforstwirtschaft?","Nutzpflanzen werden zwischen Bäumen angepflanzt.",["Roden und Abbrennen großer Flächen","Anbau nur einer Pflanzenart auf riesigen Flächen","Weidewirtschaft auf gerodeten Flächen"],"Agro = Landwirtschaft, Forst = Wald.");
mc("nutz",2,"Wie ahmt die Agroforstwirtschaft den Regenwald nach?","mit einem mehrstöckigen Anbausystem (Bäume, Sträucher, niedrige Pflanzen)",["mit einer einzigen Pflanzenart in Reihen","mit Anbau auf nacktem Boden","mit künstlicher Bewässerung ohne Pflanzen"],"Wie beim Stockwerkbau gibt es mehrere Etagen von Pflanzen.");
mt("nutz",2,"Ordne Vorteile und Nachteile der beiden Anbauformen zu.",[["Wanderfeldbau – Vorteil","kurzfristig hohe Erträge, Boden erholt sich in der Brache"],["Wanderfeldbau – Nachteil","Erosionsgefahr bei zu früher Nutzung, hoher Flächenverbrauch"],["Agroforst – Vorteil","langanhaltende Nährstoffversorgung, Schutz vor Erosion, langfristig hohe Erträge"],["Agroforst – Nachteil","hoher Aufwand und Pflege, langfristige Planung"]],"Genau diese Tabelle steht auf deinem Arbeitsblatt.");
mc("nutz",2,"Was zeigt die Grafik zu den Erträgen im Vergleich der Jahre?","Bei Brandrodung sinken die Erträge schnell, bei Agroforstwirtschaft bleiben sie langfristig hoch.",["Bei Brandrodung steigen die Erträge jedes Jahr.","Beide Anbauarten bringen immer gleich viel.","Bei Agroforstwirtschaft sinken die Erträge schneller als bei Brandrodung."],"Der Boden ist nach Brandrodung bald erschöpft; Agroforst erhält die Nährstoffe im Kreislauf.",{fig:["ertrag",null]});
mc("nutz",2,"Wie schützt die Agroforstwirtschaft den Boden?","Bäume und Pflanzenreste schützen vor Erosion und liefern Humus.",["Sie bedeckt den Boden mit Beton.","Sie bewässert den Boden dauernd.","Sie brennt den Boden regelmäßig ab."],"Die Kronen vermindern die Kraft der Regengüsse, Pflanzenreste und Stalldung liefern Humus (M5).");
mc("nutz",2,"Welche Tiere gehören in M5 zur Viehhaltung in der Agroforstwirtschaft?","Schweine, Rinder und Hühner",["Kamele, Esel und Ziegen","Tapire, Faultiere und Affen","Haie, Delfine und Lachse"],"Das Vieh liefert Dünger und Nahrung.");
cl("nutz",2,"Bei der Agroforstwirtschaft werden Nutzpflanzen zwischen ___ angebaut. Das schützt vor ___ und erhält die ___ .",["Bäumen","Bodenerosion","Humusschicht"],["Gebäuden","Dünger","Sandschicht"],"Vorteile der Agroforstwirtschaft.",{intro:"Setze die passenden Wörter ein."});
op("nutz",3,"Erläutere","Erläutere den Ablauf des Wanderfeldbaus. Gehe auf Vorbereitung, Bepflanzung und sonstige Nutzung der Felder ein (Buch S. 98, Aufgabe 2).",[["Vorbereitung: Unterholz abschlagen, Fläche anzünden (Brandrodung), Asche düngt, einige große Bäume bleiben als Schattenspender.",["rodung","brand","asche","machete"]],["Bepflanzung: Bearbeitung mit der Hacke, Anbau von Maniok, Batate und Yams.",["hacke","maniok","batate","yams"]],["Nach 2–3 Jahren sind die Nährstoffe verbraucht.",["jahre","verbraucht"]],["Die Felder ruhen mindestens 7 Jahre (Brache, Sekundärwald); die Bauern ziehen zu neuen Flächen um.",["7","sieben","brache","umzieh","zieht um"]]],"Zuerst schlagen die Bauern mit der Machete Unterholz und Büsche ab und zünden das Gebiet an (Brandrodung). Die Asche dient als Dünger und zerstört Schädlinge, einige große Bäume bleiben als Schattenspender stehen. Dann werden die Felder mit der Hacke bearbeitet und mit Maniok, Batate und Yams bepflanzt. Zwei bis drei Jahre liefern die Felder Nahrung, dann sind die Nährstoffe verbraucht. Die Felder müssen sich mindestens sieben Jahre erholen (Brache, Sekundärwald), während die Bauern neue Flächen roden und das Haus nach einigen Jahren umziehen.");
op("nutz",3,"Vergleiche","Vergleiche Wanderfeldbau mit Agroforstwirtschaft (Buch S. 99, Aufgabe 4).",[["Wanderfeldbau: roden und abbrennen, einige Jahre Anbau, dann Brache. Agroforst: Nutzpflanzen zwischen Bäumen (mehrstöckig).",["roden","brand","zwischen","baeumen","bäumen","mehrstoeck","mehrstöck"]],["Wanderfeldbau: kurzfristig hohe Erträge, danach Boden erschöpft. Agroforst: langfristig hohe Erträge.",["kurzfristig","langfristig"]],["Wanderfeldbau: Erosionsgefahr und hoher Flächenverbrauch. Agroforst: Schutz vor Erosion, Erhalt der Humusschicht.",["erosion","humus","flaeche","fläche"]],["Agroforst braucht mehr Aufwand, Pflege und langfristige Planung.",["aufwand","pflege","planung"]]],"Beim Wanderfeldbau werden Waldstücke gerodet und abgebrannt, einige Jahre bepflanzt und dann als Brache liegen gelassen. Bei der Agroforstwirtschaft werden Nutzpflanzen in einem mehrstöckigen System zwischen Bäumen angebaut. Der Wanderfeldbau bringt kurzfristig hohe Erträge, aber der Boden ist bald erschöpft, es droht Erosion und der Flächenverbrauch ist hoch. Die Agroforstwirtschaft versorgt die Pflanzen langanhaltend mit Nährstoffen, schützt vor Erosion und erhält die Humusschicht, braucht aber mehr Aufwand, Pflege und langfristige Planung.");
op("nutz",3,"Bewerte","Bewerte die Nachhaltigkeit von Wanderfeldbau und Agroforstwirtschaft (Buch S. 99, Aufgabe 5).",[["Wanderfeldbau ist nur nachhaltig, wenn die Brache lang genug ist; bei wachsender Bevölkerung reicht das nicht (Flächenverbrauch, Erosion).",["brache","bevoelkerung","bevölkerung","flaeche","fläche","erosion"]],["Agroforstwirtschaft ist nachhaltiger: Nährstoffe bleiben im Kreislauf, Humus und Boden sind geschützt, langfristig hohe Erträge.",["nährstoff","naehrstoff","humus","langfristig"]],["Aber: hoher Aufwand, Pflege und langfristige Planung sind nötig.",["aufwand","pflege","planung"]],["Ich ziehe ein eigenes, begründetes Fazit.",["fazit","insgesamt","deshalb","daher","meiner meinung","ich finde"]]],"Der Wanderfeldbau ist nur nachhaltig, solange die Brache lang genug ist. Weil die Bevölkerung wächst, reicht die Fläche aber nicht mehr, es droht Erosion. Die Agroforstwirtschaft ist nachhaltiger, weil sie den Regenwald nachahmt: Die Nährstoffe bleiben im Kreislauf, die Humusschicht und der Boden sind geschützt und die Erträge bleiben langfristig hoch. Allerdings sind Aufwand, Pflege und Planung höher. Insgesamt finde ich die Agroforstwirtschaft besser, weil sie Mensch und Natur langfristig nützt.");

mt("cash",2,"Ordne die Begriffe zu.",[["Food Crops","für die Ernährung der einheimischen Bevölkerung"],["Cash Crops","für den Verkauf auf dem Weltmarkt"],["Subsistenzbauer","baut für den eigenen Bedarf an"],["Monokultur","auf großen Flächen nur eine Pflanzenart"]],"Die Fachbegriffe von deinem Arbeitsblatt und aus dem Buch.");
mc("cash",1,"Was bedeutet Monokultur?","Auf einer Fläche wird nur eine Pflanzenart angebaut.",["Auf einer Fläche wachsen viele Arten durcheinander.","Es wird nur im Winter angebaut.","Es wird nur für den Eigenbedarf angebaut."],"Mono = ein. Eine Art, riesige Fläche – ganz anders als der artenreiche Regenwald.");
mc("cash",1,"Was ist eine Plantage?","eine große Anbaufläche, auf der meist eine einzige Pflanzenart angebaut wird",["ein Garten für den Eigenbedarf","ein kleiner Wald","ein Dorfmarkt"],"Oft gehören Plantagen großen Firmen.");

mc("cash",2,"Wie groß ist eine einzelne Ölpalmfrucht etwa?","so groß wie eine Zwetschge",["so groß wie eine Melone","so groß wie eine Erbse","so groß wie ein Kürbis"],"Das Fruchtfleisch schützt einen runden Kern.");

ty("cash",1,"Wie groß ist ein Hektar? (Maße oder Fläche)",["100 × 100 m","100x100","100 x 100","100 mal 100","10000 m²","10000 quadratmeter","10000"],"1 ha = 100 m × 100 m = 10 000 m² (etwa ein großes Fußballfeld).");

mc("cash",2,"Wie groß ist die Fläche aller Ölpalmen-Plantagen heute?","über 12 Millionen Hektar – etwa ein Drittel der Fläche Deutschlands",["etwa 12 000 Hektar – so groß wie ein Dorf","über 12 Millionen Hektar – mehr als ganz Deutschland","etwa 1 Million Hektar – ein Zehntel Deutschlands"],"Und Jahr für Jahr wird diese Fläche größer.");

mc("cash",2,"Welcher Nachteil gehört zu Plantagen?","Verlust großer Regenwaldflächen und der Artenvielfalt",["niedrige Kosten und Preise","Versorgung des Welthandels","maschinell gut zu bearbeiten"],"Die anderen Antworten sind Vorteile.");

function loadPacks(){try{const v=localStorage.getItem(PKEY);return v?JSON.parse(v):[];}catch(e){return [];}}
function savePacks(p){try{localStorage.setItem(PKEY,JSON.stringify(p));}catch(e){}}
let PACKS=loadPacks();
function allSubjects(){return BUILTIN.concat(PACKS);}
function findTopic(tid){for(const s of allSubjects())for(const t of s.topics)if(t.id===tid)return {subj:s,topic:t};return null;}

/* ---------- Zustand ---------- */
function defaultState(){return {v:1,xp:0,days:{},prefs:{conf:true,len:12},topics:{}};}
function normalizeState(s){
  const d=defaultState(); if(!s||typeof s!=="object")return d;
  s.v=1; s.xp=+s.xp||0; s.days=(s.days&&typeof s.days==="object")?s.days:{};
  s.prefs=Object.assign({},d.prefs,s.prefs||{}); s.prefs.len=[8,12,20].includes(+s.prefs.len)?+s.prefs.len:12; s.prefs.conf=s.prefs.conf!==false;
  s.topics=(s.topics&&typeof s.topics==="object")?s.topics:{};
  Object.keys(s.topics).forEach(k=>{const t=s.topics[k]||{};t.ts=t.ts&&typeof t.ts==="object"?t.ts:{};t.weak=t.weak&&typeof t.weak==="object"?t.weak:{};
    t.facts=t.facts&&typeof t.facts==="object"?t.facts:{};t.sims=Array.isArray(t.sims)?t.sims:[];t.exam=typeof t.exam==="string"?t.exam:"";t.cards=t.cards&&typeof t.cards==="object"?t.cards:{};
    s.topics[k]=t;});
  return s;}
function load(){try{const v=localStorage.getItem(KEY);return normalizeState(v?JSON.parse(v):null);}catch(e){return defaultState();}}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function TS(tid){if(!S.topics[tid])S.topics[tid]={ts:{},weak:{},facts:{},sims:[],exam:"",cards:{}};return S.topics[tid];}

/* ---------- Statistik / Wiederholungslogik ---------- */
const IV=[0,1,3,7,14,30];
function examDays(tid){const e=TS(tid).exam;if(!e)return null;const d=Date.parse(e+"T00:00:00Z");if(isNaN(d))return null;return Math.floor(d/864e5)-dayNum();}
function interval(tid,box){let iv=IV[box];const D=examDays(tid);if(D!==null&&D>=0){iv=Math.min(iv,Math.max(1,Math.floor(D/3)));}return iv;}
function tstat(tid,id){return TS(tid).ts[id];}
function isSure(tid,id){const st=tstat(tid,id);return !!st&&st.box>=2;}
function streak(){let n=0,d=dayNum();if(!S.days[dayStr(d)])d--;while(S.days[dayStr(d)]&&S.days[dayStr(d)].n>0){n++;d--;}return n;}
function level(){const L=Math.floor(S.xp/250);const names=["Pfadfinder","Fährtensucher","Dschungel-Forscher","Urwald-Profi","Regenwald-Experte","Meister des Dschungels"];return {n:L+1,name:names[Math.min(L,names.length-1)],into:S.xp%250};}
function record(topic,t,ok,conf,exam){
  const T0=TS(topic.id), id=t.id, today=dayNum();
  const st=T0.ts[id]||(T0.ts[id]={n:0,ok:0,box:0,due:0,last:0});
  st.n++; if(ok)st.ok++; st.last=today;
  const dk=dayStr(today); const dd=S.days[dk]||(S.days[dk]={n:0,ok:0}); dd.n++; if(ok)dd.ok++;
  let gain=0;
  if(ok){
    if(conf===0){ T0.weak[id]=Math.max(T0.weak[id]||0,1); gain=4; }
    else{
      if(st.due<=today){st.box=Math.min(5,st.box+1);st.due=today+interval(topic.id,st.box);}
      if(T0.weak[id]){T0.weak[id]--;if(T0.weak[id]<=0)delete T0.weak[id];}
      gain=conf===2?12:10;
    }
  } else { st.box=0; st.due=today; T0.weak[id]=2; gain=2; }
  S.xp+=gain; save(); return gain;
}
function secTasks(topic,sid){return topic.tasks.filter(t=>t.sec===sid);}
function secProgress(topic,sid){const ts=secTasks(topic,sid);let seen=0,sure=0;ts.forEach(t=>{const st=tstat(topic.id,t.id);if(st&&st.n>0)seen++;if(isSure(topic.id,t.id))sure++;});
  const weak=ts.filter(t=>TS(topic.id).weak[t.id]).length;return {n:ts.length,seen,sure,weak};}
function stars(topic,sid){const p=secProgress(topic,sid);if(!p.n)return 0;let s=0;if(p.seen/p.n>=.8)s=1;if(p.sure/p.n>=.6)s=2;if(p.sure/p.n>=.85&&p.weak===0)s=3;return s;}
function fitness(topic){const T0=TS(topic.id);let sum=0;topic.tasks.forEach(t=>{const st=T0.ts[t.id];if(st)sum+=Math.min(1,st.box/3);});return Math.round(100*sum/topic.tasks.length);}
function gateOK(topic,t){ // Warum-/Operatoraufgaben (lvl 3) erst, wenn die Basics im Abschnitt sitzen
  if(t.lvl<3)return true; const base=topic.tasks.filter(x=>x.sec===t.sec&&x.lvl<3); if(!base.length)return true;
  const good=base.filter(x=>{const st=tstat(topic.id,x.id);return st&&st.ok>0;}).length; return good/base.length>=0.7;}
function dueTasks(topic){const today=dayNum(),T0=TS(topic.id);return topic.tasks.filter(t=>{const st=T0.ts[t.id];return st&&st.box>=1&&st.due<=today;}).sort((a,b)=>T0.ts[a.id].due-T0.ts[b.id].due);}
function weakTasks(topic){const W=TS(topic.id).weak;return topic.tasks.filter(t=>W[t.id]);}
function newTasks(topic){const T0=TS(topic.id);return topic.tasks.filter(t=>t.sec!=="pruef"&&!(T0.ts[t.id]&&T0.ts[t.id].n>0)&&gateOK(topic,t));}

/* ---------- Session-Aufbau ---------- */
let SES=null, CUR=null, FBSHOWN=false, LASTCHECK=0;
function pickN(arr,n){return arr.slice(0,n);}
function roundRobin(tasks,key){const g={};tasks.forEach(t=>{(g[t[key]]=g[t[key]]||[]).push(t);});const ks=shuffle(Object.keys(g));const out=[];let more=true;while(more){more=false;ks.forEach(k=>{if(g[k].length){out.push(g[k].shift());more=true;}});}return out;}
function buildQueue(topic,mode,opt){
  const N=S.prefs.len, T0=TS(topic.id), W=weakTasks(topic), D=dueTasks(topic), used=new Set(), q=[];
  const add=(arr,max)=>{let c=0;for(const t of arr){if(q.length>=N&&mode!=="due"&&mode!=="weak"&&mode!=="daily")break;if(used.has(t.id))continue;if(max!==undefined&&c>=max)break;used.add(t.id);q.push(t);c++;}};
  const byLvl=a=>a.slice().sort((x,y)=>x.lvl-y.lvl);
  if(mode==="sec"){
    const pool=secTasks(topic,opt.sec).filter(t=>gateOK(topic,t));
    add(W.filter(t=>t.sec===opt.sec),3); add(D.filter(t=>t.sec===opt.sec),3);
    add(byLvl(pool.filter(t=>!(T0.ts[t.id]&&T0.ts[t.id].n>0))),N);
    add(pool.slice().sort((a,b)=>((T0.ts[a.id]||{box:0}).box)-((T0.ts[b.id]||{box:0}).box)),N);
    return {tasks:q.slice(0,N),label:"Abschnitt"};}
  if(mode==="mix"){
    const pool=topic.tasks.filter(t=>gateOK(topic,t)&&t.sec!=="pruef"||(t.sec==="pruef"&&gateOK(topic,t)));
    add(W,4); add(D,4);
    add(roundRobin(shuffle(pool.filter(t=>!(T0.ts[t.id]&&T0.ts[t.id].n>0))),"sec"),N);
    add(roundRobin(shuffle(pool).sort((a,b)=>((T0.ts[a.id]||{box:0}).box)-((T0.ts[b.id]||{box:0}).box)),"sec"),N);
    return {tasks:shuffle(q.slice(0,N)),label:"Gemischt"};}
  if(mode==="due"){add(D,20);return {tasks:q,label:"Wiederholung"};}
  if(mode==="weak"){add(shuffle(W),20);return {tasks:q,label:"Fehlertraining"};}
  if(mode==="daily"){
    add(D,8); add(W,5);
    // neue Aufgaben aus dem Abschnitt mit dem geringsten Fortschritt (blockiert), danach gemischt
    const secs=topic.sections.map(s=>({s,p:secProgress(topic,s.id)})).filter(x=>x.p.n>0&&x.p.seen<x.p.n).sort((a,b)=>(a.p.seen/a.p.n)-(b.p.seen/b.p.n));
    if(secs.length){const sid=secs[0].s.id;add(byLvl(newTasks(topic).filter(t=>t.sec===sid)),7);}
    add(roundRobin(shuffle(newTasks(topic)),"sec"),4);
    if(q.length<10)add(roundRobin(shuffle(topic.tasks.filter(t=>gateOK(topic,t))),"sec"),10-q.length);
    return {tasks:shuffle(q),label:"Tagesrunde"};}
  if(mode==="exam"){
    const ex=shuffle(topic.tasks.filter(t=>t.sec==="pruef")), rest=shuffle(topic.tasks.filter(t=>t.sec!=="pruef"));
    let pick=ex.slice(0,14); const secs=topic.sections.map(s=>s.id).filter(s=>s!=="pruef");
    const per={};pick.forEach(t=>{per[t.sec]=1;});
    const rr=roundRobin(rest.filter(t=>t.type!=="op"),"sec"); pick=pick.concat(rr.slice(0,11));
    const ops=pick.filter(t=>t.type==="op").length; if(ops<2){const o=shuffle(topic.tasks.filter(t=>t.type==="op"&&!pick.includes(t))).slice(0,2-ops);pick=pick.slice(0,25-o.length).concat(o);}
    // Reihenfolge: nach Abschnitt geordnet wie in einer echten Arbeit (Operatoren zuletzt)
    const order=topic.sections.map(s=>s.id);
    pick.sort((a,b)=>(a.type==="op")-(b.type==="op")||order.indexOf(a.sec)-order.indexOf(b.sec));
    return {tasks:pick,label:"Prüfungssimulation"};}
  return {tasks:[],label:""};
}
function startSession(tid,mode,opt){

    app.innerHTML=head(topic,f.subj)+`<div class="card center"><p>${msg}</p><div class="btnRow center"><button class="btn" data-act="topic" data-arg="${tid}">Zurück</button></div></div>`;return;}
  SES={tid,topic,subj:f.subj,mode,opt,label:b.label,queue:b.tasks.map(t=>({t,retry:0})),total:b.tasks.length,done:0,log:[],xp0:S.xp,exam:mode==="exam",answered:0,t0:Date.now(),examAns:[]};

}

function matchAns(inp,variants,t){
  if(t.num){const m=String(inp).replace(",",".").match(/-?\d+(\.\d+)?/);if(!m)return {ok:false};const want=parseFloat(String(variants[0]).replace(",","."));return {ok:Math.abs(parseFloat(m[0])-want)<1e-9};}
  const u=nz(inp);if(!u)return {ok:false};
  for(const v of variants){if(u===nz(v))return {ok:true};}
  for(const v of variants){const w=nz(v);if(w.length>=5&&u.length<=w.length+14&&u.includes(w))return {ok:true};}
  for(const v of variants){const w=nz(v);const tol=w.length>=12?2:(w.length>=6?1:0);if(tol&&lev(u,w)<=tol)return {ok:true,fuzzy:v};}
  return {ok:false};
}
TYPES.ty={

  mine(t,v){return v.val.trim()||"(keine Antwort)";},

TYPES.cl={

function finishSession(){
  const S0=SES; const topic=S0.topic;
  if(S0.exam)return examResult();
  const ok=S0.log.filter(l=>l.ok).length, n=S0.log.length;
  S.xp+=20; save();
  const missed=[]; const seenM=new Set(); S0.log.forEach(l=>{if(!l.ok&&!seenM.has(l.id)){seenM.add(l.id);missed.push(l.t);}});

function validatePack(p){

    const sec=new Set(t.sections.map(s=>s.id)); const ids=new Set();
    for(const k of t.tasks){ if(!k.id||ids.has(k.id))return "Aufgabe ohne oder mit doppelter id: "+k.id; ids.add(k.id); if(!sec.has(k.sec))return "Aufgabe "+k.id+" hat unbekannten Abschnitt.";

      if(k.type==="mc"&&(!k.a||!Array.isArray(k.w)||k.w.length<1))return "mc "+k.id+": a und w fehlen.";

      if(k.type==="ty"&&!Array.isArray(k.a))return "ty "+k.id+": a muss eine Liste sein.";
      if(k.type==="cl"&&(!k.text||!Array.isArray(k.a)))return "cl "+k.id+": text/a fehlt.";
      if(k.type==="od"&&!Array.isArray(k.items))return "od "+k.id+": items fehlt.";

}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el)return; const act=el.dataset.act, arg=el.dataset.arg;
  if(el.tagName==="INPUT"&&el.type==="date")return;
  const v=CUR&&CUR.v, t=CUR&&CUR.t;
  switch(act){
    case "home": showHome(); break;
    case "topic": showTopic(arg); break;
    case "settings": showSettings(); break;
    case "addpack": showAddPack(); break;
    case "start":{const a=arg.split("|");startSession(a[0],a[1],{sec:a[2]});break;}
    case "again": if(SES){startSession(SES.tid,SES.mode,SES.opt);}else showHome(); break;
    case "card":{const a=arg.split("|");showCard(a[0],a[1]);break;}
    case "ops": showOps(arg); break;
    case "facts": showFacts(arg); break;
    case "quit": if(confirm("Runde wirklich beenden? Bereits beantwortete Aufgaben bleiben gespeichert.")){const id=SES.tid;SES=null;showTopic(id);} break;
    case "mcsel": v.sel=+arg; rerenderBody(); break;
    case "tfsel": v.sel=+arg; rerenderBody(); break;
    case "clchip":{const i=+arg;if(v.bank[i].used)break;const g=v.fill.findIndex(f=>f===null);if(g<0)break;v.fill[g]=i;v.bank[i].used=true;rerenderBody();break;}
    case "clgap":{const g=+arg;if(v.fill[g]===null)break;v.bank[v.fill[g]].used=false;v.fill[g]=null;rerenderBody();break;}
    case "odadd":{const b=v.bank[+arg];if(v.seq.includes(b))break;v.seq.push(b);rerenderBody();break;}
    case "odrm":{v.seq.splice(+arg,1);rerenderBody();break;}
    case "mtl":{const i=+arg;if(v.map[i]>=0){v.map[i]=-1;v.selL=-1;}else v.selL=(v.selL===i?-1:i);rerenderBody();break;}
    case "mtr":{const j=+arg;const owner=v.map.findIndex(m=>m===j);if(owner>=0){v.map[owner]=-1;rerenderBody();break;}if(v.selL>=0){v.map[v.selL]=j;v.selL=-1;rerenderBody();}break;}
    case "check": doCheck(+arg); break;
    case "optick": if(CUR){CUR.v.ticks[+arg]=el.checked;} break;
    case "opdone": opDone(); break;
    case "examtick":{const a=arg.split(":").map(Number);const x=SES.examAns[a[0]];x.v.ticks[a[1]]=el.checked;renderExamKeep();break;}
    case "examsave": examSave(); break;
    case "next": nextQ(); break;
    case "factnext": drawQ(); break;
    case "len": S.prefs.len=+arg; save(); showSettings(); break;
    case "confchk": S.prefs.conf=el.checked; save(); break;
    case "export": $("#io").value=JSON.stringify(S); $("#io").select(); $("#ioMsg").textContent="Export erstellt – Text kopieren (markieren, kopieren)."; break;
    case "import":{try{const o=JSON.parse($("#io").value);S=normalizeState(o);save();$("#ioMsg").textContent="✅ Lernstand importiert.";}catch(e){$("#ioMsg").textContent="❌ Das war kein gültiger Export.";}break;}
    case "reset": if(confirm("Lernstand für dieses Thema wirklich löschen?")){delete S.topics[arg];save();showHome();} break;
    case "packgo":{try{const p=JSON.parse($("#packIn").value);const err=validatePack(p);if(err){$("#packMsg").textContent="❌ "+err;break;}PACKS=PACKS.filter(x=>x.id!==p.id);PACKS.push(p);savePacks(PACKS);$("#packMsg").textContent="✅ Paket „"+p.name+"“ importiert.";setTimeout(showHome,700);}catch(e){$("#packMsg").textContent="❌ Kein gültiges JSON.";}break;}
    case "packtpl": $("#packIn").value=$("#tplHold").textContent; break;
    case "packdel": PACKS.splice(+arg,1); savePacks(PACKS); showAddPack(); break;
  }
});
function renderExamKeep(){const y=window.scrollY;renderExam();window.scrollTo(0,y);}
document.addEventListener("change",ev=>{const el=ev.target;
  if(el.dataset&&el.dataset.act==="examdate"){const f=SES?null:null;const tid=(location.hash||"").slice(1);
    const cur=window.__topic; if(cur){TS(cur).exam=el.value;save();showTopic(cur);} }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&FBSHOWN&&ev.target.tagName!=="TEXTAREA"&&Date.now()-LASTCHECK>350){ev.preventDefault();const nb=$("#nextBtn");if(nb)nb.click();}
});
const _showTopic=showTopic; showTopic=function(tid){window.__topic=tid;_showTopic(tid);};
showHome();
</script>
