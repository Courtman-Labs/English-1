<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raumstation ORION-7 – 3D-Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#45d4e6;--cyan2:#9ff0fa;--ink:#e8f3fb;--ok:#4fbf74;--bad:#e0604f;--warn:#f2c230;--card:rgba(12,24,42,.88);--line:rgba(69,212,230,.32)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,sans-serif;
    background:radial-gradient(ellipse at top,#12305a 0%,#070d1a 70%);background-attachment:fixed}
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.6;
    background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 40% 70%,#bdf3ff,transparent),radial-gradient(1px 1px at 85% 55%,#fff,transparent),
    radial-gradient(1px 1px at 25% 88%,#fff,transparent),radial-gradient(1px 1px at 60% 40%,#cfe0ff,transparent),
    radial-gradient(1.5px 1.5px at 92% 85%,#fff,transparent),radial-gradient(1px 1px at 5% 50%,#fff,transparent),
    radial-gradient(1px 1px at 33% 33%,#fff,transparent),radial-gradient(1px 1px at 66% 90%,#fff,transparent)}
  main{position:relative;max-width:760px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .logo{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff6ff,#1d7f9a);box-shadow:0 0 0 2px var(--cyan),0 0 16px rgba(69,212,230,.5);display:flex;align-items:center;justify-content:center;font-size:20px}
  h1{font-family:'Orbitron',sans-serif;color:var(--cyan2);font-size:19px;margin:0;line-height:1.1;letter-spacing:.04em}
  .sub{display:block;font-size:12px;opacity:.75;font-family:'Nunito'}
  .hud{display:flex;flex-wrap:wrap;gap:6px}
  .badge{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:800}
  .btn{font-family:'Orbitron',sans-serif;font-weight:800;font-size:14px;letter-spacing:.02em;border:none;border-radius:12px;padding:12px 16px;cursor:pointer;
    background:linear-gradient(#7fe6f3,#2bb3c7);color:#06222b;box-shadow:0 4px 0 #157587;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #157587}
  .btn.ghost{background:rgba(0,0,0,.3);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn.ok{background:linear-gradient(#8fe0a8,#3fae64);color:#062a12;box-shadow:0 4px 0 #23733f}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.small{font-size:12px;padding:8px 12px}
  .btnRow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .btnRow.center{justify-content:center}
  .btnRow.split{justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .center{text-align:center}
  .sectionTitle{font-family:'Orbitron',sans-serif;color:var(--cyan2);font-size:17px;margin:16px 0 6px;letter-spacing:.03em}
  .hint-sm{font-size:13.5px;opacity:.82;line-height:1.5}
  .lead{font-size:16px;line-height:1.6}
  .kepler{display:flex;gap:10px;align-items:flex-start}
  .kepler .av{flex:0 0 42px;height:42px;border-radius:12px;background:linear-gradient(#1a4f73,#0b2338);border:1px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:22px}
  .kepler .bubble{flex:1;line-height:1.6;font-size:15.5px}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;background:rgba(69,212,230,.08)}
  /* Station */
  .station{position:relative;width:100%;max-width:520px;margin:6px auto 0}
  .station svg{width:100%;display:block}
  .mod{cursor:pointer}
  .mod .ring{transition:all .2s}
  .mod.locked{cursor:default}
  .mod.cur .ring{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{stroke-width:2.2}50%{stroke-width:3.6}}
  /* Fortschritt */
  .prog{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
  .prog i{flex:1;min-width:14px;height:8px;border-radius:4px;background:rgba(255,255,255,.14);cursor:pointer}
  .prog i.d{background:var(--cyan)}
  .prog i.c{background:var(--warn)}
  .phaseLbl{font-size:12px;opacity:.75;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
  .stepH{font-family:'Orbitron',sans-serif;font-size:17px;color:var(--cyan2);margin:6px 0 10px;line-height:1.3}
  .skBox{background:#f1f6fc;border-radius:12px;padding:6px;margin:10px 0;border:1px solid rgba(255,255,255,.2)}
  .sk{width:100%;height:auto;display:block;max-height:280px}
  .shot{width:100%;border-radius:12px;margin:10px 0;border:2px solid var(--line);display:block}
  details.tip{margin-top:10px;background:rgba(242,194,48,.1);border:1px solid rgba(242,194,48,.45);border-radius:12px;padding:10px 12px}
  details.tip summary{cursor:pointer;font-weight:900;color:#ffe08a}
  details.tip div{margin-top:8px;line-height:1.55;font-size:14.5px}
  /* Quiz */
  .opt{display:block;width:100%;text-align:left;font-family:'Nunito';font-weight:800;font-size:15.5px;padding:13px 14px;margin:8px 0;border-radius:12px;
    border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--ink);cursor:pointer}
  .opt.right{background:rgba(79,191,116,.25);border-color:var(--ok)}
  .opt.wrong{background:rgba(224,96,79,.25);border-color:var(--bad)}
  .opt:disabled{cursor:default}
  .fb{margin-top:10px;padding:12px 14px;border-radius:12px;line-height:1.55}
  .fb.ok{background:rgba(79,191,116,.14);border:1px solid var(--ok)}
  .fb.bad{background:rgba(224,96,79,.14);border:1px solid var(--bad)}
  /* Checkliste */
  .chk{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);cursor:pointer;font-weight:800;line-height:1.4}
  .chk .bx{flex:0 0 24px;height:24px;border-radius:6px;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-weight:900}
  .chk.on{background:rgba(79,191,116,.16);border-color:var(--ok)}
  .chk.on .bx{background:var(--ok);border-color:var(--ok);color:#06220f}
  /* Liste */
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .row:last-child{border-bottom:none}
  .row .ic{font-size:22px;flex:0 0 30px;text-align:center}
  .row .tx{flex:1}
  .pill{font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 9px}
  .pill.ok{background:rgba(79,191,116,.25);color:#b8f5cb}
  .pill.no{background:rgba(255,255,255,.1);opacity:.8}
  .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#2bb3c7,#9ff0fa)}
  .win{font-size:54px;text-align:center;margin:6px 0}
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0d3346;border:1px solid var(--cyan);border-radius:12px;padding:10px 16px;font-weight:900;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%;text-align:center}
  @media (max-width:420px){ h1{font-size:16px} .btn{font-size:13px;padding:11px 13px} .lead,.kepler .bubble{font-size:15px} }
</style>
</head>
<body>
<div id="stars"></div>
<main id="app"></main>
<script>
/* =========================================================
   INHALT – Missionen der Raumstation ORION-7
   Jede Mission: Geschichte, Bau-Schritte (mit Skizze und optionalem iPad-Bild),
   Abschluss-Check, Replikator-Wissen (3D-Druck) und Quiz.
   Neue Mission: einfach ein weiteres Objekt anhängen (id fortlaufend m10, m11 …)
   und in STATION_POS eine Position ergänzen.
   ========================================================= */

/* iPad-Bilder (echte Bildschirmfotos der Tinkercad-iPad-App, rot markiert):
   Datei assets/tc-<id>.jpg – fehlt die Datei, wird nur die Skizze gezeigt. */
const SHOTS = {
  "s01-start":       "Startseite: „+ Erstellen“ → „3D-Entwurf“",
  "s02-arbeitsebene":"Leere Arbeitsebene, rechts die Leiste „Einfache Formen“",
  "s03-ansicht":     "Ansichtswürfel und die Knöpfe links (Startansicht, Alles einpassen, Zoom, Ansicht)",
  "s04-griffe":      "Ausgewählter Quader: weiße Eck-Griffe, schwarzer Kegel, Dreh-Pfeile",
  "s05-masse":       "Zylinder: Maße erscheinen an den Griffen und können angetippt werden",
  "s06-formfenster": "Form-Fenster: Volumenkörper/Bohrung, Länge, Breite, Höhe",
  "s15-radius":      "Form-Fenster: Radius für runde Ecken",
  "s07-text":        "Text-Form: Textfeld und Höhe (= Dicke)",
  "s08-gruppieren":  "Zwei Formen ausgewählt, Symbol „Gruppieren“ in der Werkzeugleiste",
  "s13-gruppentyp":  "Gruppentyp links „Bündel“ (Bohrung schneidet nicht), rechts „Vereinigung“ (Loch ist ausgestanzt)",
  "s09-ausrichten":  "Symbol „Ausrichten“ und die schwarzen Ausrichtungspunkte",
  "s10-duplizieren": "Symbol „Duplizieren und wiederholen“",
  "s11-spiegeln":    "Symbol „Spiegeln“ und die Spiegel-Pfeile an der Form",
  "s12-export":      "„Exportieren“ → Herunterladen → .STL",
  "s14-fangraster":  "Fangraster unten rechts"
};

const RANKS = [
  [0,   "Kadett"],
  [250, "Techniker"],
  [600, "Ingenieur"],
  [1100,"Chefingenieur"],
  [1700,"Kommandant"]
];

const MISSIONS = [
/* ---------------------------------------------------------- 1 */
{ id:"m1", icon:"🔧", module:"Werkstatt", title:"Erwachen in der Werkstatt",
  story:`Willkommen an Bord der Raumstation <b>ORION-7</b>, Kadett! Ein Meteoritenschauer hat die Station beschädigt. Zum Glück haben wir den <b>Replikator</b> – eine Maschine, die Ersatzteile Schicht für Schicht aus Kunststoff baut. Aber der Replikator braucht <b>Baupläne</b>. Und die zeichnest ab heute du – mit dem Konstruktions-Programm <b>Tinkercad</b>.<br><br>Ich bin <b>KEPLER</b>, der Bordcomputer. Als Erstes schalten wir das Licht in der Werkstatt wieder ein. Dafür lernst du, dich in Tinkercad zu bewegen.`,
  goal:"Du kannst einen Entwurf anlegen, eine Form auf die Arbeitsebene setzen und die Ansicht drehen, zoomen und zurücksetzen.",
  skills:["Neuen Entwurf anlegen","Arbeitsebene","Ansicht drehen und zoomen","Rückgängig"],
  steps:[
    {t:"Neuen Entwurf anlegen", sk:"dashboard", shot:"s01-start",
     d:`Öffne die <b>Tinkercad-App</b> und melde dich an. Tippe oben rechts auf <b>„+ Erstellen“</b> und wähle <b>„3D-Entwurf“</b>. Tinkercad gibt deinem Entwurf einen lustigen Zufallsnamen (z. B. „Smashing Allis“) – den ändern wir gleich.`,
     tip:`Du siehst die Startseite nicht, sondern schon einen Entwurf? Tippe oben links auf das bunte TINKERCAD-Logo, dann kommst du zur Startseite zurück.`},
    {t:"Die Arbeitsebene kennenlernen", sk:"workplane", shot:"s02-arbeitsebene",
     d:`Das blaue Gitter in der Mitte ist die <b>Arbeitsebene</b> – dein Arbeitstisch. Jedes Kästchen ist <b>1 mm</b> groß, die dickeren Linien sind 10 mm voneinander entfernt. Rechts ist die <b>Formen-Leiste „Einfache Formen“</b>: Quader, Zylinder, Kugel, Kegel, Text und viele mehr. Die <b>grau gestreiften</b> Formen in der obersten Reihe sind fertige <b>Bohrungen</b> – die brauchen wir ab Mission 4.`,
     tip:`Die Formen-Leiste ist weg? Tippe auf den kleinen Pfeil „‹“ am rechten Rand, dann klappt sie wieder auf. Über „Einfache Formen“ kannst du auch andere Formen-Sammlungen auswählen – für unsere Missionen bleiben wir bei „Einfache Formen“.`},
    {t:"Einen Quader setzen", sk:"placeBox",
     d:`Ziehe den roten <b>Quader</b> (zweite Reihe, links) aus der Formen-Leiste auf die Arbeitsebene. Lass ihn irgendwo los. Glückwunsch – das ist deine erste Form! Tippe daneben ins Leere: Die Auswahl verschwindet. Tippe wieder auf den Quader: Er ist ausgewählt und hat jetzt kleine <b>Griffe</b>.`},
    {t:"Ansicht drehen, verschieben, zoomen", sk:"gestures", shot:"s03-ansicht",
     d:`Schau dir den Quader von allen Seiten an:<br>• <b>Drehen:</b> mit einem Finger auf einer leeren Stelle wischen<br>• <b>Verschieben:</b> mit zwei Fingern wischen<br>• <b>Zoomen:</b> zwei Finger auseinander- oder zusammenziehen<br>Oben links ist der <b>Ansichtswürfel</b>: Tippe auf „OBEN“ oder „VORNE“, dann springt die Ansicht genau dorthin. Darunter sind die Knöpfe: <b>Haus</b> = zurück zur Startansicht, <b>Rahmen mit Raute</b> = alles einpassen (alle Formen passen auf den Bildschirm), <b>+ und −</b> = zoomen.`,
     tip:`Wenn sich statt der Ansicht der Quader bewegt, hast du auf den Quader getippt – wisch auf einer leeren Stelle. Hast du dich „verflogen“: Haus-Knopf antippen.`},
    {t:"Verschieben, löschen, rückgängig", sk:"undo",
     d:`Ziehe den Quader mit dem Finger an eine andere Stelle. Jetzt löschen: Quader antippen und oben in der Werkzeugleiste den <b>Mülleimer</b> antippen. Oh nein, weg! Kein Problem: Der <b>Pfeil nach links</b> direkt neben dem Mülleimer ist „Rückgängig“ und holt ihn zurück. Rückgängig ist dein bester Freund – du kannst nichts kaputt machen.`},
    {t:"Entwurf umbenennen", sk:"rename",
     d:`Tippe oben links (neben dem TINKERCAD-Logo) auf den Zufallsnamen deines Entwurfs und nenne ihn <b>„ORION Werkstatt“</b>. Tinkercad speichert automatisch – du musst nie auf „Speichern“ drücken.`}
  ],
  check:["Ich habe einen neuen 3D-Entwurf angelegt","Ich kann die Ansicht drehen und zoomen","Ich habe mit „Rückgängig“ etwas zurückgeholt","Mein Entwurf heißt „ORION Werkstatt“"],
  know:{t:"Was macht der Replikator eigentlich?", sk:"fdm",
    d:`Unser Replikator ist ein <b>3D-Drucker</b>. Die häufigste Art funktioniert so: Ein dünner Kunststoff-Faden (das <b>Filament</b>) wird in einer heißen <b>Düse</b> geschmolzen – ungefähr 200 °C heiß. Die Düse fährt hin und her und legt eine hauchdünne Linie aus flüssigem Kunststoff ab, die sofort fest wird. So entsteht <b>Schicht für Schicht</b> von unten nach oben ein echtes Teil. Darum heißt das Verfahren auch „Schmelzschichtung“ (englisch FDM).`},
  quiz:[
    {q:"Wie groß ist ein kleines Kästchen auf der Arbeitsebene?", o:["1 mm","1 cm","1 m"], a:0, e:"Ein kleines Kästchen ist 1 Millimeter. Die dickeren Linien liegen 10 mm (= 1 cm) auseinander."},
    {q:"Du hast aus Versehen etwas gelöscht. Was tust du?", o:["„Rückgängig“ antippen","Einen neuen Entwurf anfangen","Die App schließen"], a:0, e:"„Rückgängig“ holt den letzten Schritt zurück – beliebig oft hintereinander."},
    {q:"Wie baut ein 3D-Drucker ein Teil?", o:["Schicht für Schicht von unten nach oben","Er schnitzt es aus einem Block","Er gießt es auf einmal in eine Form"], a:0, e:"Der Drucker legt hauchdünne Schichten übereinander. Das Schnitzen aus einem Block macht eine Fräsmaschine."},
    {q:"Wie heißt der Kunststoff-Faden, den der Drucker schmilzt?", o:["Filament","Pixel","Granulat"], a:0, e:"Das Filament kommt auf einer Rolle und wird in der heißen Düse geschmolzen."}
  ]},

/* ---------------------------------------------------------- 2 */
{ id:"m2", icon:"🧊", module:"Replikator", title:"Der Kalibrierwürfel",
  story:`Die Werkstatt hat wieder Licht! Jetzt muss der <b>Replikator</b> neu eingestellt werden. Dafür braucht er einen <b>Kalibrierwürfel</b>: einen Würfel, der <b>genau 20 mm</b> in jede Richtung misst. Wenn der gedruckte Würfel nachher 20 mm misst, weiß der Replikator, dass er richtig rechnet. „Ungefähr“ reicht also nicht – heute lernst du, <b>Maße genau einzutippen</b>.`,
  goal:"Du kannst eine Form auf ein genaues Maß in Millimetern bringen und die Höhe ändern.",
  skills:["Griffe","Maße eintippen","Breite, Tiefe, Höhe"],
  steps:[
    {t:"Neuer Entwurf, neuer Quader", sk:"placeBox",
     d:`Lege einen neuen 3D-Entwurf an und nenne ihn <b>„Kalibrierwürfel“</b>. Ziehe einen Quader auf die Arbeitsebene.`},
    {t:"Die Griffe verstehen", sk:"handles", shot:"s04-griffe",
     d:`Tippe den Quader an. Jetzt siehst du:<br>• <b>Weiße Quadrate an den Ecken unten</b> – ändern Länge und Breite<br>• <b>Weißes Quadrat oben in der Mitte</b> – ändert die Höhe<br>• <b>Schwarzer Kegel oben</b> – hebt die Form hoch oder senkt sie ab<br>• <b>Gebogene Pfeile</b> – drehen die Form`,
     tip:`Die Griffe sind sehr klein? Zoome näher heran, dann triffst du sie leichter.`},
    {t:"Maße eintippen", sk:"dims20", shot:"s06-formfenster",
     d:`Wenn der Quader ausgewählt ist, steht rechts das <b>Form-Fenster</b>. Unter <b>„Eigenschaften“</b> findest du <b>Länge, Breite und Höhe</b> in mm. Zieh zum Üben den Eck-Griff, bis der Quader größer ist – die Zahlen ändern sich mit. Dann tippe auf die Zahl bei <b>Länge</b> und gib <b>20</b> ein, ebenso bei <b>Breite</b>.`,
     tip:`Du siehst nur eine kleine Leiste mit „Quader“ und zwei Farbkreisen? Tippe links daneben auf den kleinen Pfeil „˅“ – dann klappt das ganze Form-Fenster auf.`},
    {t:"Die Höhe prüfen", sk:"dims20", shot:"s05-masse",
     d:`Prüfe jetzt die <b>Höhe</b>: Stelle sie im Form-Fenster ebenfalls auf <b>20</b>. Nun ist dein Würfel 20 × 20 × 20 mm – genau wie der Replikator ihn braucht. Übrigens: Wenn du einen Griff antippst, erscheinen die Maße auch direkt an der Form und du kannst sie dort antippen und ändern (im Bild beim Zylinder: 11.00 und 10.00).`,
     tip:`Bei manchen Formen (z. B. Zylinder) stehen die Maße nicht im Form-Fenster. Dann geht es nur über die Zahlen an den Griffen.`},
    {t:"Bonus: ein „X“ obendrauf", sk:"cubeX",
     d:`Damit man später weiß, wo oben ist: Ziehe die <b>Text</b>-Form (rotes „TEXT“) auf die Arbeitsebene, tippe im Form-Fenster ins Feld <b>Text</b> und schreibe <b>X</b>. Stelle bei <b>Höhe</b> (das ist die Dicke des Buchstabens) <b>1</b> ein und hebe ihn mit dem <b>schwarzen Kegel</b> auf <b>20</b> mm hoch. Schiebe ihn mitten auf den Würfel.`,
     tip:`Das ist eine Bonus-Aufgabe. Wie man Formen genau in die Mitte setzt, lernst du in Mission 5 noch richtig.`}
  ],
  check:["Mein Würfel ist genau 20 × 20 × 20 mm","Ich weiß, welcher Griff was macht","Ich kann ein Maß eintippen"],
  know:{t:"Wie lange druckt der Replikator?", sk:"cubeSizes",
    d:`Ein 3D-Drucker ist geduldig, aber nicht schnell. Ein 20-mm-Würfel dauert etwa eine halbe Stunde. Ein Würfel mit <b>doppelter</b> Kantenlänge (40 mm) hat aber nicht doppelt so viel Material, sondern <b>8-mal so viel</b> (2 × 2 × 2)! Darum gilt für Ingenieure: <b>So groß wie nötig, so klein wie möglich.</b> Außerdem ist jeder Drucker begrenzt – viele Drucker schaffen höchstens etwa 18 bis 25 cm in jede Richtung.`},
  quiz:[
    {q:"Welcher Griff ändert die Höhe einer Form?", o:["Das weiße Quadrat oben in der Mitte","Der schwarze Kegel","Die gebogenen Pfeile"], a:0, e:"Das weiße Quadrat oben ändert die Höhe. Der schwarze Kegel hebt die ganze Form hoch, ohne sie größer zu machen."},
    {q:"Was macht der schwarze Kegel über der Form?", o:["Er hebt die Form an oder senkt sie ab","Er macht die Form spitz","Er löscht die Form"], a:0, e:"Mit dem schwarzen Kegel schwebt die Form höher – das brauchst du, um Formen aufeinanderzustapeln."},
    {q:"Ein Würfel hat 20 mm Kantenlänge. Du machst ihn 40 mm groß. Wie viel mehr Material braucht er?", o:["8-mal so viel","2-mal so viel","4-mal so viel"], a:0, e:"Breite, Tiefe und Höhe werden je doppelt so groß: 2 × 2 × 2 = 8."},
    {q:"Wozu dient ein Kalibrierwürfel?", o:["Man prüft, ob der Drucker die Maße genau trifft","Er ist ein Spielwürfel","Er reinigt die Düse"], a:0, e:"Man misst den gedruckten Würfel nach. Sind es genau 20 mm, ist der Drucker richtig eingestellt."}
  ]},

/* ---------------------------------------------------------- 3 */
{ id:"m3", icon:"🚪", module:"Crew-Quartiere", title:"Das Türschild",
  story:`In den <b>Crew-Quartieren</b> sind alle Türschilder geschmolzen. Niemand weiß mehr, wer wo schläft! Deine Aufgabe: ein Türschild mit <b>deinem Namen</b>. Dafür lernst du, <b>Formen aufeinanderzustapeln</b> und mit <b>Text</b> zu arbeiten.`,
  goal:"Du kannst eine Platte mit runden Ecken bauen, Text daraufsetzen und beides gruppieren.",
  skills:["Form-Fenster","Abgerundete Ecken","Text-Form","Anheben","Gruppieren"],
  steps:[
    {t:"Die Grundplatte", sk:"plate",
     d:`Neuer Entwurf „Türschild“. Ziehe einen Quader auf die Arbeitsebene und stelle im Form-Fenster <b>Länge 80</b>, <b>Breite 25</b> und <b>Höhe 3</b> mm ein.`,
     tip:`Liegt die Platte quer statt längs? Das ist egal – du kannst die Ansicht drehen. Oder du tauschst Länge und Breite.`},
    {t:"Runde Ecken", sk:"radius", shot:"s15-radius",
     d:`Im Form-Fenster gibt es oben bei den Eigenschaften den Regler <b>„Radius“</b>. Stelle ihn auf <b>2</b> – die Ecken werden rund. Über den großen Farbkreis bei <b>„Volumenkörper“</b> kannst du die <b>Farbe</b> ändern. Wähle eine Farbe für dein Schild.`,
     tip:`Den Radius nicht zu groß machen: Bei einer 3 mm dicken Platte reichen 1 bis 2 mm, sonst wird die Platte an den Rändern sehr dünn.`},
    {t:"Text hinzufügen", sk:"textShape", shot:"s07-text",
     d:`Ziehe die Form <b>Text</b> (rotes „TEXT“) auf die Arbeitsebene. Im Form-Fenster steht im Feld <b>Text</b> „TEXT“ – tippe hinein und schreibe deinen Namen, z. B. <b>LUKAS</b>. Achtung: <b>„Höhe“</b> bedeutet bei der Text-Form die <b>Dicke</b> der Buchstaben (am Anfang 10 mm). Stelle sie auf <b>2</b>. Ziehe dann an einem weißen Eck-Griff, bis der Text etwa <b>60 mm</b> lang ist.`,
     tip:`Damit die Buchstaben nicht gequetscht werden: Tippe auf einen Eck-Griff, dann erscheinen die Maße. Ändere Länge und Breite im gleichen Verhältnis – z. B. 60 lang und 12 breit.`},
    {t:"Text anheben", sk:"liftText",
     d:`Der Text steht noch auf der Arbeitsebene und steckt <b>in</b> der Platte. Er soll aber <b>auf</b> der Platte stehen. Tippe den Text an und ziehe den <b>schwarzen Kegel</b> nach oben, bis die Zahl <b>3</b> erscheint (oder tippe 3 ein). Jetzt steht der Text genau auf der 3 mm dicken Platte. Schiebe ihn in die Mitte.`},
    {t:"Gruppieren", sk:"group", shot:"s08-gruppieren",
     d:`Tippe erst die Platte an und dann den Text – jetzt sind beide ausgewählt (im Form-Fenster steht „Shapes(2)“). Tippe oben in der Werkzeugleiste auf das Symbol <b>„Gruppieren“</b> – ein <b>Quadrat und ein Kreis in einem gestrichelten Rahmen</b>. Jetzt hängen Platte und Text zusammen. Im Form-Fenster steht <b>„Gruppentyp: Bündel“</b>: Die Teile bleiben einzeln und behalten ihre Farben – perfekt für ein zweifarbiges Schild.`,
     tip:`Mehrere Formen auswählen: einfach nacheinander antippen. Aus Versehen etwas Falsches mit ausgewählt? Auf eine leere Stelle tippen und neu anfangen.`}
  ],
  check:["Die Platte ist 80 × 25 × 3 mm mit runden Ecken","Mein Name steht AUF der Platte (Höhe 3 mm angehoben)","Platte und Text sind gruppiert"],
  know:{t:"Schichten und feine Details", sk:"layers",
    d:`Der Replikator legt Schichten von meist <b>0,2 mm</b> übereinander – dein 3 mm dickes Schild hat also 15 Schichten. Die Düse ist ungefähr <b>0,4 mm</b> breit. Daraus folgt eine Ingenieurs-Regel: <b>Sehr dünne Linien gehen beim Drucken verloren.</b> Buchstaben sollten deshalb nicht zu klein sein – etwa ab 8 mm Buchstabenhöhe, mit Strichen von mindestens 1 mm, wird Text schön lesbar.`},
  quiz:[
    {q:"Der Text steht auf der Arbeitsebene und steckt in der 3 mm dicken Platte. Wie hoch musst du ihn anheben?", o:["3 mm","2 mm","5 mm"], a:0, e:"Die Platte ist 3 mm hoch. Hebst du den Text um 3 mm an, steht er genau auf der Oberseite."},
    {q:"Was bewirkt „Gruppieren“?", o:["Mehrere Formen werden zu einem Teil","Die Formen werden doppelt so groß","Die Formen werden gelöscht"], a:0, e:"Gruppierte Formen verhalten sich wie ein einziges Teil – man kann sie zusammen verschieben und drucken."},
    {q:"Wo stellst du ein, dass ein Quader runde Ecken bekommt?", o:["Im Form-Fenster beim „Radius“","Mit dem schwarzen Kegel","Mit den Dreh-Pfeilen"], a:0, e:"Das Form-Fenster zeigt die Einstellungen der ausgewählten Form, z. B. Radius, Farbe und Text."},
    {q:"Wie dick ist eine Druck-Schicht ungefähr?", o:["0,2 mm","2 mm","2 cm"], a:0, e:"Typisch sind 0,1 bis 0,3 mm pro Schicht. Dünnere Schichten sehen schöner aus, dauern aber länger."}
  ]},

/* ---------------------------------------------------------- 4 */
{ id:"m4", icon:"🔑", module:"Luftschleuse", title:"Der Zugangschip",
  story:`Die <b>Luftschleuse</b> öffnet sich nur mit einem <b>Zugangschip</b>. Der alte ist im Weltall verschwunden. Wir brauchen einen neuen – mit einem <b>Loch</b> für den Schlüsselring und der eingravierten Aufschrift <b>ORION</b>. Heute lernst du den wichtigsten Trick von Tinkercad: die <b>Bohrung</b>.`,
  goal:"Du kannst mit Bohrungen Löcher und Gravuren in Formen schneiden.",
  skills:["Volumenkörper und Bohrung","Löcher schneiden","Gravur","Export als STL"],
  steps:[
    {t:"Der Chip-Körper", sk:"chipBody",
     d:`Neuer Entwurf „Zugangschip“. Quader mit <b>50 × 30 × 4</b> mm, Radius <b>3</b>.`},
    {t:"Volumenkörper oder Bohrung?", sk:"solidHole", shot:"s06-formfenster",
     d:`Im Form-Fenster siehst du oben zwei große Kreise: <b>Volumenkörper</b> (fest, farbig) und <b>Bohrung</b> (durchsichtig, grau gestreift). Eine Bohrung ist wie ein <b>Radiergummi in 3D</b>: Wo sie andere Formen berührt, wird beim Gruppieren Material weggeschnitten.`},
    {t:"Das Loch für den Schlüsselring", sk:"chipHole",
     d:`Ziehe einen <b>Zylinder</b> auf die Arbeitsebene und tippe im Form-Fenster auf <b>Bohrung</b> (oder nimm gleich den grau gestreiften Zylinder aus der obersten Reihe). Tippe einen Eck-Griff an und stelle die Maße auf <b>6 × 6</b> mm; die Höhe auf <b>10</b> mm, damit er höher ist als der Chip. Schiebe ihn an ein Ende des Chips, etwa 5 mm vom Rand entfernt.`,
     tip:`Die Bohrung muss durch das ganze Teil gehen. Ist sie zu niedrig, entsteht nur eine Mulde statt einem Loch.`},
    {t:"Gravur „ORION“", sk:"chipEngrave",
     d:`Ziehe eine <b>Text</b>-Form herüber, schreibe <b>ORION</b>, stelle sie auf <b>Bohrung</b> und die Höhe (Dicke) auf <b>2</b> mm. Hebe sie mit dem schwarzen Kegel auf <b>3</b> mm an. Jetzt ragt die Text-Bohrung 1 mm tief in den 4 mm dicken Chip hinein – das wird die Gravur.`},
    {t:"Gruppieren als Vereinigung", sk:"chipDone", shot:"s13-gruppentyp",
     d:`Tippe nacheinander den Chip, die Zylinder-Bohrung und die Text-Bohrung an und tippe dann auf <b>„Gruppieren“</b>. Jetzt kommt der wichtige Trick: Im Form-Fenster steht <b>„Gruppentyp“</b> mit drei Symbolen. Tippe auf das <b>mittlere Symbol „Vereinigung“</b>. Erst dann verschmilzt alles zu einem Teil – das Loch ist durchgestanzt und ORION ist eingraviert!`,
     tip:`Die Bohrung ist noch grau zu sehen und das Loch fehlt? Dann steht der Gruppentyp auf „Bündel“ (das ist am Anfang eingestellt) – beim Bündel bleiben alle Teile einzeln und die Bohrung schneidet nicht. Auf „Vereinigung“ umstellen, wie im Bild rechts. Zum Trennen gibt es das Symbol „Gruppierung aufheben“ (rechts neben „Gruppieren“).`},
    {t:"Bauplan für den Replikator exportieren", sk:"exportFlow", shot:"s12-export",
     d:`Tippe oben rechts auf <b>„Exportieren“</b>. Im Fenster ist der Reiter <b>„Herunterladen“</b> ausgewählt – unter „Für 3D-Druck“ tippst du auf <b>.STL</b>. Das ist das Dateiformat, das jeder 3D-Drucker versteht. Die Datei landet in deinen Downloads. Noch haben wir keinen echten Replikator – aber so würdest du den Bauplan losschicken.`,
     tip:`Das Exportieren ist freiwillig. Du kannst es auch nur anschauen und wieder abbrechen.`}
  ],
  check:["Der Chip hat ein durchgehendes Loch","ORION ist 1 mm tief eingraviert","Alles ist gruppiert","Ich weiß, wo der STL-Export ist"],
  know:{t:"Löcher sind beim Drucken etwas kleiner", sk:"holeShrink",
    d:`Ein Trick, den echte Ingenieure kennen: <b>Gedruckte Löcher werden meist etwas kleiner</b> als geplant, weil der geschmolzene Kunststoff ein bisschen nach innen fließt. Soll ein 6-mm-Stift durch ein Loch passen, plant man das Loch lieber <b>6,3 bis 6,5 mm</b> groß. Und noch etwas: Die <b>STL-Datei</b> beschreibt die Form als viele kleine Dreiecke – so sieht der Drucker dein Teil.`},
  quiz:[
    {q:"Du gruppierst Chip und Bohrung. Bei welchem Gruppentyp wird das Loch ausgestanzt?", o:["Vereinigung","Bündel","Bei beiden gleich"], a:0, e:"Erst die Vereinigung verschmilzt alles zu einem Teil und schneidet mit der Bohrung Material weg. Beim Bündel bleiben die Teile einzeln."},
    {q:"Dein Chip ist 4 mm dick. Die Loch-Bohrung ist nur 2 mm hoch. Was passiert?", o:["Es entsteht nur eine Mulde, kein Loch","Das Loch geht trotzdem durch","Der Chip wird dünner"], a:0, e:"Die Bohrung schneidet nur dort, wo sie ist. Für ein Loch muss sie durch die ganze Dicke reichen."},
    {q:"Welches Dateiformat versteht fast jeder 3D-Drucker?", o:["STL","MP3","JPG"], a:0, e:"STL beschreibt die Oberfläche als viele kleine Dreiecke. MP3 ist Musik, JPG ist ein Foto."},
    {q:"Ein 6-mm-Stift soll durch ein gedrucktes Loch passen. Wie groß planst du das Loch?", o:["Etwas größer, z. B. 6,4 mm","Genau 6,0 mm","Kleiner, z. B. 5,5 mm"], a:0, e:"Gedruckte Löcher werden meist etwas kleiner. Deshalb gibt man ein paar Zehntel Millimeter dazu."}
  ]},

/* ---------------------------------------------------------- 5 */
{ id:"m5", icon:"📡", module:"Funkturm", title:"Der Antennenmast",
  story:`Ohne Funk keine Verbindung zur Erde! Der <b>Funkturm</b> braucht einen neuen <b>Antennenmast</b>: drei Zylinder, immer dünner, übereinandergestapelt, mit einer Spitze obendrauf. Das Schwierige: Alles muss <b>genau in der Mitte</b> sitzen, sonst wackelt der Empfang. Dafür gibt es das Werkzeug <b>Ausrichten</b>.`,
  goal:"Du kannst Formen genau stapeln und mit „Ausrichten“ mittig ausrichten.",
  skills:["Zylinder und Kegel","Stapeln mit genauer Höhe","Ausrichten","Glatte Rundungen (Seiten)"],
  steps:[
    {t:"Der Sockel", sk:"mastBase",
     d:`Neuer Entwurf „Antennenmast“. Zylinder mit <b>30 × 30 × 6</b> mm (die Maße stellst du beim Zylinder über die Zahlen an den Griffen ein). Im Form-Fenster gibt es <b>„Seiten“</b> – stelle sie auf <b>64</b>. Dann ist der Zylinder schön rund statt eckig.`},
    {t:"Der Mast", sk:"mastStack",
     d:`Zweiter Zylinder: <b>10 × 10 × 40</b> mm, anheben auf <b>6</b> mm (er steht dann auf dem Sockel). Dritter Zylinder: <b>5 × 5 × 20</b> mm, anheben auf <b>46</b> mm (6 + 40).`,
     tip:`Rechne immer: neue Höhe = Höhe aller Teile darunter zusammen. Zum Anheben den <b>schwarzen Kegel</b> antippen – dann erscheint die Höhe als Zahl, die du eintippen kannst.`},
    {t:"Die Spitze", sk:"mastStack",
     d:`Ziehe einen <b>Kegel</b> dazu: <b>8 × 8 × 10</b> mm, anheben auf <b>66</b> mm (46 + 20). Jetzt steht alles übereinander – aber wahrscheinlich noch schief nebeneinander.`},
    {t:"Ausrichten!", sk:"align", shot:"s09-ausrichten",
     d:`Tippe <b>alle vier Formen</b> nacheinander an und dann in der Werkzeugleiste auf <b>„Ausrichten“</b> (Symbol mit Balken an einer Linie). Es erscheinen schwarze Punkte an den Seiten. Tippe bei der Breite auf den <b>mittleren Punkt</b> und bei der Tiefe ebenfalls auf den <b>mittleren Punkt</b>. Zack – alles sitzt genau übereinander in der Mitte!`,
     tip:`Tippe die Höhen-Punkte NICHT an, sonst rutschen alle Formen auf dieselbe Höhe.`},
    {t:"Gruppieren und anschauen", sk:"mastDone",
     d:`Gruppiere alles. Dreh die Ansicht und schau von unten: Der Sockel liegt flach auf der Arbeitsebene. Das ist wichtig für den Druck – gleich erfährst du warum.`}
  ],
  check:["Der Mast hat Sockel, zwei Zylinder und eine Spitze","Alles sitzt genau in der Mitte (Ausrichten)","Die Zylinder sind rund (Seiten erhöht)"],
  know:{t:"Die 45-Grad-Regel", sk:"overhang",
    d:`Der Replikator kann nicht in die Luft drucken – jede Schicht braucht eine Schicht darunter. Wenn eine Wand schräg nach außen geht (ein <b>Überhang</b>), steht jede neue Schicht ein bisschen über. Bis etwa <b>45 Grad</b> Schräge klappt das gut. Flacher wird es hässlich oder stürzt ab. Darum ist die <b>Spitze als Kegel</b> perfekt: Sie wird nach oben schmaler. Eine Kugel dagegen hat unten einen starken Überhang.`},
  quiz:[
    {q:"Was erreichst du mit „Ausrichten“ und den mittleren Punkten?", o:["Alle Formen sitzen genau in der Mitte übereinander","Alle Formen werden gleich groß","Alle Formen bekommen dieselbe Farbe"], a:0, e:"Ausrichten verschiebt die Formen so, dass ihre Mitten auf einer Linie liegen."},
    {q:"Der Sockel ist 6 mm hoch, der Mast darauf 40 mm. Wie hoch hebst du das nächste Teil an?", o:["46 mm","40 mm","6 mm"], a:0, e:"Neue Höhe = alle Teile darunter zusammen: 6 + 40 = 46 mm."},
    {q:"Welche Schräge kann ein 3D-Drucker ohne Hilfe meist noch gut drucken?", o:["Bis etwa 45 Grad","Bis etwa 80 Grad","Gar keine"], a:0, e:"Bis ungefähr 45 Grad liegt jede Schicht noch genug auf der darunter. Flachere Überhänge brauchen Stützen."},
    {q:"Warum stellst du bei Zylindern die „Seiten“ höher?", o:["Damit sie rund statt eckig aussehen","Damit sie schneller drucken","Damit sie leichter werden"], a:0, e:"Ein Zylinder besteht aus vielen geraden Seitenflächen. Je mehr Seiten, desto runder."}
  ]},

/* ---------------------------------------------------------- 6 */
{ id:"m6", icon:"☀️", module:"Energiedeck", title:"Die Solarflügel",
  story:`Das <b>Energiedeck</b> ist dunkel – die Solarflügel sind zerbrochen. Ein Solarflügel ist ein Rahmen mit vielen gleichen Fenstern. Die alle einzeln zu bauen, dauert ewig. Darum lernst du heute zwei Ingenieurs-Abkürzungen: <b>Duplizieren und wiederholen</b> und <b>Spiegeln</b>.`,
  goal:"Du kannst Formen in regelmäßigen Abständen vervielfältigen und spiegeln.",
  skills:["Duplizieren und wiederholen","Muster","Spiegeln"],
  steps:[
    {t:"Der Rahmen", sk:"panel",
     d:`Neuer Entwurf „Solarflügel“. Quader <b>66 × 30 × 2</b> mm.`},
    {t:"Das erste Fenster", sk:"panelHole",
     d:`Quader als <b>Bohrung</b>: <b>10 × 10 × 6</b> mm. Schiebe ihn in die linke untere Ecke des Rahmens, sodass ringsum etwa 4 mm Rand bleiben.`},
    {t:"Duplizieren und wiederholen", sk:"repeat", shot:"s10-duplizieren",
     d:`Tippe die Fenster-Bohrung an und dann oben links auf <b>„Duplizieren und wiederholen“</b> (das <b>dritte Symbol</b>: zwei übereinanderliegende Rechtecke, neben dem Mülleimer). Eine Kopie entsteht genau an derselben Stelle. Schiebe die Kopie <b>12 mm nach rechts</b>. Jetzt tippe noch dreimal auf <b>„Duplizieren und wiederholen“</b> – Tinkercad merkt sich die Verschiebung und setzt die nächsten Fenster automatisch im gleichen Abstand!`,
     tip:`Wichtig: Zwischen dem ersten Duplizieren und dem Verschieben nichts anderes antippen, sonst vergisst Tinkercad das Muster.`},
    {t:"Die zweite Reihe", sk:"repeat",
     d:`Tippe alle 5 Fenster nacheinander an, dupliziere sie und schiebe die Kopie <b>12 mm nach hinten</b>. Gruppiere dann Rahmen und alle Fenster – fertig ist der Gitterrahmen mit 10 Fenstern.`},
    {t:"Den zweiten Flügel spiegeln", sk:"mirror", shot:"s11-spiegeln",
     d:`Dupliziere den fertigen Flügel und tippe auf <b>„Spiegeln“</b> (Symbol mit zwei Dreiecken). An der Form erscheinen Doppelpfeile – tippe auf den Pfeil für links/rechts. Der Flügel wird umgedreht wie in einem Spiegel. Schiebe ihn auf die andere Seite und setze in die Mitte einen Zylinder als <b>Verbindungsstange</b> (Ø 6 mm, quer gelegt).`,
     tip:`Die Stange quer legen: Zylinder mit den gebogenen Pfeilen um 90° drehen. Beim Drehen rastet die Form in Schritten ein.`}
  ],
  check:["Mein Flügel hat 10 gleiche Fenster","Ich habe „Duplizieren und wiederholen“ benutzt","Der zweite Flügel ist gespiegelt"],
  know:{t:"Stützen und die flache Unterseite", sk:"support",
    d:`Manchmal hat ein Teil Stellen, die in der Luft hängen. Dann kann der Drucker <b>Stützstrukturen</b> mitdrucken – kleine Gerüste, die man danach abbricht. Das kostet Material und Zeit und hinterlässt raue Stellen. Kluge Ingenieure konstruieren deshalb so, dass ein Teil eine <b>große, flache Unterseite</b> hat. Die klebt gut auf dem Druckbett, und das Teil braucht keine Stützen. Dein Solarflügel ist perfekt: komplett flach!`},
  quiz:[
    {q:"Was macht „Duplizieren und wiederholen“ besonders?", o:["Es merkt sich die letzte Verschiebung und wiederholt sie","Es macht die Form doppelt so groß","Es dreht die Form um"], a:0, e:"Nach dem ersten Verschieben setzt jedes weitere Antippen eine Kopie im gleichen Abstand."},
    {q:"Was bewirkt „Spiegeln“?", o:["Die Form wird seitenverkehrt umgeklappt","Die Form wird glänzend","Die Form wird kopiert"], a:0, e:"Spiegeln klappt eine Form um – wie dein Spiegelbild. Für eine Kopie musst du vorher duplizieren."},
    {q:"Warum vermeidet man Stützstrukturen, wenn es geht?", o:["Sie kosten Material und Zeit und hinterlassen raue Stellen","Sie sind verboten","Sie machen das Teil schwerer zu exportieren"], a:0, e:"Stützen müssen mitgedruckt und wieder entfernt werden. Besser: so konstruieren, dass man keine braucht."},
    {q:"Welche Unterseite ist für den Druck am besten?", o:["Eine große, flache Fläche","Eine Spitze","Eine runde Kugel-Unterseite"], a:0, e:"Eine große flache Fläche klebt gut auf dem Druckbett und braucht keine Stützen."}
  ]},

/* ---------------------------------------------------------- 7 */
{ id:"m7", icon:"📦", module:"Lagerraum", title:"Die Versorgungskapsel",
  story:`Im <b>Lagerraum</b> fliegen Schrauben und Snacks durch die Schwerelosigkeit! Wir brauchen eine <b>Versorgungskapsel</b>: eine Box mit <b>Deckel, der genau passt</b>. Nicht zu locker, nicht zu fest. Das ist echte Ingenieursarbeit – du lernst <b>Hohlkörper</b>, <b>Wandstärke</b> und <b>Spiel</b>.`,
  goal:"Du kannst eine hohle Box mit passendem Deckel konstruieren.",
  skills:["Hohlkörper","Wandstärke","Toleranz (Spiel)","Ausrichten"],
  steps:[
    {t:"Der Außenkörper", sk:"boxOuter",
     d:`Neuer Entwurf „Versorgungskapsel“. Quader <b>40 × 40 × 30</b> mm.`},
    {t:"Aushöhlen", sk:"boxHollow",
     d:`Quader als <b>Bohrung</b>: <b>36 × 36 × 30</b> mm, anheben auf <b>2</b> mm. Tippe Außenkörper und Bohrung nacheinander an, <b>Ausrichten</b> mittig (Breite und Tiefe), dann <b>gruppieren</b> und den Gruppentyp auf <b>„Vereinigung“</b> stellen. Jetzt hat die Box 2 mm dicke Wände und einen 2 mm dicken Boden.`,
     tip:`Warum 36? Die Box ist 40 breit, links und rechts je 2 mm Wand: 40 − 2 − 2 = 36.`},
    {t:"Die Deckelplatte", sk:"lid",
     d:`Neben der Box: Quader <b>40 × 40 × 2</b> mm – das ist die Deckelplatte.`},
    {t:"Der Deckel-Rand mit Spiel", sk:"tolerance", shot:"s14-fangraster",
     d:`Der Deckel braucht einen Rand, der in die Öffnung steckt. Die Öffnung ist 36 mm. Wenn der Rand auch 36 mm hätte, würde er klemmen! Darum planen wir <b>0,3 mm Spiel</b> auf jeder Seite: 36 − 0,3 − 0,3 = <b>35,4 mm</b>. Quader <b>35,4 × 35,4 × 4</b> mm, anheben auf <b>2</b> mm, mit der Deckelplatte mittig ausrichten, gruppieren.`,
     tip:`Kommazahlen tippst du mit Punkt oder Komma ein – probiere 35.4. Wenn die Form beim Verschieben immer auf ganze Millimeter springt: unten rechts das <b>„Fangraster“</b> von 1,0 mm auf 0,1 mm stellen.`},
    {t:"Probe-Aufsetzen", sk:"lidFit",
     d:`Dupliziere den Deckel, drehe die Kopie mit den gebogenen Pfeilen um <b>180°</b> und setze sie auf die Box (anheben auf 32 mm). Schau von der Seite: Der Rand steckt in der Öffnung. Lösche die Kopie danach wieder – gedruckt werden Box und Deckel <b>getrennt</b>, beide mit der flachen Seite nach unten.`}
  ],
  check:["Die Box hat 2 mm Wände und 2 mm Boden","Der Deckel-Rand ist 35,4 mm (0,3 mm Spiel je Seite)","Box und Deckel liegen beide flach auf der Arbeitsebene"],
  know:{t:"Wandstärke und Füllung", sk:"infill",
    d:`Wie stabil wird ein Teil? Zwei Dinge entscheiden: Die <b>Wandstärke</b> – mindestens etwa <b>1,2 mm</b>, besser 2 mm, sonst wird es wabbelig. Und die <b>Füllung</b> (englisch Infill): Der Drucker füllt das Innere eines Teils nicht komplett, sondern mit einem Wabenmuster, zum Beispiel 15 bis 20 Prozent. Das spart viel Material und ist trotzdem stabil – wie bei Bienenwaben.`},
  quiz:[
    {q:"Die Box ist 40 mm breit, die Wände sollen 2 mm dick sein. Wie breit ist die Bohrung innen?", o:["36 mm","38 mm","40 mm"], a:0, e:"Links 2 mm und rechts 2 mm Wand: 40 − 2 − 2 = 36 mm."},
    {q:"Warum bekommt der Deckel-Rand 0,3 mm Spiel je Seite?", o:["Damit er nicht klemmt, gedruckte Teile sind nie ganz exakt","Damit er wackelt","Damit er schneller druckt"], a:0, e:"Gedruckte Teile sind ein bisschen ungenau. Ohne Spiel passen zwei Teile oft nicht ineinander."},
    {q:"Was ist die „Füllung“ (Infill)?", o:["Ein Wabenmuster im Inneren des Teils","Die Farbe des Teils","Der Kleber auf dem Druckbett"], a:0, e:"Der Drucker füllt das Innere nur teilweise mit einem Muster – das spart Material."},

/* =========================================================
   SKIZZEN – isometrische Zeichnungen im Tinkercad-Stil (SVG, keine Bilddateien)
   P(x,y,z) rechnet Millimeter in Bildpunkte um. x läuft nach rechts unten,
   y nach links unten, z nach oben. Neue Skizze: Funktion in SK ergänzen.
   ========================================================= */
const COL = {red:"#e5533d", blue:"#3b8fd9", yellow:"#f2c230", green:"#45b26b", purple:"#9b6bd6", orange:"#f08a2c", teal:"#23a6a6", grey:"#9aa3ad"};
function shade(hex, f){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  const m = v => Math.max(0, Math.min(255, Math.round(f>1 ? v+(255-v)*(f-1) : v*f)));
  return "#" + [m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function V(ox, oy, s){ return {ox, oy, s, out:[]}; }
function P(o,x,y,z){ return [o.ox + (x-y)*0.866*o.s, o.oy + (x+y)*0.5*o.s - z*o.s]; }
function pts(arr){ return arr.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "); }
function poly(o, ptsArr, fill, extra){ o.out.push(`<polygon points="${pts(ptsArr)}" fill="${fill}" stroke="#20324a" stroke-width="1" stroke-linejoin="round" ${extra||""}/>`); }
function holeStyle(){ return `fill-opacity="0.35" stroke-dasharray="3 2"`; }
function box(o,x,y,z,w,d,h,col,hole){
  const c = hole ? COL.grey : col, ex = hole ? holeStyle() : "";
  poly(o,[P(o,x+w,y,z),P(o,x+w,y+d,z),P(o,x+w,y+d,z+h),P(o,x+w,y,z+h)], shade(c,.82), ex);
  poly(o,[P(o,x,y+d,z),P(o,x+w,y+d,z),P(o,x+w,y+d,z+h),P(o,x,y+d,z+h)], shade(c,.66), ex);
  poly(o,[P(o,x,y,z+h),P(o,x+w,y,z+h),P(o,x+w,y+d,z+h),P(o,x,y+d,z+h)], shade(c,1.18), ex);
}
function cyl(o,cx,cy,z,r,h,col,hole){
  const c = hole ? COL.grey : col, ex = hole ? holeStyle() : "";
  const B = P(o,cx,cy,z), T = P(o,cx,cy,z+h), rx = 1.2247*r*o.s, ry = 0.7071*r*o.s;
  o.out.push(`<path d="M${(B[0]-rx).toFixed(1)},${B[1].toFixed(1)} L${(T[0]-rx).toFixed(1)},${T[1].toFixed(1)} L${(T[0]+rx).toFixed(1)},${T[1].toFixed(1)} L${(B[0]+rx).toFixed(1)},${B[1].toFixed(1)} A${rx.toFixed(1)},${ry.toFixed(1)} 0 0 1 ${(B[0]-rx).toFixed(1)},${B[1].toFixed(1)} Z" fill="${shade(c,.78)}" stroke="#20324a" stroke-width="1" ${ex}/>`);
  o.out.push(`<ellipse cx="${T[0].toFixed(1)}" cy="${T[1].toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${shade(c,1.15)}" stroke="#20324a" stroke-width="1" ${ex}/>`);
}
function cone(o,cx,cy,z,r,h,col){
  const B = P(o,cx,cy,z), A = P(o,cx,cy,z+h), rx = 1.2247*r*o.s, ry = 0.7071*r*o.s;
  o.out.push(`<path d="M${(B[0]-rx).toFixed(1)},${B[1].toFixed(1)} L${A[0].toFixed(1)},${A[1].toFixed(1)} L${(B[0]+rx).toFixed(1)},${B[1].toFixed(1)} A${rx.toFixed(1)},${ry.toFixed(1)} 0 0 1 ${(B[0]-rx).toFixed(1)},${B[1].toFixed(1)} Z" fill="${shade(col,.9)}" stroke="#20324a" stroke-width="1"/>`);
}
function grid(o,x0,y0,x1,y1,step){
  const g = [];
  poly(o,[P(o,x0,y0,0),P(o,x1,y0,0),P(o,x1,y1,0),P(o,x0,y1,0)],"#dbe9f7");
  for(let x=x0; x<=x1+0.01; x+=step){ const a=P(o,x,y0,0), b=P(o,x,y1,0); g.push(`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`); }
  for(let y=y0; y<=y1+0.01; y+=step){ const a=P(o,x0,y,0), b=P(o,x1,y,0); g.push(`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`); }
  o.out.push(`<g stroke="#8fb3d9" stroke-width=".6">${g.join("")}</g>`);
}
function isoText(o,x,y,z,str,size,col,hole){
  const p = P(o,x,y,z), s = o.s;
  o.out.push(`<text transform="matrix(${(.866*s).toFixed(3)} ${(.5*s).toFixed(3)} ${(-.866*s).toFixed(3)} ${(.5*s).toFixed(3)} ${p[0].toFixed(1)} ${p[1].toFixed(1)})" font-family="Nunito,sans-serif" font-weight="900" font-size="${size}" fill="${hole?"#5c6670":col}" ${hole?'fill-opacity=".55"':""} stroke="#20324a" stroke-width="${(0.6/s).toFixed(2)}">${str}</text>`);
}
function lbl(o,x,y,t,anchor,col){ o.out.push(`<text x="${x}" y="${y}" font-family="Nunito,sans-serif" font-size="12" font-weight="800" fill="${col||"#20324a"}" text-anchor="${anchor||"start"}">${t}</text>`); }
function arrow(o,x1,y1,x2,y2,col){ const c=col||"#d9442f"; o.out.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" marker-end="url(#ah)"/>`); }
function raw(o,s){ o.out.push(s); }
function svg(o, w, h, title){
  return `<svg class="sk" viewBox="0 0 ${w||320} ${h||200}" role="img" aria-label="${title||"Skizze"}"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9442f"/></marker></defs>${o.out.join("")}</svg>`;
}

function sketch(name){ try{ return SK[name] ? SK[name]() : ""; }catch(e){ return ""; } }

<script>
/* =========================================================
   SPIELSTAND (localStorage, Schlüssel raumstation-3d-v1)
   ========================================================= */
const KEY = "raumstation-3d-v1";
function defaultState(){ return {ver:1, xp:0, m:{}, weak:{}, reviews:0, rank:0}; }
function load(){
  let s = null; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!s || typeof s!=="object") s = defaultState();
  const d = defaultState(); for(const k in d) if(!(k in s)) s[k] = d[k];
  if(typeof s.xp!=="number") s.xp = 0;
  if(!s.m || typeof s.m!=="object") s.m = {};
  if(!s.weak || typeof s.weak!=="object") s.weak = {};
  return s;
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function MS(id){
  const m = MISSIONS.find(x=>x.id===id);
  if(!S.m[id]) S.m[id] = {phase:0, max:0, steps:[], checks:[], quizBest:0, quizDone:false, done:false};
  const st = S.m[id];
  if(!Array.isArray(st.steps)) st.steps = [];
  if(!Array.isArray(st.checks)) st.checks = [];
  return st;
}
function idx(id){ return MISSIONS.findIndex(m=>m.id===id); }
function unlocked(i){ return i===0 || !!(S.m[MISSIONS[i-1].id] && S.m[MISSIONS[i-1].id].done); }
function doneCount(){ return MISSIONS.filter(m=>S.m[m.id] && S.m[m.id].done).length; }
function curMission(){ const i = MISSIONS.findIndex((m,i)=>unlocked(i) && !(S.m[m.id]&&S.m[m.id].done)); return i; }
function rankIdx(){ let r = 0; RANKS.forEach((x,i)=>{ if(S.xp>=x[0]) r=i; }); return r; }
function rankName(){ return RANKS[rankIdx()][1]; }
function addXP(n){
  const before = rankIdx(); S.xp += n; const after = rankIdx(); save();
  if(after>before) toast("🎖️ Beförderung! Du bist jetzt " + RANKS[after][1] + "!");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(t){ const d = document.createElement("div"); d.className="toast"; d.innerHTML=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const app = document.getElementById("app");
function go(html){ app.innerHTML = html; window.scrollTo(0,0); }

function head(){
  return `<header><div class="brand" onclick="showHome()"><div class="logo">🛰️</div><div><h1>ORION-7</h1><span class="sub">3D-Werkstatt · Tinkercad</span></div></div>
    <div class="hud"><span class="badge">🎖️ ${esc(rankName())}</span><span class="badge">⚡ ${S.xp} XP</span><span class="badge">🔧 ${doneCount()}/${MISSIONS.length}</span></div></header>`;
}

/* =========================================================
   STATION (Startbildschirm)
   ========================================================= */
function stationSVG(){
  const cur = curMission();
  const P2 = id => STATION_POS[id];
  const links = [["m5","m2"],["m2","m9"],["m9","m8"],["m9","m3"],["m9","m1"],["m9","m4"],["m9","m6"],["m9","m7"],["m1","m2"],["m4","m2"]];
  let s = `<svg viewBox="0 0 100 100" aria-label="Raumstation ORION-7">
    <defs><radialGradient id="glow"><stop offset="0" stop-color="#9ff0fa" stop-opacity=".55"/><stop offset="1" stop-color="#9ff0fa" stop-opacity="0"/></radialGradient></defs>`;
  /* Solarflügel-Deko */
  const m6done = S.m.m6 && S.m.m6.done;
  [[-1],[1]].forEach(([d])=>{ const x = d<0 ? 0 : 100; for(let r=0;r<2;r++) for(let c=0;c<3;c++){
    s += `<rect x="${(d<0? 1+c*5.2 : 83.4+c*5.2)}" y="${40+r*5.4 - (r?0:0)}" width="4.6" height="4.6" fill="${m6done?"#2a7fb8":"#26313f"}" stroke="${m6done?"#9ff0fa":"#4a5868"}" stroke-width=".3"/>`;
    s += `<rect x="${(d<0? 1+c*5.2 : 83.4+c*5.2)}" y="${69+r*5.4}" width="4.6" height="4.6" fill="${m6done?"#2a7fb8":"#26313f"}" stroke="${m6done?"#9ff0fa":"#4a5868"}" stroke-width=".3"/>`; } });
  links.forEach(([a,b])=>{ const A=P2(a), B=P2(b); const lit = S.m[a]&&S.m[a].done && S.m[b]&&S.m[b].done;
    s += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${lit?"#45d4e6":"#33414f"}" stroke-width="${lit?1.6:1.2}" stroke-linecap="round"/>`; });
  s += `<circle cx="50" cy="57" r="27" fill="none" stroke="#2a3a4c" stroke-width=".8" stroke-dasharray="1.5 1.5"/>`;
  MISSIONS.forEach((m,i)=>{
    const [x,y] = P2(m.id), st = S.m[m.id], done = st && st.done, open = unlocked(i), isCur = i===cur;
    const r = m.id==="m9" ? 9.5 : 7.2;
    const fill = done ? "#14435a" : open ? "#1d2a3a" : "#151c26";
    const ring = done ? "#45d4e6" : isCur ? "#f2c230" : open ? "#6c8aa6" : "#3a4654";
    s += `<g class="mod ${open?"":"locked"} ${isCur?"cur":""}" onclick="${open?`openMission('${m.id}')`:""}">
      ${done?`<circle cx="${x}" cy="${y}" r="${r+5}" fill="url(#glow)"/>`:""}
      <circle class="ring" cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${ring}" stroke-width="2.2"/>
      <text x="${x}" y="${y+ (m.id==="m9"?2.6:2.2)}" text-anchor="middle" font-size="${m.id==="m9"?7.5:6}" ${open?"":'opacity=".35"'}>${open?m.icon:"🔒"}</text>
      ${open?`<text x="${x}" y="${y+r+4.2}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="3.2" fill="${done?"#9ff0fa":"#c9d6e2"}">${esc(m.module)}</text>`:""}
      ${done?`<circle cx="${x+r*.72}" cy="${y-r*.72}" r="2.4" fill="#4fbf74"/><text x="${x+r*.72}" y="${y-r*.72+1.2}" text-anchor="middle" font-size="3" font-weight="900" fill="#06220f">✓</text>`:""}
    </g>`;
  });
  return s + `</svg>`;
}
function showHome(){
  const cur = curMission(), m = cur>=0 ? MISSIONS[cur] : null, dc = doneCount();
  const intro = dc===0 && !(S.m.m1 && S.m.m1.max>0);
  go(head() + `
    <div class="card"><div class="kepler"><div class="av">🤖</div><div class="bubble">${
      intro ? `Hallo Kadett! Ich bin <b>KEPLER</b>, der Bordcomputer von ORION-7. Ein Meteoritenschauer hat unsere Station beschädigt. Mit dem Konstruktions-Programm <b>Tinkercad</b> und unserem <b>Replikator</b> (einem 3D-Drucker) reparieren wir sie Modul für Modul. Tippe auf das leuchtende Modul!`
      : m ? `Nächster Auftrag: <b>${esc(m.module)}</b> – „${esc(m.title)}“. Tippe auf das gelb blinkende Modul.`
      : `Die ganze Station läuft wieder – dank dir, <b>Kommandant</b>! Du kannst jede Mission wiederholen, in der Wartungsrunde dein Wissen auffrischen oder dir neue Erfindungen ausdenken.`
    }</div></div></div>
    <div class="station">${stationSVG()}</div>
    <div class="btnRow center">
      ${m ? `<button class="btn" onclick="openMission('${m.id}')">${m.icon} Mission ${cur+1} starten</button>` : ""}
      <button class="btn ghost" onclick="showReview()" ${dc?"":"disabled"}>🛠️ Wartungsrunde</button>
      <button class="btn ghost" onclick="showLog()">📖 Logbuch</button>
    </div>
    <div class="card"><div class="hint-sm"><b>So geht's:</b> Öffne auf dem iPad <b>Tinkercad und diese Seite nebeneinander</b> (geteilte Ansicht: am oberen Rand auf die drei Punkte tippen). Links liest du die Anleitung, rechts baust du. Für jede Mission gibt es XP – und mit genug XP wirst du befördert: ${RANKS.map(r=>r[1]).join(" → ")}.</div>
    <div class="bar" style="margin-top:10px"><i style="width:${Math.round(dc/MISSIONS.length*100)}%"></i></div></div>
    <div class="btnRow center"><button class="btn ghost small" onclick="showParents()">⚙️ Für Eltern &amp; Sicherung</button>
      <a class="btn ghost small" href="faecher.html">🏠 Alle Fächer</a></div>`);
}

/* =========================================================
   MISSION – Phasen: 0 Briefing · 1..n Schritte · Wissen · Quiz · Check · Erfolg
   ========================================================= */
let Q = null;   /* laufendes Quiz */
function phases(m){ return 1 + m.steps.length + 3; }   /* Briefing + Schritte + Wissen + Quiz + Check */
function phaseName(m,p){
  if(p===0) return "Auftrag";
  if(p<=m.steps.length) return "Schritt " + p + " von " + m.steps.length;
  if(p===m.steps.length+1) return "Replikator-Wissen";
  if(p===m.steps.length+2) return "Funk-Quiz";
  return "Abschluss-Check";
}
function openMission(id){ const st = MS(id); showPhase(id, st.done ? 0 : Math.min(st.phase, phases(MISSIONS[idx(id)])-1)); }
function progBar(m, st, p){
  let h = `<div class="prog">`;
  for(let i=0;i<phases(m);i++){ const reach = i<=st.max;
    h += `<i class="${i===p?"c":(reach?"d":"")}" ${reach?`onclick="showPhase('${m.id}',${i})"`:""} title="${esc(phaseName(m,i))}"></i>`; }
  return h + `</div>`;
}
function shotHTML(id){ if(!id || !SHOTS[id]) return ""; return `<img class="shot" src="assets/tc-${id}.jpg" alt="${esc(SHOTS[id])}" onerror="this.remove()">`; }
function showPhase(id, p){
  const m = MISSIONS[idx(id)], st = MS(id), n = m.steps.length;
  st.phase = p; if(p>st.max) st.max = p; save();
  let body = "";
  const top = `<div class="card"><div class="phaseLbl">${m.icon} Mission ${idx(id)+1} · ${esc(m.module)} · ${esc(phaseName(m,p))}</div>${progBar(m,st,p)}`;
  if(p===0){
    body = top + `<div class="stepH">${esc(m.title)}</div>
      <div class="kepler"><div class="av">🤖</div><div class="bubble">${m.story}</div></div>
      <div style="margin-top:12px" class="hint-sm"><b>Ziel:</b> ${esc(m.goal)}</div>
      <div style="margin-top:8px">${m.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>
      <div class="btnRow split"><button class="btn ghost" onclick="showHome()">← Station</button>
      <button class="btn" onclick="showPhase('${id}',1)">${st.done?"Schritte ansehen":"Los geht's"} →</button></div></div>`;
  } else if(p<=n){
    const s = m.steps[p-1], did = !!st.steps[p-1];
    body = top + `<div class="stepH">${p}. ${esc(s.t)}</div>
      <div class="lead">${s.d}</div>
      ${s.sk ? `<div class="skBox">${sketch(s.sk)}</div>` : ""}
      ${shotHTML(s.shot)}
      ${s.tip ? `<details class="tip"><summary>💡 Klappt nicht? Tipp von KEPLER</summary><div>${s.tip}</div></details>` : ""}
      <div class="btnRow split"><button class="btn ghost" onclick="showPhase('${id}',${p-1})">← Zurück</button>
      <button class="btn ${did?"ghost":"ok"}" onclick="stepDone('${id}',${p})">${did?"Weiter →":"✓ Geschafft!"}</button></div></div>`;
  } else if(p===n+1){
    body = top + `<div class="stepH">🔬 ${esc(m.know.t)}</div>
      <div class="lead">${m.know.d}</div>
      ${m.know.sk ? `<div class="skBox">${sketch(m.know.sk)}</div>` : ""}
      <div class="btnRow split"><button class="btn ghost" onclick="showPhase('${id}',${p-1})">← Zurück</button>
      <button class="btn" onclick="startQuiz('${id}')">Zum Funk-Quiz →</button></div></div>`;
  } else if(p===n+2){
    if(!Q || Q.id!==id){ startQuiz(id); return; }
    body = top + quizHTML() + `</div>`;
  } else {
    if(!st.quizDone){ showPhase(id, n+2); return; }
    const all = m.check.every((_,i)=>st.checks[i]);
    body = top + `<div class="stepH">✅ Abschluss-Check</div>
      <div class="hint-sm">Schau dir dein Modell in Tinkercad an und hake ehrlich ab, was stimmt. ${m.id==="m9"?"Das ist der Druck-Check eines echten Ingenieurs!":""}</div>
      ${m.check.map((c,i)=>`<div class="chk ${st.checks[i]?"on":""}" onclick="toggleCheck('${id}',${i})"><div class="bx">${st.checks[i]?"✓":""}</div><div>${esc(c)}</div></div>`).join("")}
      <div class="btnRow split"><button class="btn ghost" onclick="showPhase('${id}',${p-1})">← Zurück</button>
      <button class="btn ok" onclick="finishMission('${id}')" ${all?"":"disabled"}>${st.done?"Fertig ✓":"🔧 Modul reparieren!"}</button></div></div>`;
  }
  go(head() + body);
}
function stepDone(id, p){
  const st = MS(id);
  if(!st.steps[p-1]){ st.steps[p-1] = true; addXP(10); }
  save(); showPhase(id, p+1);
}
function toggleCheck(id, i){ const st = MS(id); st.checks[i] = !st.checks[i]; save(); showPhase(id, st.phase); }
function finishMission(id){
  const m = MISSIONS[idx(id)], st = MS(id), first = !st.done;
  st.done = true; save();
  if(first) addXP(100);
  const next = MISSIONS[idx(id)+1];
  go(head() + `<div class="card center"><div class="win">${m.icon}</div>
    <div class="stepH">${esc(m.module)} repariert!</div>
    <div class="lead">${first ? `+100 XP · Das Modul <b>${esc(m.module)}</b> leuchtet wieder.` : `Gut gemacht – Mission wiederholt.`}</div>
    ${next ? `<div class="hint-sm" style="margin-top:8px">Neuer Auftrag freigeschaltet: <b>${next.icon} ${esc(next.module)}</b></div>` : `<div class="lead" style="margin-top:10px">🌟 <b>Alle Module laufen!</b> Du hast ORION-7 komplett repariert. Ab jetzt ist jede eigene Erfindung eine neue Mission.</div>`}
    <div class="btnRow center"><button class="btn" onclick="showHome()">🛰️ Zur Station</button>${next?`<button class="btn ghost" onclick="openMission('${next.id}')">Nächste Mission →</button>`:""}</div></div>`);
}

/* ---------- Quiz ---------- */
function qKey(mid, i){ return mid + ":" + i; }
function startQuiz(id){
  const m = MISSIONS[idx(id)];
  Q = {id, mode:"mission", list: shuffle(m.quiz.map((q,i)=>({mid:id, i, q}))), pos:0, right:0, picked:null};
  prepQ(); showPhase(id, m.steps.length+2);
}
function prepQ(){ const it = Q.list[Q.pos]; it.order = shuffle(it.q.o.map((_,k)=>k)); Q.picked = null; }
function quizHTML(){
  const it = Q.list[Q.pos], q = it.q, ans = Q.picked!==null;
  let h = `<div class="stepH">📡 Frage ${Q.pos+1} von ${Q.list.length}</div><div class="lead"><b>${esc(q.q)}</b></div>`;
  it.order.forEach(k=>{
    let cls = ""; if(ans){ if(k===q.a) cls="right"; else if(k===Q.picked) cls="wrong"; }
    h += `<button class="opt ${cls}" onclick="pick(${k})" ${ans?"disabled":""}>${esc(q.o[k])}</button>`;
  });
  if(ans){
    const ok = Q.picked===q.a;
    h += `<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Richtig!":"Nicht ganz."}</b> ${esc(q.e)}</div>
      <div class="btnRow center"><button class="btn" onclick="nextQ()">${Q.pos+1<Q.list.length?"Nächste Frage →":"Auswertung →"}</button></div>`;
  }
  return h;
}
function pick(k){
  if(Q.picked!==null) return;
  const it = Q.list[Q.pos], ok = k===it.q.a, key = qKey(it.mid, it.i);
  Q.picked = k;
  if(ok){ Q.right++; addXP(Q.mode==="review"?5:10); if(S.weak[key]){ S.weak[key]--; if(S.weak[key]<=0) delete S.weak[key]; } }
  else { S.weak[key] = (S.weak[key]||0) + 2; }
  save();
  if(Q.mode==="review") renderReview(); else showPhase(Q.id, MISSIONS[idx(Q.id)].steps.length+2);
}
function nextQ(){
  Q.pos++;
  if(Q.pos < Q.list.length){ prepQ(); if(Q.mode==="review") renderReview(); else showPhase(Q.id, MISSIONS[idx(Q.id)].steps.length+2); return; }
  if(Q.mode==="review"){ endReview(); return; }
  const id = Q.id, m = MISSIONS[idx(id)], st = MS(id), r = Q.right, n = Q.list.length, pass = r >= Math.ceil(n*0.75);
  st.quizBest = Math.max(st.quizBest||0, r); if(pass) st.quizDone = true; save();
  const p = m.steps.length+2;
  go(head() + `<div class="card"><div class="phaseLbl">${m.icon} Mission ${idx(id)+1} · Funk-Quiz</div>${progBar(m,st,p)}
    <div class="center"><div class="win">${pass?"📡":"📻"}</div><div class="stepH">${r} von ${n} richtig</div>
    <div class="lead">${pass ? "Funkverbindung steht! Jetzt noch der Abschluss-Check." : `Für die Funkverbindung brauchst du mindestens ${Math.ceil(n*0.75)} richtige Antworten. Lies dir die Erklärungen noch einmal durch – dann klappt es!`}</div></div>
    <div class="btnRow split"><button class="btn ghost" onclick="Q=null;showPhase('${id}',${p-1})">← Wissen</button>
    ${pass ? `<button class="btn" onclick="Q=null;showPhase('${id}',${p+1})">Zum Check →</button>` : `<button class="btn" onclick="startQuiz('${id}')">🔁 Nochmal</button>`}</div></div>`);
  Q = pass ? null : Q;
}

/* ---------- Wartungsrunde (Wiederholung) ---------- */
function showReview(){
  const pool = [];
  MISSIONS.forEach(m=>{ if(S.m[m.id] && S.m[m.id].done) m.quiz.forEach((q,i)=>pool.push({mid:m.id, i, q, w:1+(S.weak[qKey(m.id,i)]||0)*2})); });
  if(!pool.length){ showHome(); return; }
  const pickList = [], bag = pool.slice();
  while(pickList.length < Math.min(6,pool.length) && bag.length){
    const tot = bag.reduce((a,b)=>a+b.w,0); let r = Math.random()*tot, k = 0;
    for(; k<bag.length; k++){ r -= bag[k].w; if(r<=0) break; }
    pickList.push(bag.splice(Math.min(k,bag.length-1),1)[0]);
  }
  Q = {mode:"review", list:pickList, pos:0, right:0, picked:null}; prepQ(); renderReview();
}
function renderReview(){
  const it = Q.list[Q.pos], m = MISSIONS[idx(it.mid)];
  go(head() + `<div class="card"><div class="phaseLbl">🛠️ Wartungsrunde · aus Mission ${idx(it.mid)+1} (${esc(m.module)})</div>
    <div class="prog">${Q.list.map((_,i)=>`<i class="${i<Q.pos?"d":i===Q.pos?"c":""}"></i>`).join("")}</div>${quizHTML()}</div>
    <div class="btnRow center"><button class="btn ghost small" onclick="Q=null;showHome()">Abbrechen</button></div>`);
}
function endReview(){
  const r = Q.right, n = Q.list.length; S.reviews = (S.reviews||0)+1; if(r===n) addXP(20); save(); Q = null;
  go(head() + `<div class="card center"><div class="win">🛠️</div><div class="stepH">Wartung abgeschlossen: ${r} von ${n}</div>
    <div class="lead">${r===n?"Alles fehlerfrei – +20 XP Bonus!":"Fragen, die noch nicht saßen, kommen in der nächsten Wartungsrunde öfter dran."}</div>
    <div class="btnRow center"><button class="btn" onclick="showReview()">Noch eine Runde</button><button class="btn ghost" onclick="showHome()">🛰️ Station</button></div></div>`);
}

/* ---------- Logbuch ---------- */
function showLog(){
  let h = head() + `<div class="sectionTitle">📖 Logbuch des Ingenieurs</div><div class="hint-sm">Hier sammelst du das Replikator-Wissen jeder Mission, die du erreicht hast.</div>`;
  MISSIONS.forEach((m,i)=>{
    const st = S.m[m.id], seen = st && st.max >= m.steps.length+1;
    h += seen ? `<div class="card"><div class="phaseLbl">${m.icon} ${esc(m.module)}</div><div class="stepH">${esc(m.know.t)}</div><div class="lead">${m.know.d}</div>${m.know.sk?`<div class="skBox">${sketch(m.know.sk)}</div>`:""}</div>`
      : `<div class="card" style="opacity:.55"><div class="phaseLbl">🔒 Mission ${i+1}</div><div class="hint-sm">Noch nicht entdeckt.</div></div>`;
  });
  go(h + `<div class="btnRow center"><button class="btn" onclick="showHome()">🛰️ Station</button></div>`);
}

/* ---------- Für Eltern ---------- */
function showParents(){
  const rows = MISSIONS.map((m,i)=>{ const st = S.m[m.id]||{}; const steps = (st.steps||[]).filter(Boolean).length;
    return `<div class="row"><div class="ic">${m.icon}</div><div class="tx"><b>${i+1}. ${esc(m.title)}</b><div class="hint-sm">Schritte ${steps}/${m.steps.length} · Quiz bestes Ergebnis ${st.quizBest||0}/${m.quiz.length}</div></div>
      <span class="pill ${st.done?"ok":"no"}">${st.done?"fertig":unlocked(i)?"offen":"gesperrt"}</span></div>`; }).join("");
  const shots = Object.keys(SHOTS).map(k=>`<div class="row"><div class="ic">📷</div><div class="tx"><b>tc-${k}.jpg</b><div class="hint-sm">${esc(SHOTS[k])}</div></div><span class="pill no" id="st-${k}">…</span></div>`).join("");
  go(head() + `<div class="sectionTitle">⚙️ Für Eltern</div>
    <div class="card"><b>Lernstand</b>${rows}<div class="hint-sm" style="margin-top:8px">Wartungsrunden gespielt: ${S.reviews||0} · Fragen, die öfter wiederholt werden: ${Object.keys(S.weak).length}</div></div>
    <div class="card"><b>Tinkercad einrichten</b><div class="hint-sm" style="margin-top:6px">Tinkercad ist kostenlos (App Store: „Tinkercad“). Für Kinder unter 13 Jahren richtet ein Elternteil oder die Schule das Konto ein. Die Missionen sind nach der iPad-App (Stand November 2026) geschrieben. Bei App-Updates können sich Symbole oder Namen ändern.</div></div>
    <div class="card"><b>iPad-Bilder</b><div class="hint-sm" style="margin:6px 0 4px">Echte Bildschirmfotos der Tinkercad-iPad-App liegen als <code>assets/tc-&lt;Name&gt;.jpg</code> im Ordner <code>assets</code>. Sie erscheinen automatisch im passenden Schritt (zusätzlich zur Skizze). Fehlt ein Bild, wird nur die Skizze gezeigt.</div>${shots}</div>
    ${mbCard()}
    <div class="card"><b>Spielstand dieser App</b><div class="btnRow"><button class="btn ghost small" onclick="resetAll()">🗑 Alles zurücksetzen</button></div></div>
    <div class="btnRow center"><button class="btn" onclick="showHome()">🛰️ Station</button></div>`);
  Object.keys(SHOTS).forEach(k=>{ const im = new Image(); const set = (ok)=>{ const e = document.getElementById("st-"+k); if(e){ e.textContent = ok?"vorhanden":"fehlt"; e.className = "pill " + (ok?"ok":"no"); } };
    im.onload = ()=>set(true); im.onerror = ()=>set(false); im.src = "assets/tc-"+k+".jpg"; });
}
function resetAll(){
  if(!window.confirm("Wirklich den ganzen Fortschritt der Raumstation löschen?")) return;
  S = defaultState(); save(); showHome();
}

showHome();
</script>
<script>
/* =========================================================
   GESAMTSICHERUNG – alle Lern-Apps auf einmal sichern / zurückspielen
   Identischer Block in allen fünf Apps. Liest und schreibt nur die bekannten Speicherschlüssel
   (gleicher Ordner = gleicher Browser-Speicher). Ändert nichts an den einzelnen Spielständen,
   solange man nicht ausdrücklich "einspielen" wählt.
   ========================================================= */
const MB_FORMAT = "lernwelt-gesamtsicherung";
const MB_APPS = [
  ["englisch-abenteuer-v4","🇬🇧 Englisch-Abenteuer"],
  ["mittelerde-reise-v1","⚔️ Mittelerde-Reise"],
  ["paris-abenteuer-v1","🇫🇷 Paris-Abenteuer"],
  ["faecher-v1","🌍 Fächer (Lernstand)"],
  ["faecher-packs-v1","🌍 Fächer (eigene Themenpakete)"],
  ["raumstation-3d-v1","🛰️ Raumstation (3D-Werkstatt)"]
];
function mbStore(){ try{ return window.localStorage; }catch(e){ return null; } }
function mbMsg(html, ok){
  const b = document.getElementById("mbMsg"); if(!b) return;
  b.style.display = "block"; b.style.borderColor = ok ? "rgba(90,154,90,.7)" : "rgba(192,69,58,.7)"; b.innerHTML = html;
}
function mbFileName(){ return "Lernwelt_Gesamtsicherung_" + new Date().toISOString().slice(0,10) + ".json"; }
function mbInfo(key, raw){
  try{ const o = JSON.parse(raw); if(key==="faecher-packs-v1") return Array.isArray(o) ? o.length+" Paket(e)" : "";
       return (o && typeof o.xp==="number") ? o.xp+" XP" : ""; }catch(e){ return ""; }
}
function mbCollect(){
  const ls = mbStore(), data = {}, found = [], missing = [];
  MB_APPS.forEach(a=>{
    let v = null; try{ v = ls ? ls.getItem(a[0]) : null; }catch(e){}
    if(v){ data[a[0]] = v; found.push(a[1] + (mbInfo(a[0],v) ? " (" + mbInfo(a[0],v) + ")" : "")); }
    else if(a[0]!=="faecher-packs-v1") missing.push(a[1]);
  });
  return {obj:{format:MB_FORMAT, version:1, created:new Date().toISOString(), data}, found, missing};
}
function mbSummary(c){
  return "<b>Enthalten:</b> " + (c.found.length ? c.found.join(" · ") : "nichts")
    + (c.missing.length ? '<br><span style="opacity:.85">Noch kein Spielstand vorhanden: ' + c.missing.join(", ") + '</span>' : "");
}
async function mbShare(){
  const c = mbCollect();
  if(!c.found.length){ mbMsg("⚠ Es gibt noch keinen Spielstand zum Sichern.", false); return; }
  const txt = JSON.stringify(c.obj);
  try{
    const file = new File([txt], mbFileName(), {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:mbFileName()});
      mbMsg('✅ Wähle im Teilen-Menü <b>„In Dateien sichern“</b>.<br>' + mbSummary(c), true); return;
    }
  }catch(e){ if(e && e.name==="AbortError"){ mbMsg("Abgebrochen – es wurde nichts gespeichert.", false); return; } }
  mbDownload();
}
function mbDownload(){
  const c = mbCollect();
  if(!c.found.length){ mbMsg("⚠ Es gibt noch keinen Spielstand zum Sichern.", false); return; }
  try{
    const blob = new Blob([JSON.stringify(c.obj)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = mbFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    mbMsg('✅ Download gestartet: <b>' + mbFileName() + '</b> – zu finden unter <b>Dateien → Downloads</b>.<br>' + mbSummary(c), true);
  }catch(e){ mbMsg('⚠ Der Download hat nicht geklappt. Nutze bitte <b>„📋 Als Text“</b>.', false); }
}
function mbShowText(){
  const c = mbCollect();
  mbMsg('📋 Kopiere diesen Text und sichere ihn z. B. in einer Notiz. Zum Wiederherstellen hier einfügen und „Übernehmen“ tippen.<br>' + mbSummary(c), true);
  const t = document.getElementById("mbText"); if(!t) return;
  t.innerHTML = '<textarea id="mbBox" style="width:100%;height:110px;margin-top:8px;font-size:11px;border-radius:8px;padding:8px;background:rgba(0,0,0,.4);color:inherit;border:1px solid rgba(200,200,200,.4)"></textarea>'
    + '<div class="btnRow" style="margin:8px 0 0"><button class="btn ghost" onclick="mbCopy()">📋 Kopieren</button><button class="btn ghost" onclick="mbApplyText()">✔ Übernehmen</button></div>';
  const bx = document.getElementById("mbBox"); if(bx) bx.value = c.found.length ? JSON.stringify(c.obj) : "";
}
function mbCopy(){
  const b = document.getElementById("mbBox"); if(!b) return;
  b.select(); try{ b.setSelectionRange(0, 999999); }catch(e){}
  try{ navigator.clipboard.writeText(b.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
}
function mbApplyText(){ const b = document.getElementById("mbBox"); if(b) mbRestore(b.value); }
function mbPickFile(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = ()=>{ const f = inp.files && inp.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>mbRestore(String(rd.result)); rd.readAsText(f); };
  inp.click();
}
function mbRestore(text){
  let o; try{ o = JSON.parse(text); }catch(e){ o = null; }
  if(!o || o.format!==MB_FORMAT || typeof o.data!=="object" || !o.data){ mbMsg("⚠ Das ist keine Gesamtsicherung. (Einzelne Spielstände lädst du in der jeweiligen App.)", false); return; }
  const ok = [];
  MB_APPS.forEach(a=>{ const v = o.data[a[0]]; if(typeof v!=="string") return;
    try{ const p = JSON.parse(v); if(p && typeof p==="object") ok.push([a[0], a[1], v]); }catch(e){} });
  if(!ok.length){ mbMsg("⚠ In dieser Datei steckt kein gültiger Spielstand.", false); return; }
  const d = o.created ? new Date(o.created) : null, ds = d && !isNaN(d) ? d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : "unbekanntem Datum";
  const list = ok.map(x=>x[1] + (mbInfo(x[0],x[2]) ? " (" + mbInfo(x[0],x[2]) + ")" : "")).join("\n");
  if(!window.confirm("Gesamtsicherung vom " + ds + " einspielen?\n\n" + list + "\n\nDer aktuelle Stand dieser Apps wird ersetzt.")){ mbMsg("Abgebrochen – nichts wurde verändert.", false); return; }
  const ls = mbStore(); if(!ls){ mbMsg("⚠ Der Browser erlaubt kein Speichern.", false); return; }
  try{ ok.forEach(x=>ls.setItem(x[0], x[2])); }catch(e){ mbMsg("⚠ Speichern hat nicht geklappt.", false); return; }
  mbMsg("✅ Eingespielt: " + list.replace(/\n/g," · ") + "<br>Die Seite lädt gleich neu …", true);
  setTimeout(()=>location.reload(), 900);
}
function mbCard(){
  return '<div id="mbCard" style="margin:14px 0;padding:16px;border:1px solid rgba(200,200,200,.35);border-radius:16px;background:rgba(0,0,0,.22)">'
    + '<b style="font-size:17px">🗄️ Gesamtsicherung – alle Apps auf einmal</b>'
    + '<div class="hint-sm" style="margin:6px 0 10px">Sichert Englisch, Mittelerde, Paris, Fächer und Raumstation gemeinsam in <b>einer Datei</b> (gleicher Speicher auf diesem Gerät). '
    + 'Zum Wiederherstellen oder für ein neues Gerät: <b>einspielen</b> – dabei wird der Stand der Apps ersetzt.</div>'
    + '<div class="btnRow"><button class="btn ghost" onclick="mbShare()">📤 Alles sichern</button>'
    + '<button class="btn ghost" onclick="mbDownload()">💾 Als Datei laden</button>'
    + '<button class="btn ghost" onclick="mbPickFile()">📥 Gesamtsicherung einspielen</button>'
    + '<button class="btn ghost" onclick="mbShowText()">📋 Als Text</button></div>'
    + '<div id="mbMsg" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid;border-radius:12px;background:rgba(0,0,0,.25);font-size:13.5px;line-height:1.5"></div><div id="mbText"></div></div>';
}
</script>
</body>
</html>
