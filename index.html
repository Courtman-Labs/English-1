<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Englisch-Abenteuer in Mittelerde – Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141b26;          /* Nachtblau – Hintergrund */
    --ink2:#1d2836;
    --parchment:#f5ead0;    /* Pergament */
    --parch2:#e9d9b4;
    --gold:#d9a83c;         /* Ring-Gold */
    --gold2:#b8862a;
    --ember:#e0763f;        /* Glut-Orange */
    --leaf:#5c8a5e;         /* Elben-Grün */
    --leaf2:#3f6b45;
    --wrong:#c05b4d;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #2a3a52 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #22392b 0%, transparent 55%),
      var(--ink);
    color:var(--parchment);
    min-height:100vh;
  }
  /* Sternenhimmel */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s infinite alternate}
  @keyframes tw{from{opacity:.15}to{opacity:.7}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  .app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 14px 60px}

  /* ---------- Kopfzeile ---------- */
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .crest{width:52px;height:52px;flex:0 0 auto}
  h1{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(19px,4vw,28px);letter-spacing:.5px;
     background:linear-gradient(90deg,#f7e6b0,#d9a83c 55%,#f7e6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:13px;opacity:.75;width:100%}
  .hud{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .badge{background:rgba(217,168,60,.12);border:1px solid rgba(217,168,60,.5);border-radius:999px;
     padding:6px 14px;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .xpbar{width:150px;height:10px;background:#0d1119;border-radius:99px;overflow:hidden;border:1px solid rgba(217,168,60,.4)}
  .xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .5s}

  /* ---------- Karten des Quest-Menüs ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-top:8px}
  .quest{
    background:linear-gradient(160deg,var(--ink2),#151d29);
    border:1px solid rgba(217,168,60,.35);border-radius:14px;padding:16px;cursor:pointer;
    transition:transform .15s, border-color .15s;box-shadow:var(--shadow);position:relative;overflow:hidden
  }
  .quest:hover{transform:translateY(-3px);border-color:var(--gold)}
  .quest .q-num{font-family:'Cinzel',serif;color:var(--gold);font-size:12px;letter-spacing:2px}
  .quest h3{font-family:'Cinzel',serif;font-size:17px;margin:6px 0 8px;color:var(--parchment)}
  .quest p{font-size:13px;opacity:.8;line-height:1.45}
  .quest .meta{display:flex;gap:8px;margin-top:12px;font-size:12px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.07);border-radius:99px;padding:3px 10px}
  .pill.done{background:rgba(92,138,94,.25);border:1px solid var(--leaf);color:#bfe3c1}
  .quest .stamp{position:absolute;top:10px;right:12px;font-size:22px}

  .albumBtn,.btn{
    font-family:'Nunito';font-weight:900;font-size:15px;border:none;border-radius:12px;cursor:pointer;
    padding:12px 22px;transition:transform .12s, box-shadow .12s
  }
  .btn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#241a05;box-shadow:0 4px 0 #7a5a17}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 #7a5a17}
  .btn.ghost{background:transparent;color:var(--parchment);border:1px solid rgba(245,234,208,.4);box-shadow:none}
  .btn.green{background:linear-gradient(180deg,#6fa571,var(--leaf2));color:#0d1a0e;box-shadow:0 4px 0 #27462c}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* ---------- Regel-Pergament ---------- */
  .scroll{
    background:linear-gradient(180deg,var(--parchment),var(--parch2));
    color:#3a2c14;border-radius:14px;padding:22px 22px 26px;box-shadow:var(--shadow);
    border:1px solid #c9b581;position:relative
  }
  .scroll::before,.scroll::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 8px 5px,#c9b581 3px,transparent 4px) repeat-x;background-size:22px 10px;opacity:.55}
  .scroll::before{top:4px}.scroll::after{bottom:4px}
  .scroll h2{font-family:'Cinzel',serif;font-size:clamp(18px,3.4vw,24px);color:#6b4c12;margin-bottom:4px}
  .scroll .lead{font-size:14px;font-style:italic;opacity:.85;margin-bottom:14px}
  .rule{background:rgba(255,255,255,.5);border-left:4px solid var(--gold2);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.55}
  .rule b{color:#8a5a10}
  .rule .ex{display:block;margin-top:4px;font-style:italic;color:#245a2a;font-weight:700}
  .scroll table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;background:rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
  .scroll th,.scroll td{padding:6px 10px;border-bottom:1px solid #d9c79b;text-align:left}
  .scroll th{background:rgba(217,168,60,.25);font-family:'Cinzel',serif;font-size:12.5px}

  /* ---------- Übungsansicht ---------- */
  .exWrap{max-width:680px;margin:0 auto}
  .topRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .progress{flex:1;height:14px;background:#0d1119;border-radius:99px;border:1px solid rgba(217,168,60,.4);overflow:hidden}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--leaf2),#8fc491);transition:width .35s}
  .streak{font-weight:900;font-size:14px;color:#ffb35c;white-space:nowrap}
  .qCard{background:linear-gradient(160deg,var(--ink2),#151d29);border:1px solid rgba(217,168,60,.35);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .qType{font-size:11.5px;letter-spacing:2px;color:var(--gold);font-family:'Cinzel',serif;margin-bottom:10px}
  .qText{font-size:clamp(18px,3.6vw,23px);font-weight:900;line-height:1.45;margin-bottom:6px}
  .qText .blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold)}
  .qHint{font-size:13.5px;opacity:.75;font-style:italic;margin-bottom:14px}
  .opts{display:grid;gap:10px;margin-top:14px}
  @media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
  .opt{background:rgba(245,234,208,.06);border:1.5px solid rgba(245,234,208,.3);color:var(--parchment);
    border-radius:12px;padding:13px 16px;font-size:16.5px;font-weight:700;cursor:pointer;text-align:left;transition:all .12s;font-family:'Nunito'}
  .opt:hover{border-color:var(--gold);background:rgba(217,168,60,.12)}
  .opt.correct{background:rgba(92,138,94,.3);border-color:#8fc491;color:#d5f0d6}
  .opt.wrong{background:rgba(192,91,77,.25);border-color:var(--wrong);color:#f3c9c2}
  .opt:disabled{cursor:default}
  input.fillIn{width:100%;max-width:340px;background:#0d1119;border:1.5px solid rgba(217,168,60,.5);color:var(--parchment);
    font-size:19px;font-weight:700;padding:12px 16px;border-radius:12px;font-family:'Nunito';margin-top:12px}
  input.fillIn:focus{outline:none;border-color:var(--gold)}
  .chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:52px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;border:1px dashed rgba(245,234,208,.3)}
  .chipPool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:rgba(217,168,60,.16);border:1.5px solid rgba(217,168,60,.55);color:var(--parchment);
    border-radius:10px;padding:9px 14px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Nunito'}
  .chip:hover{background:rgba(217,168,60,.3)}
  .feedback{margin-top:16px;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;display:none;line-height:1.5}
  .feedback.ok{display:block;background:rgba(92,138,94,.2);border:1px solid var(--leaf);color:#cdeccf}
  .feedback.no{display:block;background:rgba(192,91,77,.18);border:1px solid var(--wrong);color:#f3d2cb}
  .btnRow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .xpPop{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-weight:800;font-size:30px;color:var(--gold);
    text-shadow:0 2px 12px rgba(217,168,60,.7);pointer-events:none;opacity:0;z-index:50}
  .xpPop.show{animation:pop 1.1s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

  /* ---------- Fun-Fact ---------- */
  .fact{background:linear-gradient(160deg,#243447,#1a2636);border:1px solid rgba(217,168,60,.5);border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center;max-width:620px;margin:40px auto}
  .fact .ring{font-size:44px;display:block;margin-bottom:10px;animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fact h3{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:1.5px;font-size:15px;margin-bottom:12px}
  .fact p{font-size:17px;line-height:1.6;font-weight:700}

  /* ---------- Ergebnis + Kartenbelohnung ---------- */
  .result{text-align:center;max-width:680px;margin:0 auto}
  .result h2{font-family:'Cinzel',serif;font-size:clamp(22px,4.5vw,30px);color:var(--gold);margin:14px 0 6px}
  .scoreBig{font-size:44px;font-weight:900}
  .cardStage{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:22px 0}
  .cardBox{perspective:1000px}
  .cardBox img{width:230px;height:auto;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);transition:transform .25s}
  .cardBox:hover img{transform:rotateY(8deg) rotateX(-4deg) scale(1.03)}
  .cardBox .dl{margin-top:10px}
  .newTag{font-family:'Cinzel',serif;color:#ffd76e;font-size:13px;letter-spacing:2px;margin-bottom:6px;display:block}

  /* ---------- Album ---------- */
  .albumGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-top:16px}
  .albumSlot{text-align:center}
  .albumSlot img{width:100%;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .albumSlot .mystery{width:100%;aspect-ratio:63/88;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(135deg,#1b2431 0 10px,#18202c 10px 20px);
    border:2px dashed rgba(217,168,60,.45);box-shadow:inset 0 0 26px rgba(0,0,0,.6)}
  .albumSlot .mystery span{font-family:'Cinzel',serif;font-size:34px;color:rgba(217,168,60,.75)}
  .albumSlot .nm{font-size:13px;font-weight:900;margin-top:6px}
  .albumSlot .lk{font-size:12px;opacity:.65}
  .factRow{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(160deg,var(--ink2),#151d29);border:1px solid rgba(217,168,60,.35);border-radius:14px;padding:12px 16px;margin:8px 0}
  .factRow p{margin:2px 0;font-size:14px;line-height:1.5}
  .factRow .fnum{flex:0 0 auto;font-family:'Cinzel',serif;color:var(--gold);font-weight:700;min-width:26px;text-align:center;border:1px solid rgba(217,168,60,.5);border-radius:8px;padding:2px 4px;font-size:13px}
  .factRow.lockedF{opacity:.55}
  .factRow.lockedF p{font-style:italic}
  .evSec{background:linear-gradient(160deg,var(--ink2),#151d29);border:1px solid rgba(217,168,60,.35);border-radius:16px;padding:16px 18px;margin:14px 0}
  .evSec h3{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold);font-size:17px}
  .evRow{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .evRow:last-child{border-bottom:none}
  .evName{font-weight:700;font-size:14px;margin-bottom:4px}
  .evBar{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:3px 0}
  .evBar i{display:block;height:100%;border-radius:6px}
  .evVal{font-size:12px;opacity:.75}
  .backRow{margin:10px 0 16px}
  .sectionTitle{font-family:'Cinzel',serif;color:var(--gold);font-size:clamp(18px,3.5vw,24px);margin:6px 0 4px}
  .hint-sm{font-size:13px;opacity:.7;margin-bottom:8px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="app" id="app"></div>
<div class="xpPop" id="xpPop"></div>

<script>
/* =========================================================
   MITTELERDE-ENGLISCH-TRAINER · Klasse 5
   Basierend auf dem Lehrwerk (Greenwich / Sherlock der Hund)
   ========================================================= */

/* ---------- Herr-der-Ringe-Fun-Facts (kindgerecht) ---------- */
const LOTR_FACT_COUNT = 40;
function factCat(i){ return i < LOTR_FACT_COUNT ? {label:"MITTELERDE-FAKT", icon:"💍"} : {label:"POKÉMON-FAKT", icon:"⚡"}; }
const FACTS = [
 "J.R.R. Tolkien war Sprachprofessor. Er hat zuerst die Elbensprachen erfunden – und sich DANACH die Geschichten dazu ausgedacht!",
 "Es gibt zwei große Elbensprachen: Quenya und Sindarin. Tolkien hat für beide eine echte Grammatik geschrieben – so wie du gerade Englisch lernst!",
 "Die Schauspieler der neun Gefährten ließen sich nach dem Dreh ein gemeinsames Tattoo stechen: das elbische Zeichen für die Zahl Neun.",
 "„Die Rückkehr des Königs“ gewann 11 Oscars – so viele wie kein anderer Fantasyfilm zuvor!",
 "Gollum wurde von Andy Serkis gespielt. Seine Bewegungen wurden mit Motion-Capture-Anzügen auf die Filmfigur übertragen.",
 "Die Hobbit-Darsteller mussten jeden Morgen über eine Stunde in der Maske sitzen, um ihre großen, haarigen Hobbitfüße angeklebt zu bekommen.",
 "Alle drei Filme wurden in Neuseeland gedreht. Das Hobbit-Dorf kann man dort heute noch besuchen!",
 "Tolkien und C.S. Lewis, der Autor von Narnia, waren gute Freunde und lasen sich gegenseitig aus ihren Büchern vor.",
 "Sean Bean (Boromir) hatte Flugangst. Statt mit dem Helikopter zu fliegen, wanderte er in voller Rüstung auf den Berg zum Drehort!",
 "Viggo Mortensen (Aragorn) brach sich beim Tritt gegen einen Ork-Helm zwei Zehen. Sein Schmerzensschrei blieb im Film!",
 "Der Name des Drachen Smaug kommt von einem alten Wort, das „sich durch ein Loch zwängen“ bedeutet.",
 "Orlando Bloom (Legolas) brach sich beim Dreh eine Rippe – vom Sturz von einem Pferd.",
 "Tolkien schrieb den allerersten Satz vom „Hobbit“ auf ein leeres Blatt, während er langweilige Prüfungen korrigierte.",
 "Der Kampfschrei der Orks wurde teilweise mit den Rufen von 25.000 Cricket-Fans in einem Stadion aufgenommen.",
 "In Mittelerde sprechen die Völker verschiedene Sprachen – genau wie in Europa. Wer Sprachen lernt, ist dort ein echter Gelehrter!",
 "Christopher Lee (Saruman) war der Einzige am Set, der Tolkien wirklich persönlich getroffen hatte.",
 "Das Kettenhemd von Gimli und Co. bestand aus tausenden Plastikringen – zwei Leute haben JAHRE daran geknüpft.",
 "Ian McKellen (Gandalf) stieß sich in Bilbos Haus aus Versehen den Kopf am Balken – die Szene war nicht geplant und blieb im Film!",
 "Das Wort „Hobbit“ hat Tolkien erfunden. Heute steht es sogar im berühmten Oxford-Wörterbuch!",
 "„Mellon“ ist Elbisch und heißt „Freund“. Mit diesem Zauberwort öffnet sich das Westtor von Moria.",
 "Die Elbensprache Quenya klingt wie Finnisch – Tolkien liebte den Klang dieser Sprache schon als Schüler.",
 "Elijah Wood (Frodo) drehte sein Bewerbungsvideo verkleidet als Hobbit mitten im Wald.",
 "Orlando Bloom trug für Legolas' helle Elbenaugen Kontaktlinsen – seine Augen sind eigentlich braun.",
 "Die große Schlacht um Helms Klamm wurde in rund 120 Nächten gedreht – fast immer im künstlichen Regen!",
 "Regisseur Peter Jackson versteckt sich in jedem Film als kleine Nebenfigur – in Bree kaut er zum Beispiel eine Karotte.",
 "Billy Boyd (Pippin) hat die Melodie des Liedes, das er in „Die Rückkehr des Königs“ singt, selbst komponiert.",
 "Viggo Mortensen mochte sein Filmpferd so sehr, dass er es nach den Dreharbeiten kaufte.",
 "John Rhys-Davies, der den Zwerg Gimli spielt, ist in Wirklichkeit der größte Schauspieler der Gefährten – über 1,85 m!",
 "Für die Filme wurden tausende Rüstungen, Schwerter und Schilde in Handarbeit hergestellt.",
 "Die Gemüsegärten von Hobbingen wurden ein ganzes Jahr vor Drehbeginn angepflanzt, damit alles echt aussieht.",
 "Die Inschrift auf dem Einen Ring erscheint erst, wenn man ihn ins Feuer legt.",
 "Elbisch kann man wirklich schreiben: Die geschwungene Elbenschrift heißt Tengwar.",
 "Tolkien war Professor in Oxford und brachte seinen Studenten alte Sprachen bei.",
 "Die Riesenadler von Mittelerde heißen „die Großen Adler“ – ihr Anführer ist Gwaihir, der Windherr.",
 "Andy Serkis ließ sich für Gollums krächzende Stimme von seiner Katze inspirieren.",
 "Hobbits lieben Essen so sehr, dass sie ein zweites Frühstück kennen!",
 "Frodos Nachname Beutlin heißt auf Englisch „Baggins“ – denn „bag“ bedeutet Tasche oder Beutel!",
 "Samweis' Name „Samwise“ bedeutet in alter Sprache so viel wie „der Einfache“ – dabei ist er der treueste Held von allen.",
 "Das Hobbit-Dorf aus den Filmen kann man in Neuseeland bis heute besuchen – mit 44 Hobbit-Höhlen!",
 "Bilbos Geburtstagsfest beginnt die ganze Geschichte – mit einem riesigen Feuerwerk von Gandalf.",
 "Der Name „Pokémon“ ist die Kurzform des japanischen „Pocket Monsters“ – also „Taschenmonster“.",
 "Erfinder Satoshi Tajiri sammelte als Kind leidenschaftlich Insekten. Genau daraus entstand die Idee, kleine Kreaturen zu fangen und zu tauschen.",
 "Die allerersten Spiele hießen in Japan „Pokémon Rot“ und „Pokémon Grün“ und erschienen 1996 für den Game Boy.",
 "„Pikachu“ setzt sich aus zwei japanischen Lautwörtern zusammen: „pika“ für das Knistern von Elektrizität und „chu“ für das Quieken einer Maus.",
 "Das Tauschen war von Anfang an Teil des Spiels: Manche Pokémon bekam man nur, wenn man sein Game Boy per Kabel mit einem Freund verband.",
 "Im Englischen ist „Pokémon“ zugleich Einzahl und Mehrzahl – „one Pokémon, many Pokémon“. Ein „Pokémons“ gibt es nicht!",
 "Evoli hat mehr Entwicklungen als jedes andere Pokémon – ganze acht verschiedene Formen.",
 "Karpador gilt als schwächstes Pokémon überhaupt, entwickelt sich aber zum mächtigen Garados.",
 "Mew wurde ganz zum Schluss heimlich von einem Programmierer ins Spiel eingebaut – eigentlich war dafür gar kein Speicherplatz mehr übrig.",
 "Rizeros war das erste Pokémon, das jemals gezeichnet wurde – nicht etwa Pikachu.",
 "Inzwischen gibt es über 1000 verschiedene Pokémon-Arten.",
 "Mit „Pokémon GO“ wurde 2016 die ganze Stadt zum Spielfeld – man musste tatsächlich rausgehen und laufen, um Pokémon zu finden.",
 "Die englischen Namen unterscheiden sich oft völlig von den deutschen: Glurak heißt auf Englisch „Charizard“, Enton heißt „Psyduck“ und Smogmog heißt „Weezing“."
];

const CARDS = [

 id:"q13", num:"QUEST 13 · Dol Guldur", title:"Vertiefung: Simple Present vs. Present Progressive",
 desc:"Der Nekromant verwirrt die Zeiten! Hier lernst du den Unterschied endgültig – mit klaren Regeln, Alltagsbeispielen und den typischen Fallen.",
 card:28,
 rules:[
  {"h": "Die eine Frage, die alles entscheidet", "t": "Frag dich immer: <b>Passiert es GERADE JETZT – oder passiert es IMMER WIEDER?</b><br><br>Stell dir vor, du rufst deinen Freund an:<br>„Was machst du gerade?“ → <b>I'm doing my homework.</b> (jetzt, in diesem Moment)<br>„Was machst du nach der Schule?“ → <b>I do my homework.</b> (jeden Tag, Gewohnheit)", "ex": "Beide Sätze sind richtig – sie bedeuten nur etwas völlig anderes!"},
  {"h": "So bildest du die beiden Zeiten", "table": [["<b>Simple Present</b> (immer / oft)", "I play · you play · he/she/it play<b>s</b>"], ["<b>Present Progressive</b> (jetzt)", "I <b>am</b> playing · he/she/it <b>is</b> playing · we/you/they <b>are</b> playing"]], "ex": "Merke: Simple Present hat das -s bei he/she/it. Present Progressive hat IMMER eine Form von to be + -ing."},
  {"h": "Die Signalwörter verraten dir alles", "table": [["<b>→ Simple Present</b>", "every day, every Monday, always, usually, often, sometimes, never, at weekends, twice a week"], ["<b>→ Present Progressive</b>", "now, right now, at the moment, today, Look!, Listen!, still"]], "ex": "Ruby plays tennis <u>every Friday</u>. – Ruby is playing tennis <u>right now</u>."},
  {"h": "Achtung, Falle: Verben, die (fast) nie -ing bekommen", "t": "Manche Verben beschreiben keine Handlung, sondern einen <b>Zustand</b> – im Kopf, im Gefühl oder beim Besitz. Sie stehen fast immer im simple present, auch wenn es gerade jetzt gilt:<br><b>like, love, hate, want, need, know, understand, believe, remember, have got, be</b>", "ex": "✗ I am knowing the answer. → ✓ <b>I know</b> the answer.<br>✗ She is wanting a drink. → ✓ <b>She wants</b> a drink."},
  {"h": "Die häufigsten Fehler", "table": [["✗ He play football now.", "✓ He <b>is playing</b> football now."], ["✗ He is playing football every day.", "✓ He <b>plays</b> football every day."], ["✗ I am not liking maths.", "✓ I <b>don't like</b> maths."], ["✗ She is go to school.", "✓ She <b>is going</b> to school."]], "ex": "Wenn du unsicher bist: Suche das Signalwort – es entscheidet fast immer."},

let S = {xp:0, done:{}, best:{}, cards:[], stats:{}, extras:[]};
const KEY = "englisch-abenteuer-v4";
let storageOK = true;

/* Speicherort automatisch wählen:
   1. Claude-Artefakt: window.storage
   2. Eigene Website (z. B. GitHub Pages): localStorage des Browsers */
function claudeStore(){
  try{ return (window.storage && typeof window.storage.get === "function") ? window.storage : null; }
  catch(e){ return null; }
}
function browserStore(){
  try{
    if(typeof localStorage === "undefined") return null;
    localStorage.setItem("__ea_test","1"); localStorage.removeItem("__ea_test");
    return localStorage;
  }catch(e){ return null; } /* z. B. blockiert im Privatmodus */
}

/* Stellt sicher, dass auch ältere Spielstände alle Felder haben */
function normalizeState(){
  S.cards   = Array.isArray(S.cards)   ? S.cards   : [];
  S.extras  = Array.isArray(S.extras)  ? S.extras  : [];
  S.facts   = Array.isArray(S.facts)   ? S.facts   : [];
  S.stats   = (S.stats   && typeof S.stats==="object")   ? S.stats   : {};
  S.done    = (S.done    && typeof S.done==="object")    ? S.done    : {};
  S.best    = (S.best    && typeof S.best==="object")    ? S.best    : {};
  S.perfect = (S.perfect && typeof S.perfect==="object") ? S.perfect : {};
  S.xp = Number(S.xp)||0;
  S.maxStreak = Number(S.maxStreak)||0;
  // Indizes verwerfen, die es nicht (mehr) gibt
  S.cards  = S.cards.filter(i=>Number.isInteger(i) && i>=0 && i<CARDS.length);
  S.extras = S.extras.filter(i=>Number.isInteger(i) && i>=0 && i<EXTRA_CARDS.length);
  S.facts  = S.facts.filter(i=>Number.isInteger(i) && i>=0 && i<FACTS.length);
}
async function loadState(){
  try{
    const cs = claudeStore();
    if(cs){
      const r = await cs.get(KEY);
      if(r && r.value) S = Object.assign(S, JSON.parse(r.value));
    } else {
      const ls = browserStore();
      if(ls){
        const v = ls.getItem(KEY);
        if(v) S = Object.assign(S, JSON.parse(v));
      }
    }
    normalizeState();
  }catch(e){ /* Noch kein Spielstand vorhanden – kein Problem */ }
}
async function saveState(){
  if(!storageOK) return;
  try{
    const cs = claudeStore();
    if(cs){ await cs.set(KEY, JSON.stringify(S)); return; }
    const ls = browserStore();
    if(ls){ ls.setItem(KEY, JSON.stringify(S)); return; }
    storageOK = false; /* kein Speicher verfügbar (z. B. Privatmodus) */
  }
  catch(e){ storageOK = false; }
}

/* ---------- Spielstand sichern & übertragen ---------- */
function saveMsg(text, ok){
  const box = document.getElementById("saveMsg");
  if(!box) return;
  box.style.display = "block";
  box.style.borderColor = ok ? "rgba(90,154,90,.6)" : "rgba(192,69,58,.6)";
  box.innerHTML = text;
}
function stateFileName(){
  return "Englisch-Abenteuer_Spielstand_" + new Date().toISOString().slice(0,10) + ".json";
}
/* Weg 1: Teilen-Menü – auf dem iPad am zuverlässigsten */
async function shareState(){
  try{
    const file = new File([JSON.stringify(S,null,1)], stateFileName(), {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:stateFileName()});
      saveMsg('✅ Wähle im Teilen-Menü <b>„In Dateien sichern"</b>, um den Spielstand abzulegen.', true);
      return true;
    }
  }catch(e){
    if(e && e.name==="AbortError"){ saveMsg('Abgebrochen – es wurde nichts gespeichert.', false); return true; }
  }
  return false;
}
async function exportOrShare(){
  if(await shareState()) return;
  exportState();
}
/* Weg 3: Text zum Kopieren – funktioniert immer */
function showStateText(){
  saveMsg('📋 Kopiere diesen Text und sichere ihn z. B. in einer Notiz. Zum Wiederherstellen fügst du ihn hier wieder ein und tippst auf „Übernehmen".'
    +'<textarea id="stateBox" style="width:100%;height:110px;margin-top:8px;font-size:11px;border-radius:8px;padding:8px;'
    +'background:rgba(0,0,0,.4);color:#f5ead0;border:1px solid rgba(217,168,60,.4)"></textarea>'
    +'<div class="btnRow" style="margin:8px 0 0"><button class="btn ghost" onclick="copyStateText()">📋 Kopieren</button>'
    +'<button class="btn ghost" onclick="pasteStateText()">✔ Übernehmen</button></div>', true);
  const box=document.getElementById("stateBox"); if(box) box.value = JSON.stringify(S);
}
function copyStateText(){
  const box=document.getElementById("stateBox"); if(!box) return;
  box.select(); box.setSelectionRange(0,999999);
  try{ navigator.clipboard.writeText(box.value); }catch(e){ try{ document.execCommand("copy"); }catch(e2){} }
}
function pasteStateText(){
  const box=document.getElementById("stateBox"); if(!box) return;
  try{
    const data=JSON.parse(box.value);
    if(typeof data!=="object"||data===null) throw 0;
    S=Object.assign({xp:0,done:{},best:{},cards:[],stats:{},extras:[],facts:[],perfect:{}},data);
    normalizeState(); storageOK=true; saveState(); showEval();
    saveMsg('✅ Spielstand übernommen: <b>'+S.xp+' XP</b>, '+(S.cards.length+S.extras.length)+' Karten.', true);
  }catch(e){ saveMsg('⚠ Der eingefügte Text ist kein gültiger Spielstand.', false); }
}
function exportState(){
  const json = JSON.stringify(S, null, 1);
  const d = new Date().toISOString().slice(0,10);
  const name = "Englisch-Abenteuer_Spielstand_" + d + ".json";
  try{
    const blob = new Blob([json], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    saveMsg('✅ Spielstand gesichert als <b>'+name+'</b><br><span style="opacity:.8">Auf dem iPad liegt die Datei jetzt in <b>Dateien → Downloads</b>. Safari zeigt dafür keine eigene Meldung an.</span>', true);
  }catch(e){
    saveMsg('⚠ Der Download hat nicht geklappt. Kopiere den Spielstand notfalls von Hand aus dem Browser-Speicher.', false);
  }
}
function importState(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const data = JSON.parse(rd.result);
        if(typeof data !== "object" || data === null) throw 0;
        S = Object.assign({xp:0, done:{}, best:{}, cards:[], stats:{}, extras:[], facts:[], perfect:{}}, data);
        normalizeState();
        storageOK = true;
        saveState();
        showEval();
        saveMsg('✅ Spielstand geladen: <b>'+S.xp+' XP</b>, '+(S.cards.length+S.extras.length)+' Karten, '+Object.keys(S.done).length+' bestandene Quests.', true);
      }catch(e){
        saveMsg('⚠ Diese Datei konnte nicht gelesen werden. Bitte die exportierte <b>.json</b>-Datei auswählen.', false);
      }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function level(){ return Math.min(Math.floor(S.xp/120), RANKS.length-1); }
function rank(){ return RANKS[level()]; }

let run = null; // aktueller Übungslauf

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function shuffled(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function headerHTML(){
  const lv=level(), next=(lv+1)*120, cur=S.xp-lv*120, span=next-lv*120;
  return `<header>
    <svg class="crest" viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="none" stroke="#d9a83c" stroke-width="5"/><circle cx="30" cy="30" r="22" fill="none" stroke="#f7e6b0" stroke-width="1.5" stroke-dasharray="3 5"/><circle cx="30" cy="10" r="4" fill="#ffd76e"/></svg>
    <div><h1>Englisch-Abenteuer in Mittelerde</h1></div>
    <div class="hud">
      <span class="badge">⭐ ${S.xp} XP</span>
      <span class="badge">🏅 ${rank()}</span>
      <span class="badge">🃏 ${S.cards.length+S.extras.length}/${CARDS.length+EXTRA_CARDS.length}</span>
      <div class="xpbar" title="Bis zum nächsten Rang"><div style="width:${Math.min(100,cur/span*100)}%"></div></div>
    </div>
    <div class="sub">${QUESTS.length} Quests durch Grammatik und Wortschatz der 5. und 6. Klasse – sammle XP und alle ${CARDS.length+EXTRA_CARDS.length} Karten!</div>
  </header>`;
}

function showHome(){
  run=null;
  const tile=(q,i)=>{
    const done=S.done[q.id], best=S.best[q.id];
    const hasCard=q.card!=null && S.cards.includes(q.card);
    const perfect=(S.perfect||{})[q.id];
    return `<div class="quest" onclick="showIntro(${i})">
      ${perfect?'<span class="stamp">🌟</span>':done?'<span class="stamp">✅</span>':''}
      <div class="q-num">${q.num}</div>
      <h3>${q.title}</h3>
      <p>${q.desc}</p>
      <div class="meta">
        <span class="pill">${q.ex.length} Übungen</span>
        ${best!=null?`<span class="pill ${best>=85?'done':''}">Beste: ${best}%</span>`:''}
        ${hasCard?'<span class="pill done">🃏 Karte erhalten</span>':'<span class="pill">🎁 Karte ab 85 %</span>'}
      </div>
    </div>`;
  };
  const DEEP = ["q13","q14","q15","q16","q17"];
  const grammar = QUESTS.map((q,i)=>({q,i})).filter(x=>x.q.id[0]==="q" && !DEEP.includes(x.q.id));
  const vocab   = QUESTS.map((q,i)=>({q,i})).filter(x=>x.q.id[0]==="v");
  const deep    = QUESTS.map((q,i)=>({q,i})).filter(x=>DEEP.includes(x.q.id));
  app.innerHTML = headerHTML() + `
    <div class="backRow" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="showAlbum()">🃏 Karten-Album</button>
      <button class="btn ghost" onclick="showFacts()">📖 Fakten-Buch</button>
      <a class="btn ghost" href="mittelerde-reise.html" style="text-decoration:none;display:inline-flex;align-items:center">⚔️ Mittelerde-Reise</a>
      <button class="btn ghost" onclick="showEval()">📊 Auswertung</button>
    </div>
    <div class="sectionTitle">⚔️ Grammatik-Quests</div>
    <div class="grid">${grammar.map(x=>tile(x.q,x.i)).join("")}</div>
    <div class="sectionTitle" style="margin-top:20px">🧙 Vokabel-Quests</div>
    <div class="grid">${vocab.map(x=>tile(x.q,x.i)).join("")}</div>
    <div class="sectionTitle" style="margin-top:20px">🔥 Vertiefungs-Quests</div>
    <div class="hint-sm">Anspruchsvoller und ausführlicher erklärt – genau für die Themen, die erfahrungsgemäß am meisten Übung brauchen.</div>
    <div class="grid">${deep.map(x=>tile(x.q,x.i)).join("")}</div>`;
  window.scrollTo(0,0);
}

function showIntro(qi){
  const q = QUESTS[qi];
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="scroll">
     <h2>${q.num.replace("QUEST","📜 Quest").replace(" · ",": ")}</h2>
     <div class="lead">${q.title} — Lies zuerst die Regeln, dann beginnt die Prüfung!</div>
     ${q.rules.map(r=>`<div class="rule"><b>${r.h}</b><br>${r.t||""}
        ${r.table?`<table>${r.table.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`:""}
        ${r.ex?`<span class="ex">Beispiel: ${r.ex}</span>`:""}</div>`).join("")}
   </div>
   <div class="btnRow" style="justify-content:center;margin-top:18px">
     <button class="btn" onclick="startQuest(${qi})">⚔️ Quest starten (${q.ex.length} Übungen)</button>
   </div>`;
  window.scrollTo(0,0);
}

function startQuest(qi){
  const q = QUESTS[qi];
  run = {qi, order: shuffled(q.ex.map((_,i)=>i)), pos:0, correct:0, streak:0, factsUsed:[], answered:false};
  showExercise();
}

function factHTML(){
  // Bevorzugt Fakten zeigen, die noch nicht im Fakten-Buch stehen
  S.facts = S.facts || [];
  let pool = FACTS.map((_,i)=>i).filter(i=>!S.facts.includes(i));
  if(!pool.length) pool = FACTS.map((_,i)=>i).filter(i=>!run.factsUsed.includes(i));
  if(!pool.length){ run.factsUsed=[]; pool = FACTS.map((_,i)=>i); }
  const f = pool[Math.floor(Math.random()*pool.length)];
  run.factsUsed.push(f);
  const isNew = !S.facts.includes(f);
  if(isNew){ S.facts.push(f); saveState(); }
  return `<div class="fact">
    <span class="ring">${factCat(f).icon}</span>
    <h3>WUSSTEST DU? · ${factCat(f).label}</h3>
    <p>${FACTS[f]}</p>
    ${isNew?`<p style="font-size:12px;opacity:.75;margin-top:6px">📖 Neu im Fakten-Buch gespeichert (${S.facts.length}/${FACTS.length})</p>`:""}
    <div class="btnRow" style="justify-content:center"><button class="btn" onclick="renderExercise()">Weiter geht's! →</button></div>
  </div>`;
}

function showExercise(){
  const q = QUESTS[run.qi];
  if(run.pos >= run.order.length){ return finishQuest(); }
  // Fun-Fact alle 5 Aufgaben (nicht vor der ersten)
  if(run.pos>0 && run.pos % 5 === 0 && !run.factShown){
    run.factShown = true;
    app.innerHTML = headerHTML() + factHTML();
    window.scrollTo(0,0);
    return;
  }
  renderExercise();
}

function renderExercise(){
  run.factShown = false;
  run.answered = false;
  const q = QUESTS[run.qi];
  const ex = q.ex[run.order[run.pos]];
  const prog = Math.round(run.pos / run.order.length * 100);
  let body="";
  if(ex.type==="mc"){
    const opts = ex.opts.map((o,i)=>({o,i}));
    body = `<div class="opts">${shuffled(opts).map(x=>
      `<button class="opt" data-i="${x.i}" onclick="answerMC(this,${x.i})">${esc(x.o)}</button>`).join("")}</div>`;
  } else if(ex.type==="fill"){
    body = `<input class="fillIn" id="fillInput" autocomplete="off" autocapitalize="off" placeholder="Deine Antwort …"
      onkeydown="if(event.key==='Enter')checkFill()">
      <div class="btnRow"><button class="btn" onclick="checkFill()">Prüfen ✔</button></div>`;
  } else if(ex.type==="order"){
    body = `<div class="chipRow" id="built"></div>
      <div class="chipPool" id="pool">${shuffled(ex.words.map((w,i)=>({w,i}))).map(x=>
        `<button class="chip" data-w="${esc(x.w)}" onclick="pickChip(this)">${esc(x.w)}</button>`).join("")}</div>
      <div class="btnRow">
        <button class="btn" onclick="checkOrder()">Prüfen ✔</button>
        <button class="btn ghost" onclick="resetOrder()">Zurücksetzen ↺</button>
      </div>`;
  }
  const typeName = {mc:"MULTIPLE CHOICE", fill:"FILL IN THE BLANK", order:"WORT-BAUSTELLE"}[ex.type];
  app.innerHTML = headerHTML() + `
   <div class="exWrap">
    <div class="topRow">
      <button class="btn ghost" style="padding:8px 14px" title="Quest abbrechen" onclick="showHome()">✕</button>
      <div class="progress"><div style="width:${prog}%"></div></div>
      <span class="streak">${run.streak>=3?"🔥":"⚡"} Serie: ${run.streak}</span>
    </div>
    <div class="qCard">
      <div class="qType">${typeName} · Aufgabe ${run.pos+1} von ${run.order.length}</div>
      <div class="qText">${esc(ex.q).replace(/___/g,'<span class="blank">___</span>')}</div>
      ${ex.hint?`<div class="qHint">💡 ${esc(ex.hint)}</div>`:""}
      ${body}
      <div class="feedback" id="fb"></div>
      <div class="btnRow" id="nextRow" style="display:none">
        <button class="btn green" onclick="nextExercise()">Weiter →</button>
      </div>
    </div>
   </div>`;
  const inp=document.getElementById("fillInput"); if(inp) inp.focus();
  window.scrollTo(0,0);
}

function currentEx(){ return QUESTS[run.qi].ex[run.order[run.pos]]; }

function norm(s){ return s.toLowerCase().replace(/\u2019/g,"'").replace(/\s+/g," ").replace(/[.!?]$/,"").trim(); }

function resolve(ok, correctText){
  if(run.answered) return; run.answered=true;
  try{ // Statistik für die Lehrer-Auswertung
    const ei = run.order[run.pos], qid = QUESTS[run.qi].id;
    S.stats[qid] = S.stats[qid] || {};
    const st = S.stats[qid][ei] = S.stats[qid][ei] || {a:0,c:0};
    st.a++; if(ok) st.c++;
    if(!ok) saveState();
  }catch(e){}
  const fb = document.getElementById("fb");
  if(ok){
    run.correct++; run.streak++;
    if(run.streak>(run.bestStreak||0)) run.bestStreak=run.streak;
    if(run.streak>(S.maxStreak||0)) S.maxStreak=run.streak;
    const bonus = run.streak>=3 ? 5 : 0;
    S.xp += 10 + bonus; saveState();
    fb.className="feedback ok";
    fb.innerHTML = "✅ <b>Richtig!</b> +10 XP" + (bonus?` <b style="color:#ffb35c">+${bonus} Serien-Bonus 🔥</b>`:"");
    popXP("+"+(10+bonus)+" XP");
  } else {
    run.streak=0;
    fb.className="feedback no";
    fb.innerHTML = "❌ <b>Leider falsch.</b> Richtig ist: <b>"+esc(correctText)+"</b><br><span style='font-weight:400'>Merk es dir – die Karte wartet trotzdem auf dich!</span>";
  }
  document.getElementById("nextRow").style.display="flex";
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  const inp=document.getElementById("fillInput"); if(inp) inp.disabled=true;
}

function answerMC(btn, i){
  if(run.answered) return;
  const ex = currentEx();
  const ok = i===ex.c;
  btn.classList.add(ok?"correct":"wrong");
  if(!ok){ document.querySelectorAll(".opt").forEach(b=>{ if(+b.dataset.i===ex.c) b.classList.add("correct"); }); }
  resolve(ok, ex.opts[ex.c]);
}
function checkFill(){
  if(run.answered) return;
  const ex = currentEx();
  const v = norm(document.getElementById("fillInput").value);
  if(!v) return;
  const ok = ex.c.some(a=>norm(a)===v);
  resolve(ok, ex.c[0]);
}
function pickChip(btn){
  if(run.answered) return;
  document.getElementById("built").appendChild(btn);
  btn.onclick = ()=>{ if(!run.answered){ document.getElementById("pool").appendChild(btn); btn.onclick=()=>pickChip(btn); } };
}
function resetOrder(){
  if(run.answered) return;
  const pool=document.getElementById("pool");
  document.querySelectorAll("#built .chip").forEach(ch=>{ pool.appendChild(ch); ch.onclick=()=>pickChip(ch); });
}
function checkOrder(){
  if(run.answered) return;
  const ex = currentEx();
  const built = [...document.querySelectorAll("#built .chip")].map(c=>c.dataset.w).join(" ");
  const ok = norm(built)===norm(ex.c);
  resolve(ok, ex.c);
}
function nextExercise(){ run.pos++; showExercise(); }

function popXP(t){
  const p=document.getElementById("xpPop");
  p.textContent=t; p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
}

function finishQuest(){
  const q = QUESTS[run.qi];
  const pct = Math.round(run.correct/run.order.length*100);
  const passed = pct>=60;
  const prevBest = S.best[q.id]||0;
  if(pct>prevBest) S.best[q.id]=pct;
  let newCards=[];
  if(passed){ S.done[q.id]=true; S.xp += 25; }
  if(pct===100){ S.perfect = S.perfect||{}; S.perfect[q.id]=true; }
  if(pct>=85 && q.card!=null && !S.cards.includes(q.card)){
    S.cards.push(q.card);
    newCards.push({ci:q.card, label:"✦ NEUE QUEST-KARTE ✦"});
  }
  // Sonderkarten für besondere Erfolge prüfen
  // Zufallsfund ab 95 %
  if(pct>=95){
    const pool = EXTRA_CARDS.map((c,i)=>i).filter(i=>!S.extras.includes(i));
    if(pool.length){
      const pick = pool[Math.floor(Math.random()*pool.length)];
      S.extras.push(pick);
      newCards.push({extra:pick, label:"🎲 ZUFALLSFUND (95 %)"});
    }
  }
  SPECIALS.forEach(sp=>{
    if(!S.cards.includes(sp.card) && specialReached(sp)){
      S.cards.push(sp.card);
      newCards.push({ci:sp.card, label:"🏅 SONDERKARTE: "+sp.name});
    }
  });
  saveState();
  const msg = pct===100 ? "PERFEKT – eine fehlerfreie Quest! Ganz Mittelerde verneigt sich."
            : pct>=85 ? "Legendär! Du hast dir die Quest-Karte verdient!"
            : passed ? "Quest bestanden! Ab 85 % wartet die Quest-Karte – versuch es gleich noch einmal!"
            : "Fast! Du brauchst mindestens 60 %, um die Quest zu bestehen. Lies die Regeln noch einmal – du schaffst das!";
  app.innerHTML = headerHTML() + `
   <div class="result">
     <h2>${passed?"🏆 Quest bestanden!":"🛡️ Tapfer gekämpft!"}</h2>
     <div class="scoreBig">${run.correct} / ${run.order.length} <span style="font-size:22px;opacity:.8">(${pct} %)</span></div>
     <p style="margin:10px 0;font-size:16px;font-weight:700">${msg}</p>
     ${passed?`<p style="opacity:.8;font-size:14px">+25 XP Abschlussbonus · Längste Serie in dieser Runde: ${run.bestStreak||0} 🔥</p>`:""}
     <div class="cardStage">
       ${newCards.map(x=>{
         const c = x.extra!=null ? EXTRA_CARDS[x.extra] : CARDS[x.ci];
         const dl = x.extra!=null ? `downloadExtra(${x.extra})` : `downloadCard(${x.ci})`;
         return `<div class="cardBox">
           <span class="newTag">${x.label}</span>
           ${cardIMG(c)}
           <div class="nm" style="margin-top:6px;font-weight:900">${c.name}</div>
           <div class="dl"><button class="btn" onclick="${dl}">⬇ Karte herunterladen</button></div>
         </div>`;}).join("")}
       ${pct>=85 && !newCards.length ? `<p style="opacity:.75">Die Quest-Karte besitzt du schon – schau ins Album!</p>`:""}
     </div>
     <div class="btnRow" style="justify-content:center">
       ${!passed?`<button class="btn" onclick="showIntro(${run.qi})">↺ Nochmal versuchen</button>`:""}
       <button class="btn green" onclick="showAlbum()">🃏 Zum Album</button>
       <button class="btn ghost" onclick="showFacts()">📖 Fakten-Buch</button>
       <button class="btn ghost" onclick="showHome()">Zur Questkarte</button>
     </div>
   </div>`;
  window.scrollTo(0,0);
}

function perfectCount(){ return Object.keys(S.perfect||{}).length; }
function specialReached(sp){
  const t=sp.cond[0], n=sp.cond[1];
  if(t==="streak")  return (S.maxStreak||0)>=n;
  if(t==="perfect") return perfectCount()>=n;
  if(t==="xp")      return S.xp>=n;
  if(t==="vocab")   return QUESTS.filter(q=>q.id[0]==="v").every(q=>S.done[q.id]);
  if(t==="grammar") return QUESTS.filter(q=>q.id[0]==="q").every(q=>S.done[q.id]);
  if(t==="all90")   return QUESTS.every(q=>(S.best[q.id]||0)>=90);
  return false;
}

function reiseTrophies(){
  try{
    const ls = browserStore(); if(!ls) return [];
    const v = ls.getItem("mittelerde-reise-v1"); if(!v) return [];
    const d = JSON.parse(v);
    return Array.isArray(d.trophies) ? d.trophies : [];
  }catch(e){ return []; }
}
function showAlbum(){
  const troph = new Set(reiseTrophies());
  const slot=(c,i,kind)=>{
    const owned = kind==="extra" ? (S.extras.includes(i) || troph.has(c.id)) : S.cards.includes(i);
    const hint = kind==="extra" ? "🎲 Zufallsfund ab 95 % oder Gegner-Belohnung"
      : (c.q!=null ? `🔒 ${QUESTS[c.q].num.split(" · ")[0]} mit 85 % schaffen` : `🏅 ${SPECIALS[c.sp].desc}`);
    const dl = kind==="extra" ? `downloadExtra(${i})` : `downloadCard(${i})`;
    return `<div class="albumSlot ${owned?"":"locked"}">
      ${owned?cardIMG(c):`<div class="mystery"><span>?</span></div>`}
      <div class="nm">${owned?c.name:"Unbekannte Karte"}</div>
      ${owned?`<button class="btn" style="padding:8px 14px;font-size:13px;margin-top:6px" onclick="${dl}">⬇ Bild</button>`
             :`<div class="lk">${hint}</div>`}
    </div>`;
  };
  const qc = CARDS.map((c,i)=>({c,i})).filter(x=>x.c.q!=null);
  const sc = CARDS.map((c,i)=>({c,i})).filter(x=>x.c.sp!=null);
  const nq = qc.filter(x=>S.cards.includes(x.i)).length;
  const ns = sc.filter(x=>S.cards.includes(x.i)).length;
  const setBlock = (key)=>{
    const list = EXTRA_CARDS.map((c,i)=>({c,i})).filter(x=>x.c.set===key);
    if(!list.length) return "";
    const n = list.filter(x=>S.extras.includes(x.i) || troph.has(x.c.id)).length;
    return `<div class="sectionTitle" style="font-size:18px;margin-top:18px">${SET_INFO[key].t} · ${n} / ${list.length}</div>
      <div class="albumGrid">${list.map(x=>slot(x.c,x.i,"extra")).join("")}</div>`;
  };
  const extrasOwned = EXTRA_CARDS.filter((c,i)=>S.extras.includes(i) || troph.has(c.id)).length;
  const totalOwned = nq+ns+extrasOwned;
  const totalAll = qc.length+sc.length+EXTRA_CARDS.length;
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="sectionTitle">🃏 Dein Karten-Album · ${totalOwned} / ${totalAll}</div>
   <div class="hint-sm">Quest-Karten gibt es ab <b>85 %</b>. Ab <b>95 %</b> kommt zusätzlich ein zufälliger Kartenfund dazu.
   Weitere Karten gewinnst du in der Mittelerde-Reise, wenn du einen Gegner besiegst. Noch nicht entdeckte Karten bleiben geheim –
   jede gefundene Karte kannst du herunterladen, ausdrucken (63 × 88 mm) und ausschneiden.</div>
   <div class="sectionTitle" style="font-size:18px">Quest-Karten · ${nq} / ${qc.length}</div>
   <div class="albumGrid">${qc.map(x=>slot(x.c,x.i,"quest")).join("")}</div>
   <div class="sectionTitle" style="font-size:18px;margin-top:18px">🏅 Sonderkarten · ${ns} / ${sc.length}</div>
   <div class="albumGrid">${sc.map(x=>slot(x.c,x.i,"quest")).join("")}</div>
   ${setBlock("mittelerde")}
   ${setBlock("fusion")}
   ${setBlock("halbgoetter")}`;
  window.scrollTo(0,0);
}

/* ---------- Das Buch der Fakten ---------- */
function showFacts(){
  const got = S.facts||[];
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="sectionTitle">📖 Das Buch der Fakten</div>
   <div class="hint-sm">${got.length} von ${FACTS.length} Fakten entdeckt (Mittelerde 💍 und Pokémon ⚡). Neue Fakten erscheinen während der Quests – ungefähr alle 5 Aufgaben einer. Gesammelte Fakten bleiben hier für immer gespeichert.</div>
   ${FACTS.map((t,i)=>{
     const ok = got.includes(i);
     return `<div class="factRow ${ok?"":"lockedF"}">
       <span class="fnum">${ok?factCat(i).icon:(i+1)}</span>
       <p>${ok?t:"❓ Noch nicht entdeckt – spiele weiter, um diesen Fakt zu finden!"}</p>
     </div>`;
   }).join("")}`;
  window.scrollTo(0,0);
}

/* =========================================================
   Auswertung für Lehrer & Eltern
   ========================================================= */
function topicStats(){
  const map={};
  QUESTS.forEach(q=>{
    (TOPICS[q.id]||[]).forEach((top,i)=>{
      map[top]=map[top]||{a:0,c:0,n:0};
      map[top].n++;
      const st=(S.stats[q.id]||{})[i];
      if(st){ map[top].a+=st.a; map[top].c+=st.c; }
    });
  });
  return map;
}
function evalBucket(e){
  if(e.a===0) return 0;
  const r=e.c/e.a;
  if(e.a<3) return 1;
  if(r<0.6) return 2;
  if(r<0.85) return 3;
  return 4;
}
function barHTML(r){
  const col = r>=0.85 ? "#8fd08f" : r>=0.6 ? "#ffd76e" : "#ff8a7a";
  return `<div class="evBar"><i style="width:${Math.max(2,Math.round(r*100))}%;background:${col}"></i></div>`;
}
function showEval(){
  const map=topicStats();
  const rows=Object.entries(map).map(([t,e])=>({t,a:e.a,c:e.c,r:e.a?e.c/e.a:0,b:evalBucket(e)}));
  const total=rows.reduce((s,x)=>({a:s.a+x.a,c:s.c+x.c}),{a:0,c:0});
  const grp=b=>rows.filter(x=>x.b===b).sort((x,y)=>x.r-y.r);
  const row=x=>`<div class="evRow"><div class="evName">${x.t}</div>${barHTML(x.r)}<div class="evVal">${x.c} von ${x.a} richtig (${Math.round(x.r*100)} %)</div></div>`;
  const rowSimple=x=>`<div class="evRow"><div class="evName">${x.t}</div><div class="evVal">${x.a===0?"noch keine Antworten":x.c+" von "+x.a+" richtig – noch zu wenige Antworten für eine Einschätzung"}</div></div>`;
  const section=(title,arr,note,simple)=>arr.length?`<div class="evSec"><h3>${title}</h3>${arr.map(simple?rowSimple:row).join("")}${note?`<div class="hint-sm" style="margin-top:8px">${note}</div>`:""}</div>`:"";
  const quests=QUESTS.map(q=>{
    let a=0,c=0; Object.values(S.stats[q.id]||{}).forEach(s=>{a+=s.a;c+=s.c;});
    const best=S.best[q.id];
    return `<div class="evRow"><div class="evName">${q.num} – ${q.title}</div>${a?barHTML(c/a):""}<div class="evVal">${a?Math.round(c/a*100)+" % aller Antworten richtig ("+c+"/"+a+")":"noch nicht gespielt"}${best!=null?" · Beste Runde: "+best+" %":""}</div></div>`;
  }).join("");
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="sectionTitle">📊 Auswertung – Stärken & Schwächen</div>
   <div class="hint-sm">Für Lehrer und Eltern: Gezählt wird jede abgegebene Antwort, auch wenn eine Quest mehrmals gespielt wird. Ab 85 % gilt ein Thema als sicher, unter 60 % lohnt sich gezieltes Vertiefen.</div>
   ${total.a?`<div class="evSec"><h3>Gesamtüberblick</h3><div class="evRow"><div class="evName">Alle Themen zusammen</div>${barHTML(total.c/total.a)}<div class="evVal">${total.c} von ${total.a} Antworten richtig (${Math.round(total.c/total.a*100)} %)</div></div></div>`
            :`<div class="evSec"><h3>Gesamtüberblick</h3><p style="opacity:.8;margin:0">Noch keine Antworten aufgezeichnet – zuerst eine Quest spielen, dann erscheint hier die Auswertung.</p></div>`}
   ${section("🔴 Diese Themen vertiefen",grp(2),"Tipp: Das Regel-Pergament der passenden Quest noch einmal gemeinsam lesen und die Quest anschließend wiederholen – die Statistik zählt weiter mit.")}
   ${section("🟡 Auf gutem Weg – weiter üben",grp(3))}
   ${section("✅ Gut beherrscht",grp(4).sort((x,y)=>y.r-x.r))}
   ${section("⚪ Noch zu wenige Antworten",grp(1),null,true)}
   ${section("⚪ Noch nicht geübt",grp(0),null,true)}
   <div class="evSec"><h3>Nach Quests</h3>${quests}</div>
   <div class="evSec"><h3>Spielstand sichern & übertragen</h3>
     <div class="hint-sm" style="margin-top:0">Der Fortschritt wird automatisch auf diesem Gerät im Browser gespeichert.
     Zum Sichern oder Übertragen gibt es drei Wege:<br>
     <b>📤 Teilen / Sichern</b> – auf dem iPad der zuverlässigste Weg (dann „In Dateien sichern")<br>
     <b>💾 Als Datei laden</b> – klassischer Download nach Dateien → Downloads<br>
     <b>📋 Text anzeigen</b> – funktioniert immer: Text kopieren und z. B. in einer Notiz aufbewahren</div>
     <div class="btnRow">
       <button class="btn ghost" onclick="exportOrShare()">📤 Teilen / Sichern</button>
       <button class="btn ghost" onclick="exportState()">💾 Als Datei laden</button>
       <button class="btn ghost" id="impBtn" onclick="importState()">📥 Datei laden</button>
       <button class="btn ghost" onclick="showStateText()">📋 Text anzeigen</button>
     </div>
     <div id="saveMsg" style="display:none;margin-top:10px;padding:12px 14px;border:1px solid;border-radius:12px;
       background:rgba(0,0,0,.25);font-size:13.5px;line-height:1.5"></div>
   </div>
   <div class="btnRow"><button class="btn ghost" id="rst" onclick="resetStats()">🗑 Statistik zurücksetzen</button></div>`;
  window.scrollTo(0,0);
}
let rstArmed=false;
function resetStats(){
  const b=document.getElementById("rst");
  if(!rstArmed){
    rstArmed=true;
    if(b) b.textContent="Wirklich löschen? Zum Bestätigen noch einmal tippen.";
    setTimeout(()=>{ rstArmed=false; const x=document.getElementById("rst"); if(x) x.textContent="🗑 Statistik zurücksetzen"; },3000);
    return;
  }
  rstArmed=false; S.stats={}; saveState(); showEval();
}

/* ---------- Sterne + Start ---------- */
(function(){
  const s=document.getElementById("stars");
  for(let i=0;i<70;i++){
    const d=document.createElement("i");
    d.style.left=Math.random()*100+"%"; d.style.top=Math.random()*100+"%";
    d.style.animationDelay=(Math.random()*3)+"s";
    s.appendChild(d);
  }
})();
loadState().then(showHome);
</script>
</body>
</html>
