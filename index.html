<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Englisch-Abenteuer in Mittelerde – Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141b26;          /* Nachtblau – Hintergrund */
    --ink2:#1d2836;
    --parchment:#f5ead0;    /* Pergament */
    --parch2:#e9d9b4;
    --gold:#d9a83c;         /* Ring-Gold */
    --gold2:#b8862a;
    --ember:#e0763f;        /* Glut-Orange */
    --leaf:#5c8a5e;         /* Elben-Grün */
    --leaf2:#3f6b45;
    --wrong:#c05b4d;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #2a3a52 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #22392b 0%, transparent 55%),
      var(--ink);
    color:var(--parchment);
    min-height:100vh;
  }
  /* Sternenhimmel */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.5;animation:tw 3s infinite alternate}
  @keyframes tw{from{opacity:.15}to{opacity:.7}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  .app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:16px 14px 60px}

  /* ---------- Kopfzeile ---------- */
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .crest{width:52px;height:52px;flex:0 0 auto}
  h1{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(19px,4vw,28px);letter-spacing:.5px;
     background:linear-gradient(90deg,#f7e6b0,#d9a83c 55%,#f7e6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:13px;opacity:.75;width:100%}
  .hud{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .badge{background:rgba(217,168,60,.12);border:1px solid rgba(217,168,60,.5);border-radius:999px;
     padding:6px 14px;font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
  .xpbar{width:150px;height:10px;background:#0d1119;border-radius:99px;overflow:hidden;border:1px solid rgba(217,168,60,.4)}
  .xpbar>div{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .5s}

  /* ---------- Karten des Quest-Menüs ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-top:8px}
  .quest{
    background:linear-gradient(160deg,var(--ink2),#151d29);
    border:1px solid rgba(217,168,60,.35);border-radius:14px;padding:16px;cursor:pointer;
    transition:transform .15s, border-color .15s;box-shadow:var(--shadow);position:relative;overflow:hidden
  }
  .quest:hover{transform:translateY(-3px);border-color:var(--gold)}
  .quest .q-num{font-family:'Cinzel',serif;color:var(--gold);font-size:12px;letter-spacing:2px}
  .quest h3{font-family:'Cinzel',serif;font-size:17px;margin:6px 0 8px;color:var(--parchment)}
  .quest p{font-size:13px;opacity:.8;line-height:1.45}
  .quest .meta{display:flex;gap:8px;margin-top:12px;font-size:12px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.07);border-radius:99px;padding:3px 10px}
  .pill.done{background:rgba(92,138,94,.25);border:1px solid var(--leaf);color:#bfe3c1}
  .quest .stamp{position:absolute;top:10px;right:12px;font-size:22px}

  .albumBtn,.btn{
    font-family:'Nunito';font-weight:900;font-size:15px;border:none;border-radius:12px;cursor:pointer;
    padding:12px 22px;transition:transform .12s, box-shadow .12s
  }
  .btn{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#241a05;box-shadow:0 4px 0 #7a5a17}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 #7a5a17}
  .btn.ghost{background:transparent;color:var(--parchment);border:1px solid rgba(245,234,208,.4);box-shadow:none}
  .btn.green{background:linear-gradient(180deg,#6fa571,var(--leaf2));color:#0d1a0e;box-shadow:0 4px 0 #27462c}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* ---------- Regel-Pergament ---------- */
  .scroll{
    background:linear-gradient(180deg,var(--parchment),var(--parch2));
    color:#3a2c14;border-radius:14px;padding:22px 22px 26px;box-shadow:var(--shadow);
    border:1px solid #c9b581;position:relative
  }
  .scroll::before,.scroll::after{content:"";position:absolute;left:0;right:0;height:10px;background:radial-gradient(circle at 8px 5px,#c9b581 3px,transparent 4px) repeat-x;background-size:22px 10px;opacity:.55}
  .scroll::before{top:4px}.scroll::after{bottom:4px}
  .scroll h2{font-family:'Cinzel',serif;font-size:clamp(18px,3.4vw,24px);color:#6b4c12;margin-bottom:4px}
  .scroll .lead{font-size:14px;font-style:italic;opacity:.85;margin-bottom:14px}
  .rule{background:rgba(255,255,255,.5);border-left:4px solid var(--gold2);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:1.55}
  .rule b{color:#8a5a10}
  .rule .ex{display:block;margin-top:4px;font-style:italic;color:#245a2a;font-weight:700}
  .scroll table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;background:rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
  .scroll th,.scroll td{padding:6px 10px;border-bottom:1px solid #d9c79b;text-align:left}
  .scroll th{background:rgba(217,168,60,.25);font-family:'Cinzel',serif;font-size:12.5px}

  /* ---------- Übungsansicht ---------- */
  .exWrap{max-width:680px;margin:0 auto}
  .topRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .progress{flex:1;height:14px;background:#0d1119;border-radius:99px;border:1px solid rgba(217,168,60,.4);overflow:hidden}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--leaf2),#8fc491);transition:width .35s}
  .streak{font-weight:900;font-size:14px;color:#ffb35c;white-space:nowrap}
  .qCard{background:linear-gradient(160deg,var(--ink2),#151d29);border:1px solid rgba(217,168,60,.35);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .qType{font-size:11.5px;letter-spacing:2px;color:var(--gold);font-family:'Cinzel',serif;margin-bottom:10px}
  .qText{font-size:clamp(18px,3.6vw,23px);font-weight:900;line-height:1.45;margin-bottom:6px}
  .qText .blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold)}
  .qHint{font-size:13.5px;opacity:.75;font-style:italic;margin-bottom:14px}
  .opts{display:grid;gap:10px;margin-top:14px}
  @media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
  .opt{background:rgba(245,234,208,.06);border:1.5px solid rgba(245,234,208,.3);color:var(--parchment);
    border-radius:12px;padding:13px 16px;font-size:16.5px;font-weight:700;cursor:pointer;text-align:left;transition:all .12s;font-family:'Nunito'}
  .opt:hover{border-color:var(--gold);background:rgba(217,168,60,.12)}
  .opt.correct{background:rgba(92,138,94,.3);border-color:#8fc491;color:#d5f0d6}
  .opt.wrong{background:rgba(192,91,77,.25);border-color:var(--wrong);color:#f3c9c2}
  .opt:disabled{cursor:default}
  input.fillIn{width:100%;max-width:340px;background:#0d1119;border:1.5px solid rgba(217,168,60,.5);color:var(--parchment);
    font-size:19px;font-weight:700;padding:12px 16px;border-radius:12px;font-family:'Nunito';margin-top:12px}
  input.fillIn:focus{outline:none;border-color:var(--gold)}
  .chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:52px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;border:1px dashed rgba(245,234,208,.3)}
  .chipPool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{background:rgba(217,168,60,.16);border:1.5px solid rgba(217,168,60,.55);color:var(--parchment);
    border-radius:10px;padding:9px 14px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Nunito'}
  .chip:hover{background:rgba(217,168,60,.3)}
  .feedback{margin-top:16px;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;display:none;line-height:1.5}
  .feedback.ok{display:block;background:rgba(92,138,94,.2);border:1px solid var(--leaf);color:#cdeccf}
  .feedback.no{display:block;background:rgba(192,91,77,.18);border:1px solid var(--wrong);color:#f3d2cb}
  .btnRow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .xpPop{position:fixed;top:20%;left:50%;transform:translateX(-50%);font-family:'Cinzel',serif;font-weight:800;font-size:30px;color:var(--gold);
    text-shadow:0 2px 12px rgba(217,168,60,.7);pointer-events:none;opacity:0;z-index:50}
  .xpPop.show{animation:pop 1.1s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}

  /* ---------- Fun-Fact ---------- */
  .fact{background:linear-gradient(160deg,#243447,#1a2636);border:1px solid rgba(217,168,60,.5);border-radius:16px;padding:26px;box-shadow:var(--shadow);text-align:center;max-width:620px;margin:40px auto}
  .fact .ring{font-size:44px;display:block;margin-bottom:10px;animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fact h3{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:1.5px;font-size:15px;margin-bottom:12px}
  .fact p{font-size:17px;line-height:1.6;font-weight:700}

  /* ---------- Ergebnis + Kartenbelohnung ---------- */
  .result{text-align:center;max-width:680px;margin:0 auto}
  .result h2{font-family:'Cinzel',serif;font-size:clamp(22px,4.5vw,30px);color:var(--gold);margin:14px 0 6px}
  .scoreBig{font-size:44px;font-weight:900}
  .cardStage{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:22px 0}
  .cardBox{perspective:1000px}
  .cardBox img{width:230px;height:auto;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);transition:transform .25s}
  .cardBox:hover img{transform:rotateY(8deg) rotateX(-4deg) scale(1.03)}
  .cardBox .dl{margin-top:10px}
  .newTag{font-family:'Cinzel',serif;color:#ffd76e;font-size:13px;letter-spacing:2px;margin-bottom:6px;display:block}

  /* ---------- Album ---------- */
  .albumGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;margin-top:16px}
  .albumSlot{text-align:center}
  .albumSlot img{width:100%;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .albumSlot.locked img{filter:grayscale(1) brightness(.35)}
  .albumSlot .nm{font-size:13px;font-weight:900;margin-top:6px}
  .albumSlot .lk{font-size:12px;opacity:.65}
  .evSec{background:linear-gradient(160deg,var(--ink2),#151d29);border:1px solid rgba(217,168,60,.35);border-radius:16px;padding:16px 18px;margin:14px 0}
  .evSec h3{margin:0 0 10px;font-family:'Cinzel',serif;color:var(--gold);font-size:17px}
  .evRow{padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.1)}
  .evRow:last-child{border-bottom:none}
  .evName{font-weight:700;font-size:14px;margin-bottom:4px}
  .evBar{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:3px 0}
  .evBar i{display:block;height:100%;border-radius:6px}
  .evVal{font-size:12px;opacity:.75}
  .backRow{margin:10px 0 16px}
  .sectionTitle{font-family:'Cinzel',serif;color:var(--gold);font-size:clamp(18px,3.5vw,24px);margin:6px 0 4px}
  .hint-sm{font-size:13px;opacity:.7;margin-bottom:8px}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="app" id="app"></div>
<div class="xpPop" id="xpPop"></div>

   Basierend auf dem Lehrwerk (Greenwich / Sherlock der Hund)

let S = {xp:0, done:{}, best:{}, cards:[], stats:{}};
const KEY = "englisch-abenteuer-v3";
let storageOK = true;

async function loadState(){
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value) S = Object.assign(S, JSON.parse(r.value));
    S.stats = S.stats || {};
  }catch(e){ /* Schlüssel existiert noch nicht – kein Problem */ }
}
async function saveState(){
  if(!storageOK) return;
  try{ await window.storage.set(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; }
}
function level(){ return Math.min(Math.floor(S.xp/120), RANKS.length-1); }
function rank(){ return RANKS[level()]; }

}

    <div class="backRow" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" onclick="showAlbum()">🃏 Karten-Album öffnen</button><button class="btn ghost" onclick="showEval()">📊 Auswertung</button></div>
    <div class="grid">` +
    QUESTS.map((q,i)=>{
      const done = S.done[q.id], best=S.best[q.id];
      return `<div class="quest" onclick="showIntro(${i})">
        ${done?'<span class="stamp">✅</span>':''}
        <div class="q-num">${q.num}</div>
        <h3>${q.title}</h3>
        <p>${q.desc}</p>
        <div class="meta">
          <span class="pill">${q.ex.length} Übungen</span>
          ${best!=null?`<span class="pill ${best>=90?'done':''}">Beste: ${best}%</span>`:''}
          ${done?'<span class="pill done">Karte erhalten</span>':'<span class="pill">🎁 Karte wartet</span>'}
        </div>
      </div>`;
    }).join("") + `</div>`;
  window.scrollTo(0,0);
}

function showIntro(qi){
  const q = QUESTS[qi];
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="scroll">
     <h2>${q.num.replace("QUEST","📜 Quest").replace(" · ",": ")}</h2>
     <div class="lead">${q.title} — Lies zuerst die Regeln, dann beginnt die Prüfung!</div>
     ${q.rules.map(r=>`<div class="rule"><b>${r.h}</b><br>${r.t||""}
        ${r.table?`<table>${r.table.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`:""}
        ${r.ex?`<span class="ex">Beispiel: ${r.ex}</span>`:""}</div>`).join("")}
   </div>
   <div class="btnRow" style="justify-content:center;margin-top:18px">
     <button class="btn" onclick="startQuest(${qi})">⚔️ Quest starten (${q.ex.length} Übungen)</button>
   </div>`;
  window.scrollTo(0,0);
}

function startQuest(qi){
  const q = QUESTS[qi];
  run = {qi, order: shuffled(q.ex.map((_,i)=>i)), pos:0, correct:0, streak:0, factsUsed:[], answered:false};
  showExercise();
}

function factHTML(){
  let pool = FACTS.map((_,i)=>i).filter(i=>!run.factsUsed.includes(i));
  if(!pool.length){run.factsUsed=[];pool=FACTS.map((_,i)=>i);}
  const f = pool[Math.floor(Math.random()*pool.length)];
  run.factsUsed.push(f);
  return `<div class="fact">
    <span class="ring">💍</span>
    <h3>WUSSTEST DU? · MITTELERDE-FAKT</h3>
    <p>${FACTS[f]}</p>
    <div class="btnRow" style="justify-content:center"><button class="btn" onclick="renderExercise()">Weiter geht's! →</button></div>
  </div>`;
}

function showExercise(){
  const q = QUESTS[run.qi];
  if(run.pos >= run.order.length){ return finishQuest(); }
  // Fun-Fact alle 5 Aufgaben (nicht vor der ersten)
  if(run.pos>0 && run.pos % 5 === 0 && !run.factShown){
    run.factShown = true;
    app.innerHTML = headerHTML() + factHTML();
    window.scrollTo(0,0);
    return;
  }
  renderExercise();
}

function renderExercise(){
  run.factShown = false;
  run.answered = false;
  const q = QUESTS[run.qi];
  const ex = q.ex[run.order[run.pos]];
  const prog = Math.round(run.pos / run.order.length * 100);
  let body="";
  if(ex.type==="mc"){
    const opts = ex.opts.map((o,i)=>({o,i}));
    body = `<div class="opts">${shuffled(opts).map(x=>
      `<button class="opt" data-i="${x.i}" onclick="answerMC(this,${x.i})">${esc(x.o)}</button>`).join("")}</div>`;
  } else if(ex.type==="fill"){
    body = `<input class="fillIn" id="fillInput" autocomplete="off" autocapitalize="off" placeholder="Deine Antwort …"
      onkeydown="if(event.key==='Enter')checkFill()">
      <div class="btnRow"><button class="btn" onclick="checkFill()">Prüfen ✔</button></div>`;
  } else if(ex.type==="order"){
    body = `<div class="chipRow" id="built"></div>
      <div class="chipPool" id="pool">${shuffled(ex.words.map((w,i)=>({w,i}))).map(x=>
        `<button class="chip" data-w="${esc(x.w)}" onclick="pickChip(this)">${esc(x.w)}</button>`).join("")}</div>
      <div class="btnRow">
        <button class="btn" onclick="checkOrder()">Prüfen ✔</button>
        <button class="btn ghost" onclick="resetOrder()">Zurücksetzen ↺</button>
      </div>`;
  }
  const typeName = {mc:"MULTIPLE CHOICE", fill:"FILL IN THE BLANK", order:"WORT-BAUSTELLE"}[ex.type];
  app.innerHTML = headerHTML() + `
   <div class="exWrap">
    <div class="topRow">
      <button class="btn ghost" style="padding:8px 14px" title="Quest abbrechen" onclick="showHome()">✕</button>
      <div class="progress"><div style="width:${prog}%"></div></div>
      <span class="streak">${run.streak>=3?"🔥":"⚡"} Serie: ${run.streak}</span>
    </div>
    <div class="qCard">
      <div class="qType">${typeName} · Aufgabe ${run.pos+1} von ${run.order.length}</div>
      <div class="qText">${esc(ex.q).replace(/___/g,'<span class="blank">___</span>')}</div>
      ${ex.hint?`<div class="qHint">💡 ${esc(ex.hint)}</div>`:""}
      ${body}
      <div class="feedback" id="fb"></div>
      <div class="btnRow" id="nextRow" style="display:none">
        <button class="btn green" onclick="nextExercise()">Weiter →</button>
      </div>
    </div>
   </div>`;
  const inp=document.getElementById("fillInput"); if(inp) inp.focus();
  window.scrollTo(0,0);
}

function currentEx(){ return QUESTS[run.qi].ex[run.order[run.pos]]; }

function norm(s){ return s.toLowerCase().replace(/\u2019/g,"'").replace(/\s+/g," ").replace(/[.!?]$/,"").trim(); }

function resolve(ok, correctText){
  if(run.answered) return; run.answered=true;
  try{ // Statistik für die Lehrer-Auswertung
    const ei = run.order[run.pos], qid = QUESTS[run.qi].id;
    S.stats[qid] = S.stats[qid] || {};
    const st = S.stats[qid][ei] = S.stats[qid][ei] || {a:0,c:0};
    st.a++; if(ok) st.c++;
    if(!ok) saveState();
  }catch(e){}
  const fb = document.getElementById("fb");
  if(ok){
    run.correct++; run.streak++;
    const bonus = run.streak>=3 ? 5 : 0;
    S.xp += 10 + bonus; saveState();
    fb.className="feedback ok";
    fb.innerHTML = "✅ <b>Richtig!</b> +10 XP" + (bonus?` <b style="color:#ffb35c">+${bonus} Serien-Bonus 🔥</b>`:"");
    popXP("+"+(10+bonus)+" XP");
  } else {
    run.streak=0;
    fb.className="feedback no";
    fb.innerHTML = "❌ <b>Leider falsch.</b> Richtig ist: <b>"+esc(correctText)+"</b><br><span style='font-weight:400'>Merk es dir – die Karte wartet trotzdem auf dich!</span>";
  }
  document.getElementById("nextRow").style.display="flex";
  document.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  const inp=document.getElementById("fillInput"); if(inp) inp.disabled=true;
}

function answerMC(btn, i){
  if(run.answered) return;
  const ex = currentEx();
  const ok = i===ex.c;
  btn.classList.add(ok?"correct":"wrong");
  if(!ok){ document.querySelectorAll(".opt").forEach(b=>{ if(+b.dataset.i===ex.c) b.classList.add("correct"); }); }
  resolve(ok, ex.opts[ex.c]);
}
function checkFill(){
  if(run.answered) return;
  const ex = currentEx();
  const v = norm(document.getElementById("fillInput").value);
  if(!v) return;
  const ok = ex.c.some(a=>norm(a)===v);
  resolve(ok, ex.c[0]);
}
function pickChip(btn){
  if(run.answered) return;
  document.getElementById("built").appendChild(btn);
  btn.onclick = ()=>{ if(!run.answered){ document.getElementById("pool").appendChild(btn); btn.onclick=()=>pickChip(btn); } };
}
function resetOrder(){
  if(run.answered) return;
  const pool=document.getElementById("pool");
  document.querySelectorAll("#built .chip").forEach(ch=>{ pool.appendChild(ch); ch.onclick=()=>pickChip(ch); });
}
function checkOrder(){
  if(run.answered) return;
  const ex = currentEx();
  const built = [...document.querySelectorAll("#built .chip")].map(c=>c.dataset.w).join(" ");
  const ok = norm(built)===norm(ex.c);
  resolve(ok, ex.c);
}
function nextExercise(){ run.pos++; showExercise(); }

function popXP(t){
  const p=document.getElementById("xpPop");
  p.textContent=t; p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
}

function finishQuest(){
  const q = QUESTS[run.qi];
  const pct = Math.round(run.correct/run.order.length*100);
  const passed = pct>=60;
  const prevBest = S.best[q.id]||0;
  if(pct>prevBest) S.best[q.id]=pct;
  let newCards=[];
  if(passed){
    S.done[q.id]=true;
    q.cards60.forEach(ci=>{ if(!S.cards.includes(ci)){S.cards.push(ci); newCards.push(ci);} });
    if(pct>=90) q.cards90.forEach(ci=>{ if(!S.cards.includes(ci)){S.cards.push(ci); newCards.push(ci);} });
    S.xp += 25; // Abschlussbonus
  }
  saveState();
  const msg = pct>=90 ? "Legendär! Du hast auch die ✦-Bonuskarten freigeschaltet!"
            : passed ? "Quest gemeistert! Tipp: Ab 90 % gibt es zusätzliche ✦-Bonuskarten."
            : "Fast! Du brauchst mindestens 60 %, um die Karte zu erhalten. Lies die Regeln noch einmal und versuch es erneut – du schaffst das!";
  app.innerHTML = headerHTML() + `
   <div class="result">
     <h2>${passed?"🏆 Quest bestanden!":"🛡️ Tapfer gekämpft!"}</h2>
     <div class="scoreBig">${run.correct} / ${run.order.length} <span style="font-size:22px;opacity:.8">(${pct} %)</span></div>
     <p style="margin:10px 0;font-size:16px;font-weight:700">${msg}</p>
     ${passed?`<p style="opacity:.8;font-size:14px">+25 XP Abschlussbonus</p>`:""}
     <div class="cardStage">
       ${newCards.map(ci=>`
         <div class="cardBox">
           <span class="newTag">✦ NEUE KARTE ✦</span>
           ${cardIMG(CARDS[ci])}
           <div class="dl"><button class="btn" onclick="downloadCard(${ci})">⬇ Karte herunterladen (PNG)</button></div>
         </div>`).join("")}
       ${passed && !newCards.length ? `<p style="opacity:.75">Diese Karten besitzt du schon – schau ins Album!</p>`:""}
     </div>
     <div class="btnRow" style="justify-content:center">
       ${!passed?`<button class="btn" onclick="showIntro(${run.qi})">↺ Nochmal versuchen</button>`:""}
       <button class="btn green" onclick="showAlbum()">🃏 Zum Album</button>
       <button class="btn ghost" onclick="showHome()">Zur Questkarte</button>
     </div>
   </div>`;
  window.scrollTo(0,0);
}

function showAlbum(){
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="sectionTitle">🃏 Dein Karten-Album</div>
   <div class="hint-sm">Schließe Quests mit mindestens 60 % ab, um Karten zu gewinnen. Ab 90 % gibt es zusätzlich die ✦-Bonuskarten! Jede Karte kannst du als Bild herunterladen, ausdrucken (63 × 88 mm) und ausschneiden.</div>
   <div class="albumGrid">` +
   CARDS.map((c,i)=>{
     const owned = S.cards.includes(i);
     return `<div class="albumSlot ${owned?"":"locked"}">
       ${cardIMG(c)}
       <div class="nm">${owned?c.name:"???"} ${c.tier===90?"✦":""}</div>
       ${owned?`<button class="btn" style="padding:8px 14px;font-size:13px;margin-top:6px" onclick="downloadCard(${i})">⬇ Bild</button>`
              :`<div class="lk">🔒 Quest ${c.q+1} ${c.tier===90?"mit 90 %":"bestehen"}</div>`}
     </div>`;
   }).join("") + `</div>`;
  window.scrollTo(0,0);
}

/* =========================================================
   Auswertung für Lehrer & Eltern
   ========================================================= */
function topicStats(){
  const map={};
  QUESTS.forEach(q=>{
    (TOPICS[q.id]||[]).forEach((top,i)=>{
      map[top]=map[top]||{a:0,c:0,n:0};
      map[top].n++;
      const st=(S.stats[q.id]||{})[i];
      if(st){ map[top].a+=st.a; map[top].c+=st.c; }
    });
  });
  return map;
}
function evalBucket(e){
  if(e.a===0) return 0;
  const r=e.c/e.a;
  if(e.a<3) return 1;
  if(r<0.6) return 2;
  if(r<0.85) return 3;
  return 4;
}
function barHTML(r){
  const col = r>=0.85 ? "#8fd08f" : r>=0.6 ? "#ffd76e" : "#ff8a7a";
  return `<div class="evBar"><i style="width:${Math.max(2,Math.round(r*100))}%;background:${col}"></i></div>`;
}
function showEval(){
  const map=topicStats();
  const rows=Object.entries(map).map(([t,e])=>({t,a:e.a,c:e.c,r:e.a?e.c/e.a:0,b:evalBucket(e)}));
  const total=rows.reduce((s,x)=>({a:s.a+x.a,c:s.c+x.c}),{a:0,c:0});
  const grp=b=>rows.filter(x=>x.b===b).sort((x,y)=>x.r-y.r);
  const row=x=>`<div class="evRow"><div class="evName">${x.t}</div>${barHTML(x.r)}<div class="evVal">${x.c} von ${x.a} richtig (${Math.round(x.r*100)} %)</div></div>`;
  const rowSimple=x=>`<div class="evRow"><div class="evName">${x.t}</div><div class="evVal">${x.a===0?"noch keine Antworten":x.c+" von "+x.a+" richtig – noch zu wenige Antworten für eine Einschätzung"}</div></div>`;
  const section=(title,arr,note,simple)=>arr.length?`<div class="evSec"><h3>${title}</h3>${arr.map(simple?rowSimple:row).join("")}${note?`<div class="hint-sm" style="margin-top:8px">${note}</div>`:""}</div>`:"";
  const quests=QUESTS.map(q=>{
    let a=0,c=0; Object.values(S.stats[q.id]||{}).forEach(s=>{a+=s.a;c+=s.c;});
    const best=S.best[q.id];
    return `<div class="evRow"><div class="evName">${q.num.replace("QUEST ","Quest ")}: ${q.title}</div>${a?barHTML(c/a):""}<div class="evVal">${a?Math.round(c/a*100)+" % aller Antworten richtig ("+c+"/"+a+")":"noch nicht gespielt"}${best!=null?" · Beste Runde: "+best+" %":""}</div></div>`;
  }).join("");
  app.innerHTML = headerHTML() + `
   <div class="backRow"><button class="btn ghost" onclick="showHome()">← Zur Questkarte</button></div>
   <div class="sectionTitle">📊 Auswertung – Stärken & Schwächen</div>
   <div class="hint-sm">Für Lehrer und Eltern: Gezählt wird jede abgegebene Antwort, auch wenn eine Quest mehrmals gespielt wird. Ab 85 % gilt ein Thema als sicher, unter 60 % lohnt sich gezieltes Vertiefen.</div>
   ${total.a?`<div class="evSec"><h3>Gesamtüberblick</h3><div class="evRow"><div class="evName">Alle Themen zusammen</div>${barHTML(total.c/total.a)}<div class="evVal">${total.c} von ${total.a} Antworten richtig (${Math.round(total.c/total.a*100)} %)</div></div></div>`
            :`<div class="evSec"><h3>Gesamtüberblick</h3><p style="opacity:.8;margin:0">Noch keine Antworten aufgezeichnet – zuerst eine Quest spielen, dann erscheint hier die Auswertung.</p></div>`}
   ${section("🔴 Diese Themen vertiefen",grp(2),"Tipp: Das Regel-Pergament der passenden Quest noch einmal gemeinsam lesen und die Quest anschließend wiederholen – die Statistik zählt weiter mit.")}
   ${section("🟡 Auf gutem Weg – weiter üben",grp(3))}
   ${section("✅ Gut beherrscht",grp(4).sort((x,y)=>y.r-x.r))}
   ${section("⚪ Noch zu wenige Antworten",grp(1),null,true)}
   ${section("⚪ Noch nicht geübt",grp(0),null,true)}
   <div class="evSec"><h3>Nach Quests</h3>${quests}</div>
   <div class="btnRow"><button class="btn ghost" id="rst" onclick="resetStats()">🗑 Statistik zurücksetzen</button></div>`;
  window.scrollTo(0,0);
}
let rstArmed=false;
function resetStats(){
  const b=document.getElementById("rst");
  if(!rstArmed){
    rstArmed=true;
    if(b) b.textContent="Wirklich löschen? Zum Bestätigen noch einmal tippen.";
    setTimeout(()=>{ rstArmed=false; const x=document.getElementById("rst"); if(x) x.textContent="🗑 Statistik zurücksetzen"; },3000);
    return;
  }
  rstArmed=false; S.stats={}; saveState(); showEval();
}

/* ---------- Sterne + Start ---------- */
(function(){
  const s=document.getElementById("stars");
  for(let i=0;i<70;i++){
    const d=document.createElement("i");
    d.style.left=Math.random()*100+"%"; d.style.top=Math.random()*100+"%";
    d.style.animationDelay=(Math.random()*3)+"s";
    s.appendChild(d);
  }
})();
loadState().then(showHome);
</script>
</body>
</html>
